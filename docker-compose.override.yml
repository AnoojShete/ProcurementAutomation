services:
  # Each service owner appends their service block here when ready.

  # --- contract-risk-agent (Anjali) ---
  contract-risk-agent:
    image: ${COMPOSE_PROJECT_NAME}-contract-risk-agent
    build:
      context: .
      dockerfile: services/contract-risk-agent/Dockerfile
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      # Demo stack: allows the well-known dev secrets, demo accounts and
      # showcase/simulated-signing features. Unset = production rules.
      APP_ENV: ${APP_ENV:-development}
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_USER:-postgres}
      APP_REDIS_URL: redis://redis:6379/0
      APP_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # This service's own Kafka login (permissions: infra/redpanda/acls.conf).
      KAFKA_USERNAME: contract-risk-agent
      KAFKA_PASSWORD: ${KAFKA_PASSWORD_CONTRACT_RISK_AGENT:-dev-kafka-contract-risk-agent}
      APP_TEMPORAL_HOST: temporal:7233
      APP_MLFLOW_TRACKING_URI: http://mlflow:5000
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      APP_ESIGN_WEBHOOK_SECRET: ${ESIGN_WEBHOOK_SECRET:-dev-esign-secret-change-me}
      # Optional live Documenso (see .env.example); unset = signing is
      # simulated or done with the built-in e-sign.
      APP_DOCUMENSO_API_URL: ${APP_DOCUMENSO_API_URL:-}
      APP_DOCUMENSO_API_TOKEN: ${APP_DOCUMENSO_API_TOKEN:-}
      APP_DOCUMENSO_WEBHOOK_SECRET: ${APP_DOCUMENSO_WEBHOOK_SECRET:-}
      # Optional live DocuSign, sandbox by default (see .env.example); unset
      # = "docusign" sends are simulated.
      APP_DOCUSIGN_INTEGRATION_KEY: ${APP_DOCUSIGN_INTEGRATION_KEY:-}
      APP_DOCUSIGN_USER_ID: ${APP_DOCUSIGN_USER_ID:-}
      APP_DOCUSIGN_ACCOUNT_ID: ${APP_DOCUSIGN_ACCOUNT_ID:-}
      APP_DOCUSIGN_PRIVATE_KEY: ${APP_DOCUSIGN_PRIVATE_KEY:-}
      APP_DOCUSIGN_PRIVATE_KEY_FILE: ${APP_DOCUSIGN_PRIVATE_KEY_FILE:-}
      APP_DOCUSIGN_AUTH_SERVER: ${APP_DOCUSIGN_AUTH_SERVER:-account-d.docusign.com}
      APP_DOCUSIGN_BASE_URL: ${APP_DOCUSIGN_BASE_URL:-https://demo.docusign.net/restapi}
      APP_DOCUSIGN_CONNECT_HMAC_KEY: ${APP_DOCUSIGN_CONNECT_HMAC_KEY:-}
      # Drop-folder contracts are sent for signature automatically, once.
      APP_ESIGN_AUTO_SEND: ${APP_ESIGN_AUTO_SEND:-true}
      APP_ESIGN_AUTO_SIGNER_EMAIL: ${APP_ESIGN_AUTO_SIGNER_EMAIL:-}
      APP_ESIGN_AUTO_SIGNER_NAME: ${APP_ESIGN_AUTO_SIGNER_NAME:-Authorized Signer}
      # FR-13: Legal-BERT clause model, pre-downloaded into hf-cache
      # (scripts/download-models.sh); never fetched while generating a contract.
      HF_HOME: /app/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Optional: put the DocuSign RSA key in ./secrets (git-ignored) and set
      # APP_DOCUSIGN_PRIVATE_KEY_FILE=/run/secrets/app/<file>.
      - ./secrets:/run/secrets/app:ro
      # FR-14: sanctions list index (./scripts/download-sanctions.sh).
      - sanctions-data:/app/data/sanctions
      # FR-13: Legal-BERT clause model (~440 MB), shared with the LayoutLMv3 cache.
      - hf-cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health || exit 1"]
      interval: 10s
      retries: 8
      start_period: 120s

  contract-risk-agent-worker:
    # Same image as contract-risk-agent (built once, by that service).
    image: ${COMPOSE_PROJECT_NAME}-contract-risk-agent
    pull_policy: never
    command: ["python", "-m", "app.worker"]
    restart: on-failure
    environment:
      # Demo stack: allows the well-known dev secrets, demo accounts and
      # showcase/simulated-signing features. Unset = production rules.
      APP_ENV: ${APP_ENV:-development}
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_USER:-postgres}
      APP_REDIS_URL: redis://redis:6379/0
      APP_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # This service's own Kafka login (permissions: infra/redpanda/acls.conf).
      KAFKA_USERNAME: contract-risk-agent
      KAFKA_PASSWORD: ${KAFKA_PASSWORD_CONTRACT_RISK_AGENT:-dev-kafka-contract-risk-agent}
      APP_TEMPORAL_HOST: temporal:7233
      APP_MLFLOW_TRACKING_URI: http://mlflow:5000
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      APP_ESIGN_WEBHOOK_SECRET: ${ESIGN_WEBHOOK_SECRET:-dev-esign-secret-change-me}
      # Optional live Documenso (see .env.example); unset = signing is
      # simulated or done with the built-in e-sign.
      APP_DOCUMENSO_API_URL: ${APP_DOCUMENSO_API_URL:-}
      APP_DOCUMENSO_API_TOKEN: ${APP_DOCUMENSO_API_TOKEN:-}
      APP_DOCUMENSO_WEBHOOK_SECRET: ${APP_DOCUMENSO_WEBHOOK_SECRET:-}
      # Optional live DocuSign, sandbox by default (see .env.example); unset
      # = "docusign" sends are simulated.
      APP_DOCUSIGN_INTEGRATION_KEY: ${APP_DOCUSIGN_INTEGRATION_KEY:-}
      APP_DOCUSIGN_USER_ID: ${APP_DOCUSIGN_USER_ID:-}
      APP_DOCUSIGN_ACCOUNT_ID: ${APP_DOCUSIGN_ACCOUNT_ID:-}
      APP_DOCUSIGN_PRIVATE_KEY: ${APP_DOCUSIGN_PRIVATE_KEY:-}
      APP_DOCUSIGN_PRIVATE_KEY_FILE: ${APP_DOCUSIGN_PRIVATE_KEY_FILE:-}
      APP_DOCUSIGN_AUTH_SERVER: ${APP_DOCUSIGN_AUTH_SERVER:-account-d.docusign.com}
      APP_DOCUSIGN_BASE_URL: ${APP_DOCUSIGN_BASE_URL:-https://demo.docusign.net/restapi}
      APP_DOCUSIGN_CONNECT_HMAC_KEY: ${APP_DOCUSIGN_CONNECT_HMAC_KEY:-}
      # Drop-folder contracts are sent for signature automatically, once.
      APP_ESIGN_AUTO_SEND: ${APP_ESIGN_AUTO_SEND:-true}
      APP_ESIGN_AUTO_SIGNER_EMAIL: ${APP_ESIGN_AUTO_SIGNER_EMAIL:-}
      APP_ESIGN_AUTO_SIGNER_NAME: ${APP_ESIGN_AUTO_SIGNER_NAME:-Authorized Signer}
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      contract-risk-agent:
        condition: service_healthy

  # --- approval-inventory-agent (Niraj) ---
  approval-inventory-agent:
    image: ${COMPOSE_PROJECT_NAME}-approval-inventory-agent
    build:
      context: .
      dockerfile: services/approval-inventory-agent/Dockerfile
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      # Demo stack: allows the well-known dev secrets, demo accounts and
      # showcase/simulated-signing features. Unset = production rules.
      APP_ENV: ${APP_ENV:-development}
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_USER:-postgres}
      APP_REDIS_URL: redis://redis:6379/0
      APP_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # This service's own Kafka login (permissions: infra/redpanda/acls.conf).
      KAFKA_USERNAME: approval-inventory-agent
      KAFKA_PASSWORD: ${KAFKA_PASSWORD_APPROVAL_INVENTORY_AGENT:-dev-kafka-approval-inventory-agent}
      APP_TEMPORAL_HOST: temporal:7233
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 10s
      retries: 8
      start_period: 60s

  approval-inventory-agent-worker:
    # Same image as approval-inventory-agent (built once, by that service).
    image: ${COMPOSE_PROJECT_NAME}-approval-inventory-agent
    pull_policy: never
    command: ["python", "-m", "app.worker"]
    restart: on-failure
    environment:
      # Demo stack: allows the well-known dev secrets, demo accounts and
      # showcase/simulated-signing features. Unset = production rules.
      APP_ENV: ${APP_ENV:-development}
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_USER:-postgres}
      APP_REDIS_URL: redis://redis:6379/0
      APP_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # This service's own Kafka login (permissions: infra/redpanda/acls.conf).
      KAFKA_USERNAME: approval-inventory-agent
      KAFKA_PASSWORD: ${KAFKA_PASSWORD_APPROVAL_INVENTORY_AGENT:-dev-kafka-approval-inventory-agent}
      APP_TEMPORAL_HOST: temporal:7233
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      approval-inventory-agent:
        condition: service_healthy

  # --- auth-service (Anooj, Prompt 5 Part A) ---
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "127.0.0.1:8005:8005"
    environment:
      # Demo stack: allows the well-known dev secrets, demo accounts and
      # showcase/simulated-signing features. Unset = production rules.
      APP_ENV: ${APP_ENV:-development}
      AUTH_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_USER:-postgres}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # This service's own Kafka login (permissions: infra/redpanda/acls.conf).
      KAFKA_USERNAME: auth-service
      KAFKA_PASSWORD: ${KAFKA_PASSWORD_AUTH_SERVICE:-dev-kafka-auth-service}
      RULES_ENGINE_INTERNAL_SECRET: ${RULES_ENGINE_INTERNAL_SECRET:-dev-rules-secret-change-me}
      # Account emails (shared/mailer.py). Defaults: Mailpit. Set these in
      # .env for real delivery — see .env.example.
      EMAIL_MODE: ${EMAIL_MODE:-dev}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-Procurement Platform <noreply@procurement.local>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      AUTH_LOCKOUT_THRESHOLD: ${AUTH_LOCKOUT_THRESHOLD:-5}
      AUTH_LOCKOUT_WINDOW_MINUTES: ${AUTH_LOCKOUT_WINDOW_MINUTES:-15}
      AUTH_LOCKOUT_MINUTES: ${AUTH_LOCKOUT_MINUTES:-15}
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8005/health || exit 1"]
      interval: 10s
      retries: 8
      start_period: 30s

  # --- document-vendor-agent (Vaidehi) ---
  document-vendor-agent:
    image: ${COMPOSE_PROJECT_NAME}-document-vendor-agent
    build:
      context: .
      dockerfile: services/document-vendor-agent/Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      # Demo stack: allows the well-known dev secrets, demo accounts and
      # showcase/simulated-signing features. Unset = production rules.
      APP_ENV: ${APP_ENV:-development}
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_USER:-postgres}
      APP_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      APP_REDIS_URL: redis://redis:6379/0
      # This service's own Kafka login (permissions: infra/redpanda/acls.conf).
      KAFKA_USERNAME: document-vendor-agent
      KAFKA_PASSWORD: ${KAFKA_PASSWORD_DOCUMENT_VENDOR_AGENT:-dev-kafka-document-vendor-agent}
      APP_MINIO_ENDPOINT: minio:9000
      APP_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      APP_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      APP_MINIO_BUCKET: documents
      APP_MINIO_SECURE: "false"
      APP_CLAMAV_ENABLED: "true"
      APP_CLAMAV_HOST: clamav
      APP_CLAMAV_PORT: "3310"
      APP_GSTINCHECK_API_KEY: ${GSTINCHECK_API_KEY:-}
      HF_HOME: /app/.cache/huggingface
      # Models are pre-downloaded (scripts/download-models.sh); never call
      # huggingface.co while processing documents.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      # Read-only Kafka login for the control panel's live event log.
      EVENT_MONITOR_KAFKA_USERNAME: event-monitor
      EVENT_MONITOR_KAFKA_PASSWORD: ${KAFKA_PASSWORD_EVENT_MONITOR:-dev-kafka-event-monitor}
    volumes:
      - hf-cache:/app/.cache/huggingface
      # Drop folder, read-only here: the control panel lists it.
      - ./inbox:/inbox:ro
    depends_on:
      redis:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Uploads fail closed (503) without ClamAV. Service starts immediately
      # while ClamAV loads signatures in the background.
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      retries: 8
      start_period: 60s

  document-vendor-agent-worker:
    # Same image as document-vendor-agent (built once, by that service).
    image: ${COMPOSE_PROJECT_NAME}-document-vendor-agent
    pull_policy: never
    command: ["python", "-m", "app.worker"]
    restart: on-failure
    environment:
      # Demo stack: allows the well-known dev secrets, demo accounts and
      # showcase/simulated-signing features. Unset = production rules.
      APP_ENV: ${APP_ENV:-development}
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_USER:-postgres}
      APP_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # This service's own Kafka login (permissions: infra/redpanda/acls.conf).
      KAFKA_USERNAME: document-vendor-agent
      KAFKA_PASSWORD: ${KAFKA_PASSWORD_DOCUMENT_VENDOR_AGENT:-dev-kafka-document-vendor-agent}
      APP_MINIO_ENDPOINT: minio:9000
      APP_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      APP_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      APP_MINIO_BUCKET: documents
      APP_MINIO_SECURE: "false"
      APP_GSTINCHECK_API_KEY: ${GSTINCHECK_API_KEY:-}
      HF_HOME: /app/.cache/huggingface
      # Models are pre-downloaded (scripts/download-models.sh); never call
      # huggingface.co while processing documents.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # Signs the service token for the invoice -> PO search call.
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      # Email intake (BR-1): documents emailed to the intake address. In
      # development it reads Mailpit over POP3 (read-only); set
      # EMAIL_INTAKE_HOST etc. for a real mailbox (pop3 or imap).
      APP_EMAIL_INTAKE_ENABLED: ${EMAIL_INTAKE_ENABLED:-true}
      APP_EMAIL_INTAKE_PROTOCOL: ${EMAIL_INTAKE_PROTOCOL:-pop3}
      APP_EMAIL_INTAKE_HOST: ${EMAIL_INTAKE_HOST:-mailpit}
      APP_EMAIL_INTAKE_PORT: ${EMAIL_INTAKE_PORT:-1110}
      APP_EMAIL_INTAKE_SSL: ${EMAIL_INTAKE_SSL:-false}
      APP_EMAIL_INTAKE_USER: ${EMAIL_INTAKE_USER:-intake}
      APP_EMAIL_INTAKE_PASSWORD: ${EMAIL_INTAKE_PASSWORD:-dev-intake-password}
      APP_EMAIL_INTAKE_ADDRESS: ${EMAIL_INTAKE_ADDRESS:-invoices@procurement.local}
    # docling-models: Docling layout/table models (~300MB).
    # hf-cache: LayoutLMv3 model (~1GB).
    # paddleocr-models: PaddleOCR detection/recognition weights (~20MB).
    # All downloaded once ever and reused across container rebuilds.
    volumes:
      - docling-models:/root/.cache/huggingface
      - hf-cache:/app/.cache/huggingface
      - paddleocr-models:/root/.paddleocr
      # Drop folder: files put in ./inbox are ingested automatically
      # (app/services/inbox_watcher.py).
      - ./inbox:/inbox
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      document-vendor-agent:
        condition: service_healthy

  # --- notification-agent (Anooj) ---
  notification-agent:
    build:
      context: .
      dockerfile: services/notification-agent/Dockerfile
    ports:
      - "127.0.0.1:8004:8004"
    environment:
      # Demo stack: allows the well-known dev secrets, demo accounts and
      # showcase/simulated-signing features. Unset = production rules.
      APP_ENV: ${APP_ENV:-development}
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_USER:-postgres}
      APP_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # This service's own Kafka login (permissions: infra/redpanda/acls.conf).
      KAFKA_USERNAME: notification-agent
      KAFKA_PASSWORD: ${KAFKA_PASSWORD_NOTIFICATION_AGENT:-dev-kafka-notification-agent}
      # Email delivery (shared/mailer.py): EMAIL_MODE=dev (Mailpit) or EMAIL_MODE=smtp (real provider)
      EMAIL_MODE: ${EMAIL_MODE:-dev}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-Procurement Platform <noreply@procurement.local>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8004/health || exit 1"]
      interval: 10s
      retries: 8
      start_period: 30s

  # --- chatbot-agent ---
  chatbot-agent:
    build:
      context: .
      dockerfile: services/chatbot-agent/Dockerfile
    ports:
      - "127.0.0.1:8006:8006"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_USER:-postgres}
      APP_REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      # External Ollama LLM on the local network
      APP_LLM_API_BASE_URL: ${LLM_API_BASE_URL:-http://host.docker.internal:11434}
      APP_LLM_MODEL_NAME: ${LLM_MODEL_NAME:-llama3.1}
      APP_ORDERS_API_BASE_URL: http://approval-inventory-agent:8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8006/health || exit 1"]
      interval: 10s
      retries: 8
      start_period: 30s
      
  # --- frontend ---
  # No separate frontend container/port: the built static files
  # (frontend/dist, produced by run.sh's frontend-build step) are volume-
  # mounted straight into the existing `nginx` gateway container (base
  # docker-compose.yml) and served from `/`, alongside the /api/* proxy
  # routes already defined in infra/nginx/nginx.conf. Same origin for the
  # page and its API calls means zero CORS configuration.
  nginx:
    volumes:
      # React/Vite build output — see run.sh's frontend-build step. Built
      # outside Docker Compose (a throwaway node container) since it's a
      # static-file build, not a long-running service.
      - ./frontend/dist:/usr/share/nginx/frontend:ro

  # --- observability ---
  # Prompt 0/4 provisioned a Prometheus datasource + dashboard config on
  # disk, but the base grafana service never actually mounted them in —
  # Grafana had zero datasources configured. Wired in here.
  grafana:
    volumes:
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboard-json:ro

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.3
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "/mlruns", "--default-artifact-root", "/mlruns"]
    ports:
      - "127.0.0.1:5050:5000"
    volumes:
      - mlflow-data:/mlruns

volumes:
  sanctions-data:
  mlflow-data:
  docling-models:
  # HF model cache for LayoutLMv3 (ngvozdenovic/invoice_extraction ~1GB).
  # Shared between the API and worker containers so the model is downloaded
  # exactly once, whichever container starts first.
  hf-cache:
  paddleocr-models:
