services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:latest
    # --advertise-kafka-addr is required so clients that bootstrap from
    # redpanda:9092 get told to reconnect to redpanda:9092 too — without
    # it, redpanda advertises localhost:9092 in its metadata response and
    # every service's producer/consumer fails with "No connection to node
    # with id 0" the moment it tries to actually publish/consume.
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --advertise-kafka-addr
      - redpanda:9092
    ports:
      - 9092:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info || exit 1"]
      interval: 10s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --compat --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready || exit 1"]
      interval: 10s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - 9090:9090

  grafana:
    image: grafana/grafana:latest
    ports:
      - 3000:3000
    volumes:
      - grafana-data:/var/lib/grafana

  nginx:
    image: nginx:stable
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    command: ["--kafka.server=redpanda:9092"]
    ports:
      - "9308:9308"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.21
    # Without these, auto-setup defaults to DB=cassandra and refuses to
    # start ("CASSANDRA_SEEDS env must be set") — it needs to be told
    # explicitly to use the shared postgres instance instead.
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 7233:7233

  temporal-ui:
    image: temporalio/ui:latest
    # Current UI images listen on 8080 by default and read TEMPORAL_ADDRESS;
    # TEMPORAL_GRPC_ENDPOINT is the pre-2.x name and is ignored.
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_UI_PORT=8088
    ports:
      - 8088:8088

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - 8025:8025
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 10s
      retries: 5
  # --- ClamAV (malware scanning for document-vendor-agent uploads) ---
  # Native multi-arch image (amd64 + arm64). The old clamav/clamav:stable_base
  # has no arm64 build, so on Apple Silicon it ran under x86 emulation and
  # took ~50s to load signatures (2-3 min on a fresh volume, because
  # freshclam also ran emulated). Natively clamd answers in ~4s.
  # The signature DB ships inside the image, so boot never blocks on a
  # download; freshclamd updates it in the background and clamd reloads.
  clamav:
    image: clamav/clamav-debian:1.5
    ports:
      - 3310:3310
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s   # poll every second while starting, so "healthy" lands within ~1s of clamd being ready

volumes:
  pgdata:
  miniodata:
  grafana-data:
  clamav-data:

networks:
  default:
    name: it-procurement-network
