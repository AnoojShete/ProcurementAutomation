services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:latest
    # --advertise-kafka-addr is required so clients that bootstrap from
    # redpanda:9092 get told to reconnect to redpanda:9092 too — without
    # it, redpanda advertises localhost:9092 in its metadata response and
    # every service's producer/consumer fails with "No connection to node
    # with id 0" the moment it tries to actually publish/consume.
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --advertise-kafka-addr
      - redpanda:9092
    ports:
      - 9092:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info || exit 1"]
      interval: 10s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --compat
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - 9000:9000
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready || exit 1"]
      interval: 10s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - 9090:9090

  grafana:
    image: grafana/grafana:latest
    ports:
      - 3000:3000
    volumes:
      - grafana-data:/var/lib/grafana

  nginx:
    image: nginx:stable
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80

  temporal:
    image: temporalio/auto-setup:1.21
    # Without these, auto-setup defaults to DB=cassandra and refuses to
    # start ("CASSANDRA_SEEDS env must be set") — it needs to be told
    # explicitly to use the shared postgres instance instead.
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 7233:7233

  temporal-ui:
    image: temporalio/ui:latest
    environment:
      - TEMPORAL_GRPC_ENDPOINT=temporal:7233
    ports:
      - 8088:8088

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - 8025:8025
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 10s
      retries: 5

  clamav:
    image: clamav/clamav:stable_base
    command: ["sh", "-c", "freshclam -d & clamd"]
    ports:
      - 3310:3310
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 127.0.0.1:3310 && test -f /var/lib/clamav/main.cvd"]
      interval: 10s
      retries: 30

volumes:
  pgdata:
  miniodata:
  grafana-data:

networks:
  default:
    name: it-procurement-network
