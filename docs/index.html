<h1 id="competitive-analysis">Competitive analysis</h1>
<p>Based on the 12 products in Scry AI, <em>Best Procurement Automation Software</em>
(https://scryai.com/blog/best-procurement-automation-software/), each checked on
the vendor's own pages where they could be fetched (20 October 2026). Vendor
pages are marketing material; accuracy and adoption figures quoted by vendors
are their claims, not verified.</p>
<blockquote>
<p><strong>Since this snapshot (21 Oct 2026):</strong> the gaps it found were closed by the
feature expansion (<a href="feature-expansion-plan.md">feature-expansion-plan.md</a>):
budget control (Phase 1), contract obligations (Phase 2), IT catalog, RFQs
and partial receipts (Phase 3), and Indian GST and TDS: GST check with the
signed e-invoice QR, reverse charge, GSTR-2B reconciliation, TDS at booking,
MSME deadlines (Phase 4). The tables below are kept as they were found.</p>
</blockquote>
<h2 id="1-choosing-the-five-competitors">1. Choosing the five competitors</h2>
<p>Each product was scored on the eight capability areas our platform covers:
document capture and extraction, vendor verification and fraud controls,
invoice matching, requisitions and approvals, inventory, software licences,
contracts and renewals, supplier risk (1 = covered, ½ = partly, 0 = not stated).</p>

<td>Every area except licences; 50+ AI agents</td>

<p>The five competitors are <strong>Coupa, Zapro, SAP Ariba, Ivalua and TYASuite</strong>.
Collatio is not one of the five, but it is the closest to our document agent and
research (matching an invoice against several records), so it is discussed in
the research gap.</p>
<p><strong>Top competitor: Coupa.</strong> It overlaps with the most areas (7 of 8), has the
most mature AI (invoice capture via Rossum, obligation extraction from
contracts, supplier-risk and sanctions agents) and adds budgets, sourcing,
catalogs, a supplier network and payments. <strong>Zapro</strong> is the closest peer in
size and scope: mid-market, AI intake, contracts with renewal alerts, inventory,
and the only other product that tracks software licences.</p>

<!-- ───────────────────────── Problem ───────────────────────── -->
<h2 id="problem">The problem and the answer</h2>
<p class="sub">Start here in every interview. If you can say these two boxes clearly, the rest is detail.</p>
<div class="pa">
  <div class="box prob">
    <h3>The problem</h3>
    <p>IT procurement in most companies is a chain of manual hand-offs. Each one is slow, and the risky cases are the easiest to miss: a fake or duplicate invoice, a vendor's bank account quietly changed, a vendor that is sanctioned or unreliable.</p>
    <div class="chain"><span>retype the invoice</span><span>chase the approver</span><span>draft the contract</span><span>wait for a signature</span><span>check invoice against order by eye</span></div>
  </div>
  <div class="box ans">
    <h3>What we built</h3>
    <p>Five cooperating services ("agents") that run the whole chain. AI reads the documents; people step in only to approve, sign, confirm delivery, or review what the system isn't sure about. Every action is audited.</p>
    <div class="chain"><span>read &amp; classify</span><span>match &amp; vet vendor</span><span>approve by spend tier</span><span>generate &amp; sign contract</span><span>three-way match invoice</span></div>
  </div>
</div>
<p class="muted" style="margin-top:12px">Users: <b>requesters</b> (ask to buy), <b>approvers</b> (decide by spend tier), <b>finance</b> (vendors, bank details, invoices, tax), <b>admins</b> (business rules, users, monitoring).</p>

<!-- ───────────────────────── Pitch ───────────────────────── -->
<h2 id="pitch">The pitch at three lengths</h2>
<p class="sub">Pick the one that fits the time you're given. Practise them out loud; don't read them.</p>
<div class="pitch">
  <div class="box" style="--c:var(--blue)">
    <div class="t">10 seconds</div>
    <p>An IT procurement platform that takes a vendor's invoice or quote and carries it automatically to a signed contract and a matched payment, with people only making the decisions.</p>
  </div>
  <div class="box" style="--c:var(--purple)">
    <div class="t">30 seconds</div>
    <p>Five Python services, connected by Kafka events, each owning one part of procurement: documents and vendors, approvals and inventory, contracts and risk, notifications, and accounts. Documents are read with OCR and layout models, approvals run as durable Temporal workflows, and every vendor gets an auditable 100-point risk score before we can buy from them or sign with them.</p>
  </div>
  <div class="box" style="--c:var(--teal)">
    <div class="t">2 minutes: add</div>
    <ul>
      <li>Fraud controls: two-person check on bank-detail changes, look-alike vendor names, sanctions screening.</li>
      <li>Reliability: transactional outbox, retries, a dead-letter queue, workflows that survive restarts.</li>
      <li>Indian context: GST checks, signed e-invoice QR, TDS, MSME deadlines.</li>
      <li>Research: deciding when an invoice is safe to accept without review, with a fixed error budget.</li>
    </ul>
  </div>
</div>

<!-- ───────────────────────── Stack ───────────────────────── -->
<h2 id="stack">Tech stack: what, why, and why not the others</h2>
<p class="sub">For each tool: what it is in one line, why it fits this project, and the alternatives we would be asked about. "Not chosen" is the reasoning to give, kept honest: most rejections are about fit for a student team on one machine, not about the other tool being bad.</p>
<div class="filters" role="group" aria-label="Filter by layer">
  <button type="button" data-f="all" aria-pressed="true">All</button>
  <button type="button" data-f="backend" aria-pressed="false">Backend</button>
  <button type="button" data-f="events" aria-pressed="false">Events &amp; workflows</button>
  <button type="button" data-f="data" aria-pressed="false">Data &amp; storage</button>
  <button type="button" data-f="ai" aria-pressed="false">AI / ML</button>
  <button type="button" data-f="front" aria-pressed="false">Frontend</button>
  <button type="button" data-f="ops" aria-pressed="false">Ops &amp; security</button>
</div>
<div class="stack" id="stack-grid">

  <div class="tool" data-l="backend" style="--c:var(--blue)">
    <div class="hd"><b>Python + FastAPI</b><span class="tag">Backend</span></div>
    <dl><dt>What</dt><dd>Async Python web framework; request and response shapes are Pydantic models.</dd>
    <dt>Why</dt><dd>The ML stack (PaddleOCR, transformers, scikit-learn) is Python, so the services can be too. Validation and OpenAPI docs come free from the type hints; async suits a service that mostly waits on Postgres and Kafka.</dd>
    <dt>Not</dt><dd class="no"><s>Django</s>: a full monolith framework with its own ORM and admin we wouldn't use. <s>Flask</s>: no built-in validation or async. <s>Node / Java</s>: would split the team across two languages and put the models behind another hop.</dd></dl>
  </div>

  <div class="tool" data-l="backend" style="--c:var(--blue)">
    <div class="hd"><b>SQLAlchemy + Alembic / raw SQL migrations</b><span class="tag">Backend</span></div>
    <dl><dt>What</dt><dd>The ORM, and versioned schema migrations per service.</dd>
    <dt>Why</dt><dd>Each service owns and migrates its own tables in one shared database. Alembic services keep their own version table so they don't collide; raw-SQL migrations are written to be re-runnable (<code>IF NOT EXISTS</code>).</dd>
    <dt>Not</dt><dd class="no"><s>Hand-applied SQL</s>: drifts between machines. <s>One global migration folder</s>: every team would edit the same files and break each other's services.</dd></dl>
  </div>

  <div class="tool" data-l="events" style="--c:var(--orange)">
    <div class="hd"><b>Kafka API on Redpanda</b><span class="tag">Events</span></div>
    <dl><dt>What</dt><dd>An event log: services publish facts ("document classified", "approval decided") and others react.</dd>
    <dt>Why</dt><dd>Keeps services decoupled; events are kept, so a consumer that was down catches up. Partitions (6 for documents) keep related events in order and let several workers share the load. Redpanda speaks the Kafka protocol but is one binary with no ZooKeeper or JVM, which matters on a laptop.</dd>
    <dt>Not</dt><dd class="no"><s>Apache Kafka</s>: same API, heavier to run locally. <s>RabbitMQ</s>: a queue, not a log; messages are gone once read, so no replay. <s>Direct HTTP calls</s>: one service down would fail the whole chain.</dd></dl>
  </div>

  <div class="tool" data-l="events" style="--c:var(--orange)">
    <div class="hd"><b>Transactional outbox + DLQ</b><span class="tag">Pattern</span></div>
    <dl><dt>What</dt><dd>The event is written to an outbox table in the same database transaction as the change, then relayed to Kafka. Consumers retry, then park failures in <code>event_dlq</code>.</dd>
    <dt>Why</dt><dd>Solves the dual-write problem: without it, a crash between "save row" and "publish event" leaves the two disagreeing. Failed events are shown, never silently lost.</dd>
    <dt>Not</dt><dd class="no"><s>Publish after commit</s>: loses events on a crash (we found and fixed one of these, G6). <s>Distributed transactions (2PC)</s>: Kafka doesn't join them, and they're fragile.</dd></dl>
  </div>

  <div class="tool" data-l="events" style="--c:var(--orange)">
    <div class="hd"><b>Temporal</b><span class="tag">Workflows</span></div>
    <dl><dt>What</dt><dd>Durable workflow engine: code that can wait days, survives restarts and resumes where it was.</dd>
    <dt>Why</dt><dd>An approval can wait days with SLA reminders and escalation; a contract renewal reminder fires months later. Temporal stores the workflow's state, so a restart doesn't lose the timer.</dd>
    <dt>Not</dt><dd class="no"><s>Celery + cron</s>: we'd have to build the state machine, timers and recovery ourselves. <s>Airflow</s>: built for scheduled batch DAGs, not one long-running process per request. <s>Camunda</s>: BPMN and a Java engine; more to learn than the problem needs.</dd></dl>
  </div>

  <div class="tool" data-l="data" style="--c:var(--teal)">
    <div class="hd"><b>PostgreSQL (+ pgvector)</b><span class="tag">Data</span></div>
    <dl><dt>What</dt><dd>One relational database shared by the services; pgvector adds embedding search for the assistant.</dd>
    <dt>Why</dt><dd>Procurement data is relational (request → approval → contract → invoice) and needs transactions, which the outbox depends on. CHECK constraints back up the status machine. pgvector keeps search in SQL, so access rules apply per chunk.</dd>
    <dt>Not</dt><dd class="no"><s>MongoDB</s>: no natural joins for a three-way match; weaker multi-row transactions. <s>A separate vector DB (Pinecone, Chroma)</s>: another service to run and to keep access rules in sync with.</dd></dl>
  </div>

  <div class="tool" data-l="data" style="--c:var(--teal)">
    <div class="hd"><b>MinIO</b><span class="tag">Files</span></div>
    <dl><dt>What</dt><dd>S3-compatible object storage for the original uploaded files.</dd>
    <dt>Why</dt><dd>Same API as Amazon S3, so production can switch to S3 with configuration, not code. Keeps large binaries out of Postgres.</dd>
    <dt>Not</dt><dd class="no"><s>Files in Postgres</s>: bloats the database and backups. <s>Local disk</s>: tied to one container. <s>Real S3</s>: needs a cloud account; we don't deploy anywhere.</dd></dl>
  </div>

  <div class="tool" data-l="data" style="--c:var(--teal)">
    <div class="hd"><b>Redis</b><span class="tag">Cache</span></div>
    <dl><dt>What</dt><dd>In-memory store.</dd>
    <dt>Why</dt><dd>Idempotency keys (a retried request gets the same answer for 24 h instead of acting twice) and short-lived locks for inventory reservations.</dd>
    <dt>Not</dt><dd class="no"><s>Postgres for this too</s>: possible, but these are short-lived, high-churn keys that expire on their own in Redis.</dd></dl>
  </div>

  <div class="tool" data-l="ai" style="--c:var(--purple)">
    <div class="hd"><b>pdfplumber · Docling · PaddleOCR</b><span class="tag">Reading documents</span></div>
    <dl><dt>What</dt><dd>Text PDFs read directly (pdfplumber), scanned PDFs through Docling, images through PaddleOCR after deskew and upscale.</dd>
    <dt>Why</dt><dd>Use the cheapest reader that works: a text PDF needs no OCR at all. PaddleOCR handles tables and skewed scans well, runs offline, and is free. Runs in a killable subprocess with a 120 s limit so a bad file can't hang the worker.</dd>
    <dt>Not</dt><dd class="no"><s>Tesseract</s>: weaker on tables and noisy scans. <s>AWS Textract / Azure Document Intelligence</s>: invoices with bank details would leave the company, and each page costs money.</dd></dl>
  </div>

  <div class="tool" data-l="ai" style="--c:var(--purple)">
    <div class="hd"><b>LayoutLMv3</b><span class="tag">Cross-check</span></div>
    <dl><dt>What</dt><dd>A model that reads text together with its position on the page.</dd>
    <dt>Why</dt><dd>A second opinion on each document; if it disagrees with the main extraction, the document goes to a person. Also the fallback reader when OCR quality is low.</dd>
    <dt>Not</dt><dd class="no"><s>Make it the primary extractor</s>: slower, and needs fine-tuning on labelled invoices we don't have. <s>Donut and similar</s>: the research gap analysis decided not to compete on extraction accuracy.</dd></dl>
  </div>

  <div class="tool" data-l="ai" style="--c:var(--purple)">
    <div class="hd"><b>TF-IDF + logistic regression</b><span class="tag">Classifier</span></div>
    <dl><dt>What</dt><dd>Sorts a document into invoice, PO, quote or other. Used when it's at least 60 % sure; keyword rules otherwise.</dd>
    <dt>Why</dt><dd>Small, fast and explainable. Kept only because it beat the keyword rules on held-out document kinds (macro-F1 1.0 vs 0.844); the training script would drop it otherwise.</dd>
    <dt>Not</dt><dd class="no"><s>A BERT classifier</s>: heavier with nothing left to gain on four classes. <s>Keywords only</s>: fall to 0.60 on documents without a title.</dd></dl>
  </div>

  <div class="tool" data-l="ai" style="--c:var(--purple)">
    <div class="hd"><b>Legal-BERT (CUAD) for clauses</b><span class="tag">Contracts</span></div>
    <dl><dt>What</dt><dd>A legal-language model fine-tuned on CUAD (lawyer-annotated contracts) that finds renewal, notice and expiry clauses.</dd>
    <dt>Why</dt><dd>Measured on 102 held-out contracts: F1 0.85 / 0.80 / 0.91 against 0.50 / 0.19 / 0.02 for the regex rules it replaced. The regex stays as the fallback.</dd>
    <dt>Not</dt><dd class="no"><s>An LLM (GPT, Claude)</s>: contracts sent to a third party, cost per call, and answers that can change run to run. <s>Regex only</s>: the numbers above.</dd></dl>
  </div>

  <div class="tool" data-l="ai" style="--c:var(--purple)">
    <div class="hd"><b>IsolationForest + SHAP</b><span class="tag">Licence usage</span></div>
    <dl><dt>What</dt><dd>Unsupervised anomaly score on licence logins; SHAP explains which signal drove each score.</dd>
    <dt>Why</dt><dd>There are no labels for "this licence is wasted", so a supervised model has nothing to learn from. ROC-AUC 0.954 on the simulated patterns, against 0.687 for "low utilisation" alone.</dd>
    <dt>Not</dt><dd class="no"><s>A fixed utilisation threshold</s>: misses seats used only at weekends or abandoned recently. <s>Supervised models</s>: no ground truth.</dd></dl>
  </div>

  <div class="tool" data-l="ai" style="--c:var(--pink)">
    <div class="hd"><b>Deterministic 100-point risk ruleset</b><span class="tag">Vendor risk</span></div>
    <dl><dt>What</dt><dd>Every check gives integer points (identity 39, performance 35, cyber 17, company 6, reputation 3); hard overrides such as a sanctions match force High.</dd>
    <dt>Why</dt><dd>A buying decision must be explained and replayed exactly. Same inputs, same score, every point traceable to a check and its source. It ranks the synthetic incidents as well as the model did (0.738 vs 0.715).</dd>
    <dt>Not</dt><dd class="no"><s>The Random Forest</s> we started with: retired because it can't show why one vendor got its score, and replaying a past score needs the exact model version. Its code is archived.</dd></dl>
  </div>

  <div class="tool" data-l="ai" style="--c:var(--grey)">
    <div class="hd"><b>MLflow</b><span class="tag">Model tracking</span></div>
    <dl><dt>What</dt><dd>Records model training runs, parameters and metrics.</dd>
    <dt>Why</dt><dd>Shows which model version produced which result; runs locally in a container.</dd>
    <dt>Not</dt><dd class="no"><s>Weights &amp; Biases</s>: hosted, needs accounts. <s>Spreadsheets</s>: not tied to the code that produced them.</dd></dl>
  </div>

  <div class="tool" data-l="ai" style="--c:var(--grey)">
    <div class="hd"><b>Ollama (local LLM) for the assistant</b><span class="tag">Anooj's part</span></div>
    <dl><dt>What</dt><dd>A local model (llama3.2:3b) answering from retrieved platform records, with citations.</dd>
    <dt>Why</dt><dd>Procurement data stays on the machine and there's no per-call cost. Retrieval checks access per chunk, so a requester can't pull someone else's data.</dd>
    <dt>Not</dt><dd class="no"><s>A hosted API (OpenAI, Anthropic)</s>: sends company data out. <s>Function-calling agents</s>: harder to keep inside access rules. Let Anooj take deep questions on this.</dd></dl>
  </div>

  <div class="tool" data-l="front" style="--c:var(--green)">
    <div class="hd"><b>React + TypeScript + Vite</b><span class="tag">Frontend</span></div>
    <dl><dt>What</dt><dd>A single-page app, built by Vite and served by nginx.</dd>
    <dt>Why</dt><dd>React is widely known with a large ecosystem; TypeScript catches API shape mistakes at build time; Vite builds fast. One home page per item (request, contract, vendor…) with its actions in one component per agent.</dd>
    <dt>Not</dt><dd class="no"><s>Next.js</s>: server rendering adds a Node server and buys nothing for a logged-in internal tool. <s>Angular</s>: steeper to learn in a semester.</dd></dl>
  </div>

  <div class="tool" data-l="front" style="--c:var(--green)">
    <div class="hd"><b>Tailwind + "Ledger" design tokens</b><span class="tag">Design</span></div>
    <dl><dt>What</dt><dd>Utility CSS; colours, type and spacing come from one tokens file.</dd>
    <dt>Why</dt><dd>One place to change the look, light and dark themes from the same tokens, and status shown only through shared Badge components so it reads the same everywhere.</dd>
    <dt>Not</dt><dd class="no"><s>A component kit like Material UI</s>: looks generic and fights a custom design. <s>Hand-written CSS per page</s>: drifts.</dd></dl>
  </div>

  <div class="tool" data-l="ops" style="--c:var(--grey)">
    <div class="hd"><b>Docker Compose</b><span class="tag">Ops</span></div>
    <dl><dt>What</dt><dd>Runs all 22 containers on one machine with one command (<code>./run.sh</code>).</dd>
    <dt>Why</dt><dd>Anyone on the team, or an evaluator, gets the same stack from a fresh clone. Every image is pinned to a version.</dd>
    <dt>Not</dt><dd class="no"><s>Kubernetes</s>: built for many machines; for one laptop it is overhead with no benefit. The deployment tab covers what changes beyond one machine.</dd></dl>
  </div>

  <div class="tool" data-l="ops" style="--c:var(--grey)">
    <div class="hd"><b>nginx gateway</b><span class="tag">Ops</span></div>
    <dl><dt>What</dt><dd>The only public port: serves the app and routes <code>/api/&lt;svc&gt;</code> to each service.</dd>
    <dt>Why</dt><dd>One origin for the browser (no CORS), rate limits on login and email-sending endpoints, security headers, a correlation id on every request, upload size caps.</dd>
    <dt>Not</dt><dd class="no"><s>Kong / Traefik</s>: API-gateway features we don't need yet. <s>Exposing each service</s>: five ports to secure instead of one.</dd></dl>
  </div>

  <div class="tool" data-l="ops" style="--c:var(--grey)">
    <div class="hd"><b>Prometheus · Grafana · Loki</b><span class="tag">Observability</span></div>
    <dl><dt>What</dt><dd>Metrics, dashboards and searchable logs.</dd>
    <dt>Why</dt><dd>One correlation id follows a request through every service's logs and events, so a failure can be traced end to end.</dd>
    <dt>Not</dt><dd class="no"><s>ELK (Elasticsearch)</s>: much heavier on memory. <s>Datadog</s>: paid and hosted.</dd></dl>
  </div>

  <div class="tool" data-l="ops" style="--c:var(--red)">
    <div class="hd"><b>ClamAV</b><span class="tag">Security</span></div>
    <dl><dt>What</dt><dd>Open-source virus scanner for every upload.</dd>
    <dt>Why</dt><dd>Documents arrive from outside (email, drop folder). Fails closed: if ClamAV is down, uploads are refused (503), not let through.</dd>
    <dt>Not</dt><dd class="no"><s>Commercial scanners / VirusTotal</s>: cost, and VirusTotal shares uploaded files.</dd></dl>
  </div>

  <div class="tool" data-l="ops" style="--c:var(--red)">
    <div class="hd"><b>JWT + httpOnly refresh cookie, argon2id</b><span class="tag">Security</span></div>
    <dl><dt>What</dt><dd>15-minute access token kept in memory; 7-day refresh token in an httpOnly, SameSite=Strict cookie with a CSRF check. Passwords hashed with argon2id.</dd>
    <dt>Why</dt><dd>Each service verifies the token itself, with no session lookup. Identity for audit fields always comes from the token, never from the request body.</dd>
    <dt>Not</dt><dd class="no"><s>Tokens in localStorage</s>: readable by any injected script. <s>bcrypt</s>: still verified for old hashes and upgraded at login, but argon2id is the current recommendation.</dd></dl>
  </div>

  <div class="tool" data-l="ops" style="--c:var(--red)">
    <div class="hd"><b>Built-in e-signature</b><span class="tag">Contracts</span></div>
    <dl><dt>What</dt><dd>Signing inside the platform, with a SHA-256 seal and a certificate.</dd>
    <dt>Why</dt><dd>Signing is where the vendor-risk gate must hold; built in, the platform controls it. The certificate records the vendor's risk at signing. No external accounts needed to demo.</dd>
    <dt>Not</dt><dd class="no"><s>DocuSign / Documenso</s>: the client exists but is switched off; with it on, the risk check would have to move to send time.</dd></dl>
  </div>
</div>

<!-- ───────────────────────── Decisions ───────────────────────── -->
<h2 id="decisions">The six decisions you'll be pushed on</h2>
<p class="sub">Each one was a trade-off. Say what we chose, what we gave up, and why the cost was acceptable here.</p>
<div class="adr">
  <div class="box">
    <div class="left"><b>One shared database</b><span>instead of a database per service</span></div>
    <div>
      <div class="vs"><div class="y"><b>Chosen</b>One Postgres; each service owns its tables and migrations; services talk through events.</div>
      <div class="n"><b>Not chosen</b>A database per service: the textbook microservice rule.</div></div>
      <p class="cost"><b>Cost:</b> services can couple through tables. We hit this: a foreign key across services fails when the other service's row isn't committed yet (open P0). <b>Why accepted:</b> one machine, one team, simpler backups and joins for reporting.</p>
    </div>
  </div>
  <div class="box">
    <div class="left"><b>Events through an outbox</b><span>instead of calling each other</span></div>
    <div>
      <div class="vs"><div class="y"><b>Chosen</b>Write the event in the same transaction; relay to Kafka; consumers dedupe, retry, then dead-letter.</div>
      <div class="n"><b>Not chosen</b>HTTP calls between services, or publishing right after commit.</div></div>
      <p class="cost"><b>Cost:</b> eventual consistency, so screens can lag a second behind. <b>Why accepted:</b> nothing is lost or half-done when a service crashes.</p>
    </div>
  </div>
  <div class="box">
    <div class="left"><b>Rules over ML for vendor risk</b><span>retired the Random Forest</span></div>
    <div>
      <div class="vs"><div class="y"><b>Chosen</b>A fixed 100-point ruleset; models only produce observations, never points.</div>
      <div class="n"><b>Not chosen</b>A learned risk score.</div></div>
      <p class="cost"><b>Cost:</b> weights are set by hand, not learned. <b>Why accepted:</b> it ranks as well (0.738 vs 0.715), and every score can be explained and replayed, which a procurement audit needs.</p>
    </div>
  </div>
  <div class="box">
    <div class="left"><b>Missing data is never safe</b><span>fail closed everywhere</span></div>
    <div>
      <div class="vs"><div class="y"><b>Chosen</b>A vendor with checks missing is banded on the checks that ran but stays provisional and is never cleared (nothing checked = High); ClamAV down blocks uploads; an unscored vendor isn't cleared.</div>
      <div class="n"><b>Not chosen</b>Default to "OK" when a check can't run.</div></div>
      <p class="cost"><b>Cost:</b> a band from fewer checks is less certain, so it is labelled provisional and shows how many points were checked. <b>Why accepted:</b> an "Unrated" vendor told reviewers nothing (owner decision, 30 Oct 2026); the dangerous error, clearing a vendor on missing data, is still blocked.</p>
    </div>
  </div>
  <div class="box">
    <div class="left"><b>Local models only</b><span>no cloud AI APIs</span></div>
    <div>
      <div class="vs"><div class="y"><b>Chosen</b>PaddleOCR, LayoutLMv3, Legal-BERT, scikit-learn and Ollama, all on the machine.</div>
      <div class="n"><b>Not chosen</b>Textract, Azure Document Intelligence, hosted LLMs.</div></div>
      <p class="cost"><b>Cost:</b> big images (~15 GB), slower cold starts, smaller models. <b>Why accepted:</b> invoices and contracts hold bank details and prices; nothing leaves the company and nothing is billed per page.</p>
    </div>
  </div>
  <div class="box">
    <div class="left"><b>Business rules in the database</b><span>not constants in code</span></div>
    <div>
      <div class="vs"><div class="y"><b>Chosen</b>47 rules (thresholds, limits, switches) admins change live, with a change history.</div>
      <div class="n"><b>Not chosen</b>Hard-coded values or environment variables.</div></div>
      <p class="cost"><b>Cost:</b> a rule nobody seeded could be read by mistake. <b>Why accepted:</b> a test fails if code reads an unseeded key, and every rule has a behaviour test.</p>
    </div>
  </div>
</div>

<!-- ───────────────────────── Q&A ───────────────────────── -->
<h2 id="qa">Q&amp;A bank</h2>
<p class="sub">Short answers first, then the points to mention, then what to say if they keep pushing. Search or open them all.</p>
<div class="qbar">
  <input type="search" id="qsearch" placeholder="Search questions, e.g. Kafka, risk, security" aria-label="Search questions">
  <button type="button" id="qopen">Open all</button>
  <button type="button" id="qclose">Close all</button>
</div>
<div id="qlist">

<div class="qcat" style="--c:var(--blue)">Project and problem</div>
<details class="q"><summary>What problem does this solve, and for whom?</summary><div class="a">
  <p>Company IT purchasing is a chain of manual steps: someone retypes invoices, chases approvers, drafts contracts and checks invoices against orders by eye. It's slow, and fraud like a changed bank account slips through. We automate the chain for requesters, approvers, finance and admins, and keep people only on decisions.</p>
  <div class="pts"><span>manual hand-offs</span><span>fraud is easy to miss</span><span>people decide, system does the rest</span></div>
</div></details>
<details class="q"><summary>Why call them "agents"? Are they LLM agents?</summary><div class="a">
  <p>No. Each agent is a service that owns one part of procurement and acts on its own when an event arrives: reads a document, starts an approval, scores a vendor. Inside they are rule and ML stages. The only LLM is the assistant.</p>
  <div class="push"><b>If pushed:</b> we chose predictable stages on purpose. A procurement decision has to be explained afterwards, and an LLM choosing the steps is harder to audit.</div>
</div></details>
<details class="q"><summary>What would you say is the most technically interesting part?</summary><div class="a">
  <p>Pick one you can go deep on. Good choices: the document pipeline (three readers, a cross-check model, a confidence gate), the outbox and dead-letter design, or the risk clearance that fails closed and can't be overridden for a sanctions match.</p>
  <div class="push"><b>Tip:</b> name it, say why it was hard, say how you tested it. Thirty seconds, then let them ask.</div>
</div></details>
<details class="q"><summary>How is this different from Coupa, SAP Ariba and the other suites?</summary><div class="a">
  <p>They are far broader and production-proven; we don't claim to compete. What we can show: auditable, replayable vendor risk; Indian tax checks (GST, e-invoice QR, TDS, MSME) built in; and everything runs locally with no data leaving the company.</p>
  <div class="pts"><span>see the Competitors tab</span><span>be modest</span></div>
</div></details>

<div class="qcat" style="--c:var(--orange)">Architecture and reliability</div>
<details class="q"><summary>Why microservices for a student project? Isn't a monolith simpler?</summary><div class="a">
  <p>The project brief split the work into agents owned by different team members. Separate services let four people work without stepping on each other, and let a heavy part (OCR) scale or fail without taking down approvals.</p>
  <div class="push"><b>If pushed:</b> agree that a monolith would have been simpler to run. We paid for it in setup (22 containers) and in the shared-database coupling, which we can name.</div>
</div></details>
<details class="q"><summary>You share one database. Isn't that a distributed monolith?</summary><div class="a">
  <p>Partly, and it's a known trade-off. Each service owns its tables and migrations and they communicate through events, not by writing each other's tables. But they can still read shared tables, and that coupling has bitten us once: a cross-service foreign key failing on an uncommitted row.</p>
  <div class="push"><b>If pushed:</b> the next step would be giving each service its own schema, then its own database, with read models built from events.</div>
</div></details>
<details class="q"><summary>What happens if a service crashes halfway through?</summary><div class="a">
  <p>The change and its event commit together (outbox), so there's no half-state. The document worker claims a row (<code>pending → processing</code>) so a redelivered event can't process twice. A sweep every minute re-queues stuck documents; after 5 failed attempts it's marked failed with a readable reason. Temporal workflows resume where they were.</p>
  <div class="pts"><span>outbox</span><span>idempotent consumers</span><span>retry + DLQ</span><span>sweep</span><span>Temporal</span></div>
</div></details>
<details class="q"><summary>What is the dual-write problem?</summary><div class="a">
  <p>Saving to the database and publishing to Kafka are two separate systems; if the process dies between them, they disagree. The outbox makes it one write: the event is a row in the same transaction, and a relay publishes it afterwards, at least once.</p>
  <div class="push"><b>Follow-up:</b> at-least-once means duplicates are possible, so consumers dedupe on the event id.</div>
</div></details>
<details class="q"><summary>Why Temporal and not just a status column and a cron job?</summary><div class="a">
  <p>An approval waits days, sends reminders, escalates to the next level when the SLA is missed, and must survive restarts. With cron we'd rebuild timers, retries and state recovery by hand. Temporal persists the workflow so it resumes exactly.</p>
</div></details>
<details class="q"><summary>How do you trace one request across five services?</summary><div class="a">
  <p>nginx adds an <code>X-Correlation-ID</code>; every service logs it and carries it on events. In Grafana (Loki) one search shows the request's path through every service.</p>
</div></details>
<details class="q"><summary>How would you scale this beyond one machine?</summary><div class="a">
  <p>The services are stateless, so run more copies behind the gateway; the document topic's 6 partitions already let several workers share the load. Move Postgres, Kafka and object storage to managed services (S3 in place of MinIO needs only configuration). Add TLS on Kafka.</p>
  <div class="pts"><span>stateless services</span><span>partitions</span><span>managed infra</span><span>see Deployment tab</span></div>
</div></details>

<div class="qcat" style="--c:var(--purple)">AI and ML</div>
<details class="q"><summary>Walk me through what happens when an invoice arrives.</summary><div class="a">
  <p>Virus scan, type checked from its bytes, stored in MinIO, row and event saved together. The worker reads it (pdfplumber, Docling or PaddleOCR), classifies it, extracts fields, cross-checks with LayoutLMv3, matches the vendor and checks GSTIN and bank details, converts to INR, matches it against the order, checks duplicates, then scores confidence. Below 0.8 it goes to a person.</p>
  <div class="pts"><span>scan</span><span>read</span><span>classify</span><span>extract</span><span>cross-check</span><span>vendor</span><span>match</span><span>duplicate</span><span>confidence</span></div>
</div></details>
<details class="q"><summary>How do you know the models are any good?</summary><div class="a">
  <p>Each one is measured against a baseline and kept only if it wins: the classifier against keywords, Legal-BERT against regex on 102 lawyer-annotated contracts, the anomaly model against a utilisation threshold. Results are in <code>docs/results/</code>.</p>
  <div class="push"><b>Be honest:</b> apart from CUAD, the test data is synthetic. The numbers compare methods; they don't promise real-world accuracy.</div>
</div></details>
<details class="q"><summary>Why not just use GPT / an LLM to read invoices?</summary><div class="a">
  <p>Invoices carry bank details and prices, so we keep them on the machine. LLM output can change from run to run and is hard to calibrate into a confidence we can gate on. Per-page cost adds up at volume.</p>
  <div class="push"><b>If pushed:</b> an LLM could be a useful extra reader for messy layouts, behind the same confidence gate. It's a reasonable next experiment.</div>
</div></details>
<details class="q"><summary>What does "fallback" mean in your model routing?</summary><div class="a">
  <p>Each model has a simpler backup: Legal-BERT falls back to regex, the classifier to keywords, OCR to LayoutLMv3 when quality is low. Every routing decision is logged with its reason, and a development-only rule forces the fallback so it can be shown live.</p>
</div></details>
<details class="q"><summary>What is your research contribution?</summary><div class="a">
  <p>Deciding when an invoice is safe to accept without review, with a fixed error budget. Today's rule accepts 41 % of invoices, but 6.8 % of those are wrong. A calibrated gate that adds enterprise evidence (the PO, the vendor master, invoice history) separates right from wrong far better than the document alone: AUROC 0.95–0.97 vs 0.72.</p>
  <div class="push"><b>Caveat to say first:</b> 3,000 synthetic invoices. At very tight budgets the gate accepts almost nothing; that's the honest result, and it ships behind a rule with today's heuristic as default.</div>
</div></details>

<div class="qcat" style="--c:var(--pink)">Vendor risk</div>
<details class="q"><summary>Why did you replace the ML risk model with rules?</summary><div class="a">
  <p>A vendor decision has to be explained ("why is this vendor Medium?") and replayed exactly months later. The ruleset does both and ranks synthetic incidents as well as the Random Forest (ROC-AUC 0.738 vs 0.715, ceiling 0.739).</p>
  <div class="pts"><span>explainable</span><span>replayable</span><span>no accuracy lost</span><span>models give observations, not points</span></div>
</div></details>
<details class="q"><summary>Can an admin push a sanctioned vendor through?</summary><div class="a">
  <p>No. A sanctions match or a prohibited country is a non-remediable override: never cleared, can't be risk-accepted, and contract signing is blocked. One function decides clearance for both the API and signing, so they can't disagree.</p>
  <div class="push"><b>Proof:</b> a red team of 25 profiles runs on every test run, including "admin accepts the risk on a sanctioned vendor". All 25 behave as expected.</div>
</div></details>
<details class="q"><summary>What happens when you don't have enough data on a vendor?</summary><div class="a">
  <p>It still gets a band: the checks that couldn't run are left out and the rest re-weighted to 100, so 7 points over the 57 points checked is 12/100, Low. But it's marked provisional and isn't cleared until its required checks are done; with nothing checked at all it's High until a check completes. Small purchases (up to ₹50,000) from low-tier vendors have a petty exception, unless an override is active.</p>
</div></details>

<div class="qcat" style="--c:var(--red)">Security</div>
<details class="q"><summary>How do you stop someone approving their own purchase?</summary><div class="a">
  <p>Separation of duties is checked on every decision, against the approver's assignment and amount limit; nobody approves their own request, admins included. Identity comes from the JWT, never from a field in the request, and tests guard that.</p>
</div></details>
<details class="q"><summary>What stops a fake invoice with changed bank details?</summary><div class="a">
  <p>New or changed bank details for a vendor are held and need a second person to verify them; payment is held until then. Look-alike vendor names are flagged, and duplicates are checked under a per-vendor lock.</p>
  <div class="push"><b>Known gap:</b> the duplicate check misses a resubmitted invoice with a new number (DUP-1, open decision).</div>
</div></details>
<details class="q"><summary>Where do you keep tokens, and why?</summary><div class="a">
  <p>The 15-minute access token lives in memory; the 7-day refresh token is an httpOnly, SameSite=Strict cookie with a CSRF check. Changing your password, a role change or "sign out everywhere" bumps a version that ends other sessions.</p>
</div></details>
<details class="q"><summary>What security issues are still open?</summary><div class="a">
  <p>Kafka traffic isn't TLS-encrypted (single Docker host); each service does have its own login and topic permissions. External e-sign providers would need the risk check moved to send time. Production refuses the published default secrets.</p>
</div></details>

<div class="qcat" style="--c:var(--green)">Testing and quality</div>
<details class="q"><summary>How did you test it?</summary><div class="a">
  <p>Three layers: unit tests per service (1,276), end-to-end scripts through the real gateway (invoice lifecycle 71/71, GST 44/44, risk 49/49), and a live demo script whose eight scenarios are checked on the running stack. Rules, Kafka permissions and docs links each have their own consistency tests.</p>
  <div class="push"><b>Practice we follow:</b> after a fix, revert it and confirm the test fails, so we know the test actually catches the bug.</div>
</div></details>
<details class="q"><summary>Tell me about a bug you found and fixed.</summary><div class="a">
  <p>A good one: approvals publish an event per level, and the contract service generated a contract on any "approved", so for a two-level request the contract existed before finance had decided. Fixed to generate only after the final level, with a test and a live check.</p>
  <div class="pts"><span>found in an architecture review</span><span>test + live check</span><span>21 Oct</span></div>
</div></details>

<div class="qcat" style="--c:var(--teal)">Team and process</div>
<details class="q"><summary>What was your part?</summary><div class="a">
  <p>Answer for yourself: which agent or feature you owned, one decision you made, one problem you solved. Keep teammates' work credited to them (e.g. the assistant is Anooj's; the deterministic risk scorecard was Niraj's, merged with fifteen fixes).</p>
</div></details>
<details class="q"><summary>What would you do differently?</summary><div class="a">
  <p>Separate schemas per service from day one; connect at least one real external data source early, so fewer vendors are provisional; collect a small set of real invoices to evaluate on.</p>
</div></details>
<details class="q"><summary>What's next if you had three more months?</summary><div class="a">
  <p>Real documents for evaluation, switching on the calibrated review gate if results hold, live GST and sanctions sources, TLS on Kafka, and one deployment beyond one machine.</p>
</div></details>

</div>

<!-- ───────────────────────── Honest ───────────────────────── -->
<h2 id="honest">Weak spots and how to answer them</h2>
<p class="sub">Every project has them. Naming a limit before being caught builds more trust than any feature.</p>
<div class="honest">
  <div class="box"><h3>All data is synthetic</h3><p class="muted">Vendors, invoices, incidents and logins are generated.</p>
    <p class="say"><b>Say:</b> the numbers compare methods fairly on the same data; they don't predict real-world accuracy. CUAD contracts are the one real dataset.</p></div>
  <div class="box"><h3>External sources aren't connected</h3><p class="muted">GST registry, TLS grading, breach and media feeds.</p>
    <p class="say"><b>Say:</b> so a vendor is banded on the checks that ran and stays provisional, not cleared, which is the system failing safe, as designed. The collectors exist behind a circuit breaker.</p></div>
  <div class="box"><h3>Noisy scans read worse with preprocessing</h3><p class="muted">44 % vs 47 % on heavily noisy images.</p>
    <p class="say"><b>Say:</b> it's on because it helps the common case; we measured both and recorded the trade-off.</p></div>
  <div class="box"><h3>Shared database coupling</h3><p class="muted">One open P0 on a cross-service foreign key.</p>
    <p class="say"><b>Say:</b> a known trade-off of the shared database; here's how we'd separate it.</p></div>
  <div class="box"><h3>The review threshold is uncalibrated</h3><p class="muted">Today's 0.8 cut-off accepts invoices with 6.8 % wrong.</p>
    <p class="say"><b>Say:</b> that's exactly what the research measures and fixes.</p></div>
  <div class="box"><h3>Runs on one machine, never deployed</h3><p class="muted">~8 GB of memory for Docker, ~15 GB of images.</p>
    <p class="say"><b>Say:</b> a deliberate scope for a prototype; the Deployment tab lists what production needs.</p></div>
</div>

<!-- ───────────────────────── Tips ───────────────────────── -->
<h2 id="tips">Do and don't</h2>
<div class="dd">
  <div class="box y"><h3>Do</h3><ul>
    <li>Lead with the problem, then the one-line answer.</li>
    <li>Give a number and say where it came from.</li>
    <li>For every tool, have one reason it fits and one alternative you'd consider.</li>
    <li>Say "we measured" only when we did; point at <code>docs/results/</code>.</li>
    <li>Draw the architecture picture when asked about design.</li>
    <li>Credit teammates' parts by name.</li>
  </ul></div>
  <div class="box n"><h3>Don't</h3><ul>
    <li>Call it production-ready; it's a tested prototype.</li>
    <li>Say the agents are "AI agents" in the LLM sense.</li>
    <li>Quote synthetic accuracy as real-world accuracy.</li>
    <li>Run down the rejected tools; they're the wrong fit here, not bad.</li>
    <li>Go deep on the assistant's internals; that's Anooj's to explain.</li>
    <li>Recite the whole stack unprompted; answer what's asked.</li>
  </ul></div>
</div>

<script>
const DASH = "team";
const DASHES = {"team": {"file": "index.html", "title": "Team workspace", "home": "home"}, "present": {"file": "presentation.html", "title": "Presentation", "home": "status"}};
const ALL = [{"id": "home", "file": "index", "label": "Overview", "dash": "team"}, {"id": "showcase", "file": "showcase", "label": "Showcase", "dash": "team"}, {"id": "demo-script", "file": "demo-script", "label": "Demo script", "dash": "team"}, {"id": "research", "file": "research", "label": "Research", "dash": "team"}, {"id": "code", "file": "codebase-guide", "label": "Codebase guide", "dash": "team"}, {"id": "deploy", "file": "deployment", "label": "Deployment", "dash": "team"}, {"id": "market", "file": "competitive-analysis", "label": "Competitors", "dash": "team"}, {"id": "interview", "file": "interview-prep", "label": "Interview prep", "dash": "team"}, {"id": "status", "file": "project-flow", "label": "Project status", "dash": "present"}, {"id": "risk", "file": "risk-model", "label": "Vendor risk", "dash": "present"}, {"id": "slides", "file": "slides", "label": "Slides", "dash": "present"}];
const ALIASES = {"demo-5min": ["showcase", "five"], "status/research": ["research", ""]};
const PAGES = ALL.filter((p) => p.dash === DASH);
const BY_FILE = Object.fromEntries(ALL.map((p) => [p.file, p.id]));
const frames = {};
// Runs inside every page's frame: links to other pages switch tabs, and
// "#anchor" links stay in the frame (a srcdoc frame resolves "#x" against
// the dashboard's address, which would load the whole dashboard into it).
const LINKS = "<scr" + "ipt>(" + function () {
  document.addEventListener("click", function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest && e.target.closest("a[href]");
    if (!a) return;
    var href = a.getAttribute("href");
    if (href.charAt(0) === "#") {
      e.preventDefault();
      var id = href.slice(1);
      if (!id) return;
      if (location.hash.slice(1) !== id) { location.hash = id; return; }
      var el = document.getElementById(decodeURIComponent(id));
      if (el) el.scrollIntoView({ behavior: "smooth" });
      return;
    }
    var m = href.match(/^(?:\.\/)?([a-z0-9-]+)\.html(?:#(.*))?$/);
    if (m && parent.routeLink && parent.routeLink(m[1], m[2] || "")) { e.preventDefault(); return; }
    if (!/^(javascript:|mailto:)/.test(href) && !a.target) a.target = "_blank";
  });
  window.addEventListener("hashchange", function () { parent.pageHash(location.hash.slice(1)); });
} + ")();</scr" + "ipt>";

function savedTheme() { try { return localStorage.getItem("theme"); } catch (e) { return null; } }
function isDark() {
  const t = document.documentElement.getAttribute("data-theme");
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
}
function setTheme(t) {
  try { if (t) localStorage.setItem("theme", t); } catch (e) {}
  const theme = t || savedTheme();
  const apply = (doc) => { if (doc && doc.documentElement && theme) doc.documentElement.setAttribute("data-theme", theme); };
  apply(document);
  Object.values(frames).forEach((f) => apply(f.contentDocument));
  document.querySelector("#theme use").setAttribute("href", isDark() ? "#i-sun" : "#i-moon");
}

function resolve(id, sub) {
  const head = (sub || "").split("/")[0];
  if (ALIASES[id + "/" + head]) { const [i, s] = ALIASES[id + "/" + head]; return [i, s || sub.split("/").slice(1).join("/")]; }
  if (ALIASES[id]) { const [i, s] = ALIASES[id]; return [i, sub || s]; }
  return [id, sub || ""];
}
function go(id, sub) {
  [id, sub] = resolve(id, sub);
  const page = ALL.find((p) => p.id === id);
  if (!page) { openPage(DASHES[DASH].home, ""); return; }
  if (page.dash !== DASH) { location.href = DASHES[page.dash].file + "#" + id + (sub ? "/" + sub : ""); return; }
  openPage(id, sub);
}
function routeLink(stem, hash) {
  const dash = Object.keys(DASHES).find((k) => DASHES[k].file === stem + ".html");
  if (dash) {
    if (!hash) { go(DASHES[dash].home, ""); return true; }
    const [id, ...rest] = hash.split("/");
    go(id, rest.join("/"));
    return true;
  }
  if (BY_FILE[stem] || ALIASES[stem]) { go(BY_FILE[stem] || stem, hash); return true; }
  return false;
}

let current = null;
function openPage(id, sub, fromHash) {
  if (!PAGES.some((p) => p.id === id)) id = DASHES[DASH].home;
  const page = PAGES.find((p) => p.id === id);
  if (!frames[id]) {
    const f = document.createElement("iframe");
    f.title = page.label;
    f.allowFullscreen = true;  // the Slides tab presents full screen
    f.srcdoc = "<!doctype html>" + document.getElementById("page-" + id).innerHTML + LINKS;
    f.addEventListener("load", () => { setTheme(); if (f.dataset.sub) jump(f, f.dataset.sub); });
    document.getElementById("main").appendChild(f);
    frames[id] = f;
  }
  Object.entries(frames).forEach(([k, f]) => { f.hidden = k !== id; });
  document.querySelectorAll("nav a").forEach((a) => a.setAttribute("aria-current", a.dataset.id === id ? "page" : "false"));
  const f = frames[id];
  if (sub) { f.dataset.sub = sub; if (f.contentDocument && f.contentDocument.readyState === "complete") jump(f, sub); }
  current = id;
  document.title = page.label + " · " + DASHES[DASH].title;
  if (!fromHash) history.replaceState(null, "", "#" + id + (sub ? "/" + sub : ""));
}
function jump(f, sub) {
  delete f.dataset.sub;
  try { f.contentWindow.location.hash = sub; } catch (e) {}
  const el = f.contentDocument && f.contentDocument.getElementById(decodeURIComponent(sub));
  if (el) el.scrollIntoView();
}
function pageHash(sub) { history.replaceState(null, "", "#" + current + (sub ? "/" + sub : "")); }
function fromLocation() {
  const [id, ...rest] = location.hash.slice(1).split("/");
  const [rid, rsub] = resolve(id || DASHES[DASH].home, rest.join("/"));
  const page = ALL.find((p) => p.id === rid);
  if (page && page.dash !== DASH) { go(rid, rsub); return; }
  openPage(rid, rsub, rid === id && rsub === rest.join("/"));  // an old id: show the new one in the address bar
}

(function main() {
  // Opened inside another dashboard's frame (an old link): let that dashboard show the page instead.
  if (window.parent !== window) {
    try {
      if (window.parent.go) { const [id, ...rest] = location.hash.slice(1).split("/"); window.parent.go(id || DASHES[DASH].home, rest.join("/")); return; }
    } catch (e) {}
  }
  document.querySelectorAll("nav a").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); openPage(a.dataset.id, ""); }));
  document.querySelectorAll(".mode a").forEach((a) => a.addEventListener("click", (e) => {
    if (a.dataset.dash === DASH) { e.preventDefault(); openPage(DASHES[DASH].home, ""); }
  }));
  document.getElementById("theme").addEventListener("click", () => setTheme(isDark() ? "light" : "dark"));
  const slim = (on) => { document.body.classList.toggle("slim", on); try { localStorage.setItem("dash-slim", on ? "1" : ""); } catch (e) {} };
  document.getElementById("slim").addEventListener("click", () => slim(!document.body.classList.contains("slim")));
  try { if (localStorage.getItem("dash-slim")) document.body.classList.add("slim"); } catch (e) {}
  window.addEventListener("hashchange", fromLocation);
  setTheme();
  fromLocation();
})();
</script>
