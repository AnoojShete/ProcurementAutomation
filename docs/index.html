<details class="wt" open><summary><h3 id="wt-pipeline">4. The document pipeline (worker)</h3></summary>
<p><b>Where:</b> consumer <a class="fp" href="#f-services-document-vendor-agent-app-kafka-consumer-py" title="Open the explanation of this file">services/document-vendor-agent/app/kafka/consumer.py:137</a>; claim <a class="fp" href="#f-services-document-vendor-agent-app-kafka-consumer-py" title="Open the explanation of this file">services/document-vendor-agent/app/kafka/consumer.py:77</a>; orchestration <a class="fp" href="#f-services-document-vendor-agent-app-services-document-service-py" title="Open the explanation of this file">services/document-vendor-agent/app/services/document_service.py:47</a>; stages in <a class="fp" href="#f-services-document-vendor-agent-app-services-pipeline-py" title="Open the explanation of this file">services/document-vendor-agent/app/services/pipeline.py</a>.</p>
<ol>
<li><b>Concurrency.</b> A semaphore allows <code>worker_concurrency</code> (4) documents at once per worker; <code>document.ingested</code> has 6 partitions, so up to 6 workers can share load.</li>
<li><b>Claim.</b> <code>UPDATE documents SET status='processing', processing_attempts+=1 WHERE id=:id AND status='pending'</code>; rowcount 0 → someone else has it (redelivery-safe).</li>
<li><b>parsing_agent</b> (<a class="fp" href="#f-services-document-vendor-agent-app-services-pipeline-py" title="Open the explanation of this file">services/document-vendor-agent/app/services/pipeline.py:49</a>) → <code>route_extraction</code> (<a class="fp" href="#f-services-document-vendor-agent-app-services-extraction-router-py" title="Open the explanation of this file">services/document-vendor-agent/app/services/extraction_router.py:113</a>): extraction runs as <code>python -m app.services._extract_worker</code> with a 120 s timeout; blank PDFs raise <code>DocumentUnreadableError</code>; low-quality images get a LayoutLMv3 second reading.</li>
<li><b>classification_agent</b> — ML if ≥ 0.6 probable, else keywords; “other” forces review.</li>
<li><b>field_extraction_agent</b> — regex extraction + amount consistency (<a class="fp" href="#f-services-document-vendor-agent-app-services-field-extraction-py" title="Open the explanation of this file">services/document-vendor-agent/app/services/field_extraction.py:466</a>).</li>
<li><b>layoutlm_crosscheck_agent</b> — optional; disagreement forces review.</li>
<li><b>vendor_matching_agent</b> (<a class="fp" href="#f-services-document-vendor-agent-app-services-pipeline-py" title="Open the explanation of this file">services/document-vendor-agent/app/services/pipeline.py:202</a>) — match/create vendor; bank details on a non-quote → pending change request (dual control) and <code>vendor.payment_details_flagged</code>; look-alike new vendor → review + audit; invoices get a <b>payment hold</b> while bank details are unverified or the vendor looks like an impostor; quotes are saved to <code>vendor_quotes</code>.</li>
<li><b>vendor_learning_agent</b> — learned per-vendor labels may correct fields; per-vendor review threshold.</li>
<li><b>currency_agent</b> — rate fetched once and stored; failure → retry later.</li>
<li><b>tax_agent</b> (invoices, Phase 4) — GST check and e-invoice QR; a problem forces review and publishes <code>invoice.tax_flagged</code>, the confidence score is untouched; the taxable value goes on to the ledger for TDS.</li>
<li><b>invoice_matching_agent</b> (<a class="fp" href="#f-services-document-vendor-agent-app-services-pipeline-py" title="Open the explanation of this file">services/document-vendor-agent/app/services/pipeline.py:366</a>) — HTTP to the ledger with a service JWT; network/5xx → whole document retried; 4xx → review; result matched/partial (emits <code>invoice.matched</code>), ambiguous, variance, no match.</li>
<li><b>duplicate_detection_agent</b> — <code>pg_advisory_xact_lock(hashtext('duplicate-check:'+vendor))</code> so two copies processed together can't both miss each other.</li>
<li><b>confidence_agent</b> (<a class="fp" href="#f-services-document-vendor-agent-app-services-pipeline-py" title="Open the explanation of this file">services/document-vendor-agent/app/services/pipeline.py:530</a>) — overall score; duplicates capped at 0.5; review if below threshold, duplicate, forced, or unmatched invoice.</li>
<li><b>Persist</b> — fields, FX, confidence, status <code>classified</code>, audit, outbox <code>document.classified</code> (+ <code>vendor.matched</code>), one commit; then per-stage <code>pipeline_checkpoints</code> (best effort).</li>
</ol>
<p><b>Errors:</b> unreadable file → rollback everything, status <code>failed</code> with a user-facing message. Any other exception → rollback, back to <code>pending</code> with “Temporary problem, retrying”. The 60-second sweep (<a class="fp" href="#f-services-document-vendor-agent-app-kafka-consumer-py" title="Open the explanation of this file">services/document-vendor-agent/app/kafka/consumer.py:91</a>) re-publishes pending documents after 1 min × attempts, returns stuck <code>processing</code> rows (&gt; 5 min) to pending, and marks documents failed after 5 attempts.</p>
</details>

<details class="wt"><summary><h3 id="wt-review">5. Human review and learning</h3></summary>
<p><b>Where:</b> <a class="fp" href="#f-services-document-vendor-agent-app-api-documents-py" title="Open the explanation of this file">services/document-vendor-agent/app/api/documents.py:289</a>, <a class="fp" href="#f-services-document-vendor-agent-app-services-document-service-py" title="Open the explanation of this file">services/document-vendor-agent/app/services/document_service.py:330</a>, <a class="fp" href="#f-services-document-vendor-agent-app-services-learning-py" title="Open the explanation of this file">services/document-vendor-agent/app/services/learning.py</a>.</p>
<p>The reviewer (JWT identity) submits corrected fields; bank fields are stripped (they only change through dual control). Corrected fields get confidence 1.0, the document becomes <code>classified</code> with overall 1.0, totals are re-converted (same currency keeps the stored rate). <code>learning.record_review</code> stores which label preceded each corrected value; once the same label is confirmed twice for a vendor, later documents read the field from next to that label. Vendors whose reviews are ≥ 90 % unchanged (≥ 5 reviews) get a relaxed threshold (base − 0.15, min 0.6); &lt; 50 % get a strict one (base + 0.1, max 0.95). The corrected <code>document.classified</code> is published <b>directly</b>, not through the outbox.</p>
</details>

<details class="wt" open><summary><h3 id="wt-approval">6. Purchase request and approval workflow</h3></summary>
<p><b>Where:</b> <a class="fp" href="#f-services-approval-inventory-agent-app-services-approval-service-py" title="Open the explanation of this file">services/approval-inventory-agent/app/services/approval_service.py:95</a> <code>create_request</code>, <a class="fp" href="#f-services-approval-inventory-agent-app-services-approval-service-py" title="Open the explanation of this file">services/approval-inventory-agent/app/services/approval_service.py:301</a> <code>process_decision</code>, <a class="fp" href="#f-services-approval-inventory-agent-app-workflows-approval-workflow-py" title="Open the explanation of this file">services/approval-inventory-agent/app/workflows/approval_workflow.py:210</a> workflow <code>run</code>.</p>
<ol>
<li><b>Create</b> (requester/admin; <code>requested_by</code> forced to the JWT email). Spend tier from rule <code>approval.spend_tiers</code>: first tier whose <code>max_amount</code> ≥ amount (defaults: ≤ ₹500 auto, ≤ ₹5,000 <code>[dept_manager]</code>, above <code>[dept_manager, finance_head]</code>). SLA deadline = now + <code>approval.sla_escalation_hours</code> (48).</li>
<li><b>Hardware stock.</b> For each SKU: reserve under a Redis lock (<code>SET NX EX 300</code>), or backorder. Nothing in stock → request is <code>backordered</code>; partly → split into an immediate request and a backordered child. Working tree releases reservations if the insert fails.</li>
<li><b>Events.</b> <code>approval.requested</code> via the outbox. Tier <code>auto</code> → approved immediately by <code>system</code> + <code>approval.decided</code>. Otherwise start <code>ApprovalWorkflow</code> with id <code>approval-&lt;id&gt;</code> (a start failure is only logged — <span class="inf">inference: nothing restarts it automatically; the decision path then falls back to direct processing</span>).</li>
<li><b>Decide</b> (approver/finance/admin): request must be <code>pending_approval</code>; <code>check_request_authority</code> (see algorithm) → 403 with a code such as <code>SEPARATION_OF_DUTIES</code>; then signal <code>approval_signal{decision, decided_by, comments, level_index, channel}</code>. If Temporal is unreachable, the decision is applied directly in the DB with an outbox event. Email-approval tokens are revoked.</li>
<li><b>Workflow.</b> For each level: set status/approver index; wait for a signal for <i>this</i> level (stale signals discarded) while waking at 50 %/80 % of the SLA to publish <code>reminder.due</code>; on timeout escalate (notify next level) or, at the last level, auto-reject and release stock; on reject record, publish, release; on approve record and publish <code>approval.decided</code>. After all levels: status <code>approved</code>. Reclaim requests first wait a 7-day grace period.</li>
</ol>
<p>Activities publish with a fresh producer directly (not the outbox); Temporal retries failed activities <span class="inf">(inference: no explicit retry policy is set, so the SDK default applies)</span>. The UI polls because the decision lands a moment after the API returns.</p>
<div class="callout warn"><b>Per-level <code>approval.decided</code>.</b> The workflow publishes one “approved” event per level. document-vendor-agent's handler waits for the final level; contract-risk-agent's does not — see <a href="#issues">Known issues</a>.</div>
</details>

<details class="wt"><summary><h3 id="wt-ledger">7. Invoice ledger (three-way match)</h3></summary>
<p><b>Where:</b> <a class="fp" href="#f-services-approval-inventory-agent-app-services-invoice-ledger-py" title="Open the explanation of this file">services/approval-inventory-agent/app/services/invoice_ledger.py:286</a> <code>book_invoice</code>; algorithm in <a href="#alg-ledger">Algorithms</a>.</p>
<p>Called by the document worker as role <code>service</code>. Idempotent per <code>document_id</code> (returns the stored result). Candidate requests of the vendor in a matchable status are <b>row-locked</b>, balances computed from <code>invoice_allocations</code>, the pure <code>evaluate()</code> runs, and a matched/partial result inserts allocations, moves the request to <code>invoice_received</code>/<code>partially_invoiced</code> and upserts <code>invoice_matches</code> (with payment hold). Finance/admin calls are dry runs.</p>
</details>

<details class="wt" open><summary><h3 id="wt-contract">8. Contract generation and signing</h3></summary>
<p><b>Where:</b> <a class="fp" href="#f-services-contract-risk-agent-app-kafka-consumer-py" title="Open the explanation of this file">services/contract-risk-agent/app/kafka/consumer.py:102</a>, <a class="fp" href="#f-services-contract-risk-agent-app-services-contract-service-py" title="Open the explanation of this file">services/contract-risk-agent/app/services/contract_service.py:100</a>, <a class="fp" href="#f-services-contract-risk-agent-app-services-contract-service-py" title="Open the explanation of this file">services/contract-risk-agent/app/services/contract_service.py:421</a>.</p>
<ol>
<li><code>approval.decided</code> (approved) → if the request has no contract: score the vendor if never scored; pick template from <code>request_type</code>; end date now + 365 days, notice 30 days; render Jinja2; run clause extraction (Legal-BERT or regex). The values the template was written with stay authoritative; disagreements are audited. Contract <code>draft</code>; outbox <code>contract.generated</code> + <code>notification.send</code>; start the renewal workflow.</li>
<li><b>Auto-send once</b> (<a class="fp" href="#f-services-contract-risk-agent-app-services-contract-service-py" title="Open the explanation of this file">services/contract-risk-agent/app/services/contract_service.py:338</a>): rule <code>contract.auto_send_scope</code> (all | drop_folder); skipped if an earlier attempt is in the audit log; built-in provider picks an authorised signatory.</li>
<li><b>Sign</b> (approver/finance/admin; signer = JWT email): consent required; already signed → return the certificate; status must be draft/pending_signature; if the vendor is High risk or unscored, <code>risk_acknowledged</code> must be true (else 409). Seal = SHA-256 of <code>id|text|name|email|designation|time|signature</code>; certificate stored in the audit log; outbox <code>contract.signed</code>.</li>
<li>approval-inventory-agent consumes <code>contract.signed</code> → request <code>ordered</code> (activates licences / stock effects once). A reconciler repairs requests left <code>approved</code> with a signed contract.</li>
</ol>
<p>The seal is an unkeyed hash: it shows tampering only as far as the audit log itself is trusted (stated in the code).</p>
</details>

<details class="wt"><summary><h3 id="wt-risk">9. Vendor risk scoring</h3></summary>
<p><b>Where:</b> <a class="fp" href="#f-services-contract-risk-agent-app-services-risk-service-py" title="Open the explanation of this file">services/contract-risk-agent/app/services/risk_service.py</a> <code>score_vendor</code>, <a class="fp" href="#f-services-contract-risk-agent-app-services-clearance-py" title="Open the explanation of this file">services/contract-risk-agent/app/services/clearance.py</a> <code>decide</code>.</p>
<p>Collect observations (local records, format checks, external sources behind a circuit breaker) → <code>evaluate_risk</code> with the active ruleset and the vendor's tier and country → integer points per check, overrides, rating status (assessed / provisional / not rated; never a false Low) → <code>risk_scores</code> row with its rule results and snapshot hash → <code>risk.score.updated</code> via the outbox. Clearance then decides use: non-remediable overrides never clear and block signing; decisions count only while still eligible. Red team 25/25 and evaluation: <a href="risk-model.html">risk-model.html</a>. Triggers: <code>vendor.matched</code>, recompute, first contract, deliveries (5-min sweep).</p>
</details>

<details class="wt"><summary><h3 id="wt-rules">10. Business rules engine</h3></summary>
<p><b>Where:</b> <a class="fp" href="#f-services-auth-service-app-api-business-rules-py" title="Open the explanation of this file">services/auth-service/app/api/business_rules.py:236</a> (update), <a class="fp" href="#f-services-auth-service-app-api-business-rules-py" title="Open the explanation of this file">services/auth-service/app/api/business_rules.py:91</a> (validation), <a class="fp" href="#f-shared-rules-engine-init-py" title="Open the explanation of this file">shared/rules_engine/__init__.py:46</a> (client).</p>
<p>An admin PATCHes <code>{new_value, justification}</code>. Validation: type (bool/int/float/json), min/max, rule-specific shapes (contiguous spend tiers, reminder percents 1–99, scope enum…) and cross-field ordering (petty &lt; standard tier, watch &lt; anomalous, PSI moderate &lt; significant). The history row and new value commit; then <code>business_rule.updated</code> is published (directly). Services read rules with <code>get_rule(key, fallback)</code> — cached 5 min, invalidated by the event, and falling back to the code's default if auth-service is down. 47 rules, 37 enforced (docs/business-rules.md).</p>
</details>

<details class="wt"><summary><h3 id="wt-email-approval">11. Approve from email</h3></summary>
<p><b>Where:</b> <a class="fp" href="#f-services-notification-agent-app-kafka-consumer-py" title="Open the explanation of this file">services/notification-agent/app/kafka/consumer.py:34</a>, <a class="fp" href="#f-services-approval-inventory-agent-app-services-email-action-token-service-py" title="Open the explanation of this file">services/approval-inventory-agent/app/services/email_action_token_service.py:69</a>, <a class="fp" href="#f-services-approval-inventory-agent-app-api-email-action-py" title="Open the explanation of this file">services/approval-inventory-agent/app/api/email_action.py</a>.</p>
<p>On <code>approval.requested</code>, notification-agent asks approval-inventory-agent (internal token) to mint a link for the active step. Step-up rules (<code>approval.email_action_*</code>) can refuse a link — email approval switched off, amount above ₹50,000, a High-risk vendor, or over budget — and the approver then decides in the portal. The token (256-bit) is stored only as SHA-256 and expires at the earlier of the SLA deadline and the TTL rule (48 h). <code>GET /email-action/{token}</code> only renders a confirmation page (so mail scanners prefetching links change nothing); <code>POST …/decide</code> consumes it under a row lock and runs the same <code>process_decision</code> with channel <code>email</code>. An email approval is an authorisation, not a digital signature.</p>
</details>

<details class="wt"><summary><h3 id="wt-frontend">12. Frontend structure</h3></summary>
<p><a class="fp" href="#f-frontend-src-app-router-tsx" title="Open the explanation of this file">frontend/src/app/router.tsx</a> defines signed-out pages and the <code>/app</code> shell; each area is wrapped in <code>RoleGuard</code> (UX only). Data loads via <code>useApi</code>; backend actions that complete asynchronously (approvals through Temporal) use <code>usePolling</code> to wait for the settled state. Team rules: one home page per item; each agent's actions are one component (<code>ApprovalActions</code>, <code>ContractActions</code>, <code>PaymentChangeVerify</code>) reused everywhere; show skeletons only on first load; deep links like <code>/app/requests/:id?step=approval</code>. <code>lib/lifecycle.ts</code> maps request status + linked contract/document onto the 8-stage stepper.</p>
</details>

<h3 id="api-conventions">API conventions</h3>
<ul>
<li>Base URL through the gateway: <code>http://localhost:8080/api/…</code>. Services' own ports (8001–8006) are bound to 127.0.0.1 and meant for debugging.</li>
<li>Success: <code>{"data": …, "meta": {…}}</code>. Error: <code>{"error": {"code", "message"}}</code> from <a class="fp" href="#f-shared-http-error-handlers-py" title="Open the explanation of this file">shared/http/error_handlers.py:52</a>. approval-inventory-agent overrides these handlers, so its codes are upper-case (<code>NOT_FOUND</code>, <code>VALIDATION_ERROR</code>) and its validation message is the raw exception text.</li>
<li>Auth: <code>Authorization: Bearer &lt;access token&gt;</code>; refresh/logout additionally need the <code>X-CSRF-Token</code> header. List endpoints accept <code>limit</code> (1–1000 in the working tree).</li>
<li>Idempotency: <code>Idempotency-Key</code> header supported on document upload, request creation and contract generation.</li>
<li>Every response carries <code>X-Correlation-ID</code>.</li>
</ul>

<section id="algorithms"><h2>6. Algorithms and technical reasoning</h2>
<details class="alg" open><summary><h3 id="alg-confidence">Document confidence and the review decision</h3></summary>
<p><a class="fp" href="#f-services-document-vendor-agent-app-services-confidence-py" title="Open the explanation of this file">services/document-vendor-agent/app/services/confidence.py:36</a>. Let <i>q</i> be the text quality (fraction of tokens that look like words or numbers; for images, PaddleOCR's character-weighted recognition score). Every component score is discounted by it:</p>
<pre class="code" data-lang="text"><code>s_classification = c_cls · q          s_field = c_field · q   for vendor_name, document_number, document_date, total, line_items
overall = Σ w_k · s_k / Σ w_k   over present components
w: total .30 · vendor_name .20 · classification .15 · document_number .15 · document_date .10 · line_items .10
line_items is dropped when 0 (many documents have none); a likely duplicate caps overall at 0.5
needs_review = overall < threshold  OR duplicate OR forced (other / look-alike / cross-check disagreement / no vendor) OR unmatched invoice
threshold = per-vendor calibrated value, else rule document.confidence_review_threshold (0.8)</code></pre>
<p><b>Worked example.</b> A clean PDF (q = 1.0) with classification 0.95, vendor 0.85, number 0.9, date 0.9, total 0.98 (amounts consistent), no line items:
(0.3·0.98 + 0.2·0.85 + 0.15·0.95 + 0.15·0.9 + 0.1·0.9) / 0.9 = 0.8317/0.9 ≈ <b>0.924</b> → no review unless forced. The same read from a phone photo with q = 0.6 scores ≈ 0.55 → review.
<b>Complexity:</b> O(1). <b>Limitation (team's own):</b> the threshold is uncalibrated. Measured on 3,000 synthetic invoices (docs/results/selective.md): this rule plus the forced-review flags accepts 41 % of invoices, and 6.8 % of those are wrong; a calibrated replacement is in <code>selective_gate.py</code> (not wired in).</p>
</details>

<details class="alg"><summary><h3 id="alg-classify">Document classification</h3></summary>
<p><a class="fp" href="#f-services-document-vendor-agent-app-services-classification-py" title="Open the explanation of this file">services/document-vendor-agent/app/services/classification.py:95</a>. If the trained TF-IDF + logistic-regression model gives a class probability ≥ 0.6, use it. Otherwise weighted keywords: each type sums the weights of regexes found (title phrases 3, labels 2, incidental 1). If the best score &lt; 3 → <code>other</code> (confidence 0.5). Else confidence = min(1, 0.55 + 0.45·(best − runner-up)/best).
Example: “TAX INVOICE … Invoice Number … Due Date” → invoice = 3+3+2+1 = 9, po = 0 → margin 1 → 1.0. The ML model is kept only because it beat keywords on held-out document kinds (docs/results/classifier.md: macro-F1 1.0 vs 0.844, on synthetic data).</p>
</details>

<details class="alg"><summary><h3 id="alg-ocr">Reading PDFs and images</h3></summary>
<p><a class="fp" href="#f-services-document-vendor-agent-app-services-ocr-py" title="Open the explanation of this file">services/document-vendor-agent/app/services/ocr.py:274</a>. PDF: pdfplumber first; ≥ 40 non-space characters → done (quality = token heuristic). Else Docling (layout + OCR) — quality 1.0 if it found enough text, 0.15 otherwise; Docling error → pdfplumber. Image: optional preprocessing (grayscale; upscale ≤ 1.5× to 1,600 px long side; deskew via the min-area rectangle of dark pixels when 0.3°–15°), then PaddleOCR in a subprocess. PaddleOCR returns text blocks, so <code>_rows_to_text</code> sorts blocks by vertical centre and joins those whose centres differ by ≤ ½ of the smaller block height into one row, left to right — table rows become one line again, which is what the field regexes expect. All of this runs inside a child process killed at 120 s.</p>
</details>

<details class="alg"><summary><h3 id="alg-amounts">Amount consistency check</h3></summary>
<p><a class="fp" href="#f-services-document-vendor-agent-app-services-field-extraction-py" title="Open the explanation of this file">services/document-vendor-agent/app/services/field_extraction.py:434</a>: checks <code>subtotal − discount + tax = total</code> and <code>Σ line_total = subtotal</code> (or total), each within max(₹0.02, 0.5 %). All consistent → total confidence ≥ 0.98; any mismatch → ≤ 0.5 (pushes the document to review).</p>
</details>

<details class="alg" open><summary><h3 id="alg-vendor">Vendor normalisation, matching and look-alikes</h3></summary>
<p><a class="fp" href="#f-services-document-vendor-agent-app-services-vendor-matching-py" title="Open the explanation of this file">services/document-vendor-agent/app/services/vendor_matching.py:21</a>. Normalise: lower-case, punctuation → space, collapse spaces, repeatedly strip trailing legal suffixes (multi-word first: “private limited”, then “pvt”, “ltd”, “inc”, …). Score against every vendor with rapidfuzz <code>token_sort_ratio</code> (tokens sorted, then Levenshtein-based ratio 0–100).</p>
<pre class="code" data-lang="text"><code>best ≥ 88                       → existing vendor (confidence best/100)
else                            → new vendor, committed in its own transaction
new and best ≥ rule vendor.lookalike_min_similarity (70) → look-alike: review + audit + payment hold on invoices</code></pre>
<p>Example: “Acme Corp, Inc.” → “acme corp” after stripping “inc” then “corp”. Checked with rapidfuzz: “del1 technologies” vs “dell technologies” scores 94, which is ≥ 88, so it is treated as the <i>same</i> vendor (the example in vendor_matching.py's comment would not be flagged as a look-alike). The showcase generator therefore searches for variants scoring 70–87 (<a class="fp" href="#f-services-document-vendor-agent-app-api-showcase-py" title="Open the explanation of this file">services/document-vendor-agent/app/api/showcase.py</a>). <b>Complexity:</b> O(V·L²) per document (V vendors, L name length) — a full scan, fine for hundreds of vendors; <span class="inf">inference</span>: thousands would want blocking/indexing (e.g. trigram search).</p>
</details>

<details class="alg"><summary><h3 id="alg-dup">Duplicate invoice detection</h3></summary>
<p><a class="fp" href="#f-services-document-vendor-agent-app-services-duplicate-detection-py" title="Open the explanation of this file">services/document-vendor-agent/app/services/duplicate_detection.py:25</a>. Among the same vendor's invoices: |Δtotal| ≤ max(total·tol, 0.01) (tol = rule, default 0.02); dates within the window (rule, 7 days; skipped if a date is missing); numbers similar by <code>fuzz.ratio</code> ≥ 85 (or missing). First hit → duplicate. A per-vendor transaction-scoped advisory lock serialises concurrent checks so two copies processed in parallel are still caught. O(n) in the vendor's invoices. <b>Known gap (19 Oct, research run):</b> because of the number condition, the same invoice resent with a new number is not flagged; setting the rule <code>vendor.duplicate_invoice_number_fuzzy_threshold</code> to 0 drops it (decision open, TODO DUP-1).</p>
</details>

<details class="alg"><summary><h3 id="alg-gstin">GSTIN check digit</h3></summary>
<p><a class="fp" href="#f-services-document-vendor-agent-app-services-gstin-service-py" title="Open the explanation of this file">services/document-vendor-agent/app/services/gstin_service.py:98</a>. Format: 2-digit state 01–37, PAN (5 letters, 4 digits, 1 letter), entity code, “Z”, check character. Check: alphabet <code>0–9A–Z</code> (36 symbols); for the first 14 characters with factors alternating 1, 2: p = factor·index(c); total += ⌊p/36⌋ + (p mod 36); check = alphabet[(36 − total mod 36) mod 36]. Catches all single-character typos the format check can't.</p>
</details>

<details class="alg"><summary><h3 id="alg-fx">Currency conversion</h3></summary>
<p><a class="fp" href="#f-services-document-vendor-agent-app-services-fx-py" title="Open the explanation of this file">services/document-vendor-agent/app/services/fx.py:45</a>: rate = Frankfurter <code>/latest?base=CUR&amp;symbols=INR</code> (ECB daily reference), cached 1 h per currency; <code>total_inr = round(total × rate, 2)</code>; the rate and its date are stored on the document so its INR value never changes later. Unreachable API → retry the whole document, never a guessed rate.</p>
</details>

<details class="alg"><summary><h3 id="alg-learning">Learning from corrections</h3></summary>
<p><a class="fp" href="#f-services-document-vendor-agent-app-services-learning-py" title="Open the explanation of this file">services/document-vendor-agent/app/services/learning.py:163</a>: a hint (vendor, field, label) becomes active after 2 confirming reviews. Threshold calibration per vendor after ≥ 5 reviews: clean-rate ≥ 0.9 → max(0.6, base − 0.15); &lt; 0.5 → min(0.95, base + 0.1); else base.</p>
</details>

<details class="alg" open><summary><h3 id="alg-tier">Spend tier and approval authority</h3></summary>
<p><a class="fp" href="#f-services-approval-inventory-agent-app-services-approval-service-py" title="Open the explanation of this file">services/approval-inventory-agent/app/services/approval_service.py:49</a>: iterate tiers in order; the first with <code>max_amount</code> null or amount ≤ max wins (₹500 exactly is auto; ₹500.01 is manager). <a class="fp" href="#f-services-approval-inventory-agent-app-services-approval-authority-py" title="Open the explanation of this file">services/approval-inventory-agent/app/services/approval_authority.py:62</a> <code>evaluate_authority</code> is pure:</p>
<pre class="code" data-lang="text"><code>no pending level                               → NO_PENDING_LEVEL
approving your own request (admins included)   → SEPARATION_OF_DUTIES
you already approved an earlier level          → SEPARATION_OF_DUTIES
not assigned to this level, and no live delegation from someone who is
  (a requester can't delegate their own request)  → NOT_ASSIGNED
amount > your limit for this level               → OVER_LIMIT
otherwise                                        → OK (via delegation if used)</code></pre>
</details>

<details class="alg" open><summary><h3 id="alg-ledger">Three-way invoice match</h3></summary>
<p><a class="fp" href="#f-services-approval-inventory-agent-app-services-invoice-ledger-py" title="Open the explanation of this file">services/approval-inventory-agent/app/services/invoice_ledger.py:174</a>. Candidates: the vendor's requests in approved / ordered / fulfilled / partially_invoiced; if the invoice cites “PO-XXXXXXXX”, only that request. For each candidate, remaining = amount − already booked, and remaining quantity per PO line.</p>
<pre class="code" data-lang="text"><code>for each invoice line: best PO line by similarity (substring → 1.0, else difflib ratio); < 0.55 → issue "not on this request"
   qty > remaining qty                               → issue
   unit price > PO price·(1 + unit_price_pct) + 0.01 → issue (paying less is fine)
total > remaining·(1 + overbill_pct) + 0.01          → issue (or "already fully invoiced")
clean candidates: 1 → matched (remaining_after ≤ tol) or partial
                  >1 → the one it settles exactly, else ambiguous
no clean, some plausible (lines recognised or total ≈ remaining) → variance (best = most lines recognised, fewest issues)
nothing → no_match</code></pre>
<p>Example: PO 5 × ₹900 = ₹4,500; invoice 3 × ₹900 = ₹2,700 → partial, ₹1,800 left; a second invoice 2 × ₹950 → variance (price above agreed + tolerance). Tolerances are rules (1 % each). Booking row-locks candidates so two invoices can't spend the same balance; idempotent per document. Complexity O(C · I · P) for C candidates, I invoice lines, P PO lines.</p>
</details>

<details class="alg"><summary><h3 id="alg-reorder">Reorder suggestion</h3></summary>
<p><a class="fp" href="#f-services-approval-inventory-agent-app-services-reorder-py" title="Open the explanation of this file">services/approval-inventory-agent/app/services/reorder.py:34</a>: point and quantity per item, or a share of total stock (rules 20 % / 25 %). owed = max(0, backordered − available); left = max(0, available − backordered); reorder if left ≤ point; suggested = owed + max(0, point − left) + quantity. Example: total 20, available 2, 5 backordered, point 4, quantity 5 → owed 3, left 0, suggested 3 + 4 + 5 = 12.</p>
</details>

<details class="alg" open><summary><h3 id="alg-anomaly">Licence-usage anomaly score (IsolationForest + SHAP)</h3></summary>
<p><a class="fp" href="#f-services-approval-inventory-agent-app-ml-usage-anomaly-py" title="Open the explanation of this file">services/approval-inventory-agent/app/ml/usage_anomaly.py:66</a>. IsolationForest (200 trees, contamination 0.3) isolates points with random splits; anomalies need fewer splits. <code>score_samples</code> (higher = more normal) is min-max normalised with the training range: <code>score = clamp((max − raw)/(max − min), 0, 1)</code>. SHAP TreeExplainer attributes the raw score to features; <code>contribution = −SHAP</code> so positive means “pushes toward anomalous”; top 3 by |SHAP|. Status: ≥ 0.39 anomalous (reclaim request with grace period), ≥ 0.34 watch, else normal; no logins → insufficient_history (thresholds from validation, auth migration 0012). Features (current model): utilisation over 7/30/90 days, 7/30-day retention, days since last login, weekend ratio. Results on a synthetic 600-licence population: test ROC-AUC 0.954, AP 0.873 vs 0.687 for “low utilisation” alone.</p>
</details>

<details class="alg" open><summary><h3 id="alg-risk">Vendor risk score</h3></summary>
<p><a class="fp" href="#f-services-contract-risk-agent-app-services-risk-service-py" title="Open the explanation of this file">services/contract-risk-agent/app/services/risk_service.py:107</a>. RandomForest (200 trees, depth 6, balanced classes) trained on 2,000 synthetic vendors with 20 % of feature values randomly blanked (scikit-learn 1.5 trees accept NaN), so missing signals stay missing at scoring time. Probability → band at 0.33 / 0.66. Overrides (GSTIN cancelled/suspended, sanctions potential match, IFSC invalid) force High. “Top factors” are <code>feature_importance × |deviation from a neutral value|</code> — a per-vendor heuristic, <b>not</b> SHAP. Evaluation (docs/results/risk-model.json): ROC-AUC 0.715 against a label-rule ceiling of 0.739; red-team profiles 12/12.</p>
</details>

<details class="alg"><summary><h3 id="alg-sanctions">Sanctions screening</h3></summary>
<p><a class="fp" href="#f-services-contract-risk-agent-app-services-sanctions-py" title="Open the explanation of this file">services/contract-risk-agent/app/services/sanctions.py:128</a>: companies/organisations from the OpenSanctions consolidated list (names + aliases) are normalised; the vendor name is compared with <code>process.extract(…, scorer=token_sort_ratio, score_cutoff=threshold, limit=20)</code>; ≥ rule <code>risk.sanctions_match_threshold_pct</code> (90) → potential match → hard override until finance clears it with a justification. O(N) over list entries per screening.</p>
</details>

<details class="alg"><summary><h3 id="alg-clauses">Clause extraction (Legal-BERT CUAD)</h3></summary>
<p><a class="fp" href="#f-services-contract-risk-agent-app-services-clause-model-py" title="Open the explanation of this file">services/contract-risk-agent/app/services/clause_model.py:86</a>: extractive QA. For each of three CUAD questions, the contract is tokenised in overlapping windows (<code>truncation="only_second"</code>, stride); for every window the best span maximises start_logit + end_logit and must beat the [CLS] “no answer” score. Small parsers turn the passages into renewal type, notice days and end date. Confidence = clauses found / 3; below rule 0.4 (or model missing/failing/forced) → regex rules. CUAD test F1 0.85 / 0.80 / 0.91 vs rules 0.50 / 0.19 / 0.02; ~17 s per long contract on CPU.</p>
</details>

<details class="alg"><summary><h3 id="alg-renewal">Renewal reminders</h3></summary>
<p><a class="fp" href="#f-services-contract-risk-agent-app-services-renewal-schedule-py" title="Open the explanation of this file">services/contract-risk-agent/app/services/renewal_schedule.py:24</a>: deadline = end date − notice period; reminders at deadline − {60, 30, 15} days, midnight UTC. Milestones already passed are dropped except the latest, which fires immediately. Example: end 2027-10-17, notice 30 → deadline 2027-09-17 → reminders 07-19, 08-18, 09-02. The Temporal workflow sleeps durably until each.</p>
</details>

<details class="alg"><summary><h3 id="alg-rag">Assistant: retrieval-augmented generation</h3></summary><p><b>Index.</b> Contract text is split at numbered clauses and then into groups of whole sentences of about 160 characters, so one chunk carries one obligation (a liability cap and an insurance amount end up apart). Document text is windowed (900 characters, 150 overlap). Business rules and live records (requests, vendors with risk and scorecard, licences, budgets, totals) are written as sentences, because a 3B model misreads JSON. Each chunk is prefixed with its source (contract, template, vendor) and embedded with nomic-embed-text using the <code>search_document:</code> task prefix; questions use <code>search_query:</code>.</p><p><b>Retrieval.</b> pgvector cosine distance over an HNSW index, 30 candidates, a distance cut-off of 0.6, the access filter in SQL, then re-ranking (a contract type named in the question keeps only that type; titles containing words from the question move up), at most two chunks per section and three requests, six passages in all.</p><p><b>Generation.</b> The passages and the question go to the chat model at temperature 0 with rules: use only the passages, quote the sentence relied on, cite it, say there is no record when the named vendor or item is absent, never reveal bank details. Evaluated with 16 known-answer questions (<code>tests/e2e/chatbot_eval.py</code>): 16/16 on three runs.</p></details>
<details class="alg"><summary><h3 id="alg-redteam">Risk red team</h3></summary><p>22 vendor profiles, each an attack (a sanctions match behind a perfect record, an admin accepting a sanctioned vendor's risk, missing data hoping for Low, a stale check, petty-purchase abuse, an approval outliving a worse score) or a control, with the expected band, points, rating status and clearance written from the ruleset before running. <code>ml/redteam_scorecard.py</code> runs each through <code>evaluate_risk</code> and <code>clearance.decide</code> with no database; <code>tests/test_risk_redteam.py</code> asserts every profile and checks that the set exercises every hard override and every refusal reason. Five controls were fixed from it (<a href="risk-model.html#findings">risk-model.html</a>).</p></details>
<details class="alg"><summary><h3 id="alg-gst">GST check and e-invoice QR</h3></summary><p><b>Reading.</b> GSTINs are found by their 15-character pattern; one on a line labelled buyer / bill to / recipient (or under such a line) is ours, the first other one the supplier's. CGST, SGST/UTGST and IGST are summed from lines that start with the label, with their printed rate. HSN/SAC: a 4–8 digit code at the end of an item description (the HSN column), else codes after an "HSN:" or "SAC:" label.</p><p><b>Checks.</b> Supply type from the supplier GSTIN's state code and the place of supply (else our GSTIN's state): same state → CGST + SGST, equal; different → IGST only. Expected GST = Σ line total × rate of the longest matching code prefix in <code>gst_rates</code>; it must equal the charged GST within <code>max(gst.tax_tolerance_inr, 0.5 %)</code>. Taxable value + GST + cess = total. A supplier with no GSTIN in another currency or country is an import: services → reverse charge, GST payable = INR amount × the category's usual rate; hardware → IGST at customs. Any failed check → <i>flagged</i>: review forced, <code>invoice.tax_flagged</code> published, confidence score unchanged.</p><p><b>QR.</b> First two pages rendered at 4× and searched with OpenCV's WeChat QR detector (the standard detector misses dense QRs at lower resolutions); the payload must look like a JWT. <code>jwt.decode(token, key, ["RS256"])</code> proves the portal signed it; its <code>data</code> claim (SellerGstin, BuyerGstin, DocNo, TotInvVal, Irn) is compared with the printed values (numbers normalised, total within the tolerance).</p></details>
<details class="alg"><summary><h3 id="alg-tds">TDS at booking</h3></summary><p>When an invoice is matched: section = vendor's, else <code>tds.category_sections</code>[category of the request type]. Base b = taxable value in INR (else the total, noted). Y = base already booked with the vendor under the section this financial year (April–March). Normal sections deduct on the whole of b once b &gt; per-invoice threshold or Y + b &gt; yearly threshold; 194Q deducts only on max(0, Y + b − T) − max(0, Y − T). Rate = valid lower-deduction certificate, else the no-PAN rate without a valid PAN, else the section rate; TDS rounded to the rupee; net payable = total − TDS. Non-residents are not computed (noted for a CA). Example: ₹1,18,000 SaaS support invoice, ₹1,00,000 before GST, 194J(a) 2 % → TDS ₹2,000, pay ₹1,16,000.</p></details>

<details class="alg"><summary><h3 id="alg-security-algs">Security algorithms</h3></summary>
<ul>
<li><b>argon2id</b> (t = 3, m = 64 MiB, p = 4) password hashes; legacy bcrypt verified (first 72 bytes) and upgraded at login.</li>
<li><b>HIBP k-anonymity</b>: only the first 5 hex chars of SHA-1(password) leave the server; the suffix is matched locally.</li>
<li><b>Single-use tokens</b>: <code>secrets.token_urlsafe(32)</code>, only SHA-256 stored; consumed by one <code>UPDATE … WHERE used_at IS NULL AND expires_at &gt; now() RETURNING</code>, so two clicks can't both succeed.</li>
<li><b>Lockout</b>: a single upsert counts failures per address inside a 15-minute window; 5 → locked 15 minutes (also for unknown addresses).</li>
<li><b>Webhook HMAC</b>: HMAC-SHA256 over JSON with sorted keys and compact separators, compared with <code>hmac.compare_digest</code>; replays rejected by a unique provider event id.</li>
</ul>
</details>
</section>

<section id="security"><h2>9. Security and reliability</h2>
<h3 id="sec-model">Authentication and authorisation model</h3>
<ul>
<li>Stateless HS256 JWTs (15 min) verified in every service with a shared secret; refresh tokens (7 days) only in an httpOnly, SameSite=Strict cookie scoped to <code>/api/auth</code>, with double-submit CSRF. <code>token_version</code> revokes sessions at the next refresh (password change/reset, role change, disable, sign-out everywhere); logout records the refresh token's <code>jti</code> in <code>auth_revoked_refresh_tokens</code>, so a copied cookie can't be refreshed. A disabled user's current access token stays valid until it expires (≤ 15 min).</li>
<li>Role checks per router/endpoint (<code>require_role</code>); object-level checks for requesters (documents, requests, and contracts in the working tree return 404 for others' items). Frontend guards are UX only.</li>
<li>Separation of duties and approval authority enforced server-side for portal and email decisions.</li>
<li>Service-to-service: a service JWT with role <code>service</code> (document worker → ledger), shared secrets for the rules endpoint and token minting; Kafka per-service SCRAM logins with ACLs.</li>
</ul>
<h3 id="sec-controls">Input validation and data protection</h3>
<ul>
<li>Uploads: size caps at gateway and app, ClamAV before storage (fail closed), type by magic bytes, page/pixel caps, sanitised names, extraction in a killable subprocess.</li>
<li>Pydantic models with length caps; validation errors never echo input (shared handler; approval-inventory's override is the exception — it returns <code>str(exc)</code>).</li>
<li>Bank details masked for non-finance roles, never changed by review, never placed in events or the control panel's event log; changes need a second person.</li>
<li>Passwords: argon2id, policy, breached check; enumeration-resistant sign-up/reset/login with dummy-hash timing; lockout per address.</li>
<li>Email links carry tokens after <code>#</code> (not logged); email-action GETs never change state; tokens stored hashed; nginx doesn't log <code>/email-action/</code>; log formatter redacts tokens.</li>
<li>Gateway: CSP without inline scripts, nosniff, frame and referrer policies; only :8080 exposed.</li>
<li>Webhooks: HMAC with constant-time compare and replay protection.</li>
<li>Production fail-closed: published secrets, Mailpit, demo users and simulated signing are refused unless <code>APP_ENV=development</code>.</li>
</ul>

<h3 id="reliability">Reliability and failure handling</h3>
<ul>
<li>Outbox + inbox + DLQ for most events; Temporal for long waits; the sweep for stranded documents; a reconciler for lost contract effects; idempotency on uploads, ledger booking, contract generation, webhooks.</li>
<li><b>Publishes that bypass the outbox</b> (lost if Kafka is down at that moment): <code>business_rule.updated</code> (after commit; caches self-heal in ≤ 5 min), <code>document.classified</code> after a human review, the sweep's re-published <code>document.ingested</code> (harmless — the sweep repeats), and Temporal activities' <code>approval.decided</code>/<code>notification.send</code>/<code>reminder.due</code> (retried by Temporal).</li>
<li>Start-up uses <code>with_retry</code> for dependencies; health endpoints ping the DB (notification also reports its consumer).</li>
</ul>
<h3 id="critical-paths">Critical code paths — change with care</h3>
<ul>
<li>shared/auth/*, shared/runtime_env.py, shared/kafka_security.py — every service's security.</li>
<li>shared/eventing/* and every <code>staged(...)</code> call — event delivery guarantees.</li>
<li>shared/lifecycle.py and approval_workflow.py — status integrity; workflow code must stay replay-compatible (use <code>workflow.patched</code>).</li>
<li>invoice_ledger.py, vendor_payment_service.py, upload_service.py — money and fraud controls.</li>
<li>contract_service.sign_contract_digitally — legal record of a signature.</li>
<li>Migrations and shared/db/init.sql — shared data for all services.</li>
</ul>

<section id="viva"><h2>10. Viva and developer understanding</h2><h3 id="qa">Questions and answers</h3>
<div class="qa">
<details><summary>1. What problem does the project solve, in one minute?</summary><p>It automates IT procurement from a vendor's document to a signed contract and a matched invoice: reading documents with OCR/ML, routing approvals by amount with enforced authority, generating and e-signing contracts, scoring vendor risk, and emailing people — while catching fraud patterns (changed bank details, look-alike vendors, sanctions) and bringing a human in only for decisions and uncertain cases.</p></details>
<details><summary>2. Why microservices instead of one application?</summary><p>Each agent has a distinct domain and owner (team of four), its own scaling profile (the OCR worker is heavy; auth is light) and its own failure modes. They cooperate through events, so one can be down without blocking intake. The cost is operational complexity and a shared database that couples them — a deliberate trade-off for a single-machine prototype.</p></details>
<details><summary>3. Isn't a shared database contrary to microservices?</summary><p>Yes, partly. The team kept one PostgreSQL for simplicity but gave each service ownership of its tables and migrations. The coupling shows up concretely: the ledger's FK to vendors forced new vendors to be committed in their own transaction. A stricter design would give each service its own schema and pass data only through events/APIs.</p></details>
<details><summary>4. What is the transactional outbox and why is it needed?</summary><p>Writing the DB change and publishing to Kafka are two systems; a crash between them loses the event (requests were stuck at “approved” with a signed contract). The outbox writes the event as a row in the same transaction; a relay publishes unsent rows afterwards. Delivery becomes at-least-once, so consumers dedupe by event_id (event_inbox) and use idempotent handlers.</p></details>
<details><summary>5. What happens if a consumer keeps failing on one event?</summary><p><code>deliver()</code> retries at 0, 0.5, 2 and 5 s, then stores the event and error in <code>event_dlq</code>. The loop continues. An operator sees it on the Control Panel and can replay it once the cause is fixed — replay calls that consumer's handler directly instead of re-publishing to every consumer group.</p></details>
<details><summary>6. Why Temporal for approvals instead of a cron job?</summary><p>Approvals wait hours or days with SLA timers and reminders. Temporal persists workflow state and timers, survives restarts, and retries activities. A cron job would need to rebuild that state machine from the DB on every tick. The team also uses Temporal's versioning (<code>workflow.patched</code>) to change workflow logic without breaking running instances.</p></details>
<details><summary>7. How is separation of duties enforced?</summary><p>Server-side in <code>evaluate_authority</code>: you can't approve a request you raised (admins included), can't approve two levels of the same request, must be assigned to the level (or a live delegate of someone who is), and must be within your amount limit. The workflow also discards a decision authorised for a different level, so a double-click can't approve two levels.</p></details>
<details><summary>8. How does the system decide a document needs human review?</summary><p>A weighted average of field confidences, each multiplied by text quality, compared with a threshold (0.8, per-vendor calibrated after enough reviews) — plus forced review for “other” documents, look-alike vendors, LayoutLMv3 disagreements, duplicates (score capped at 0.5) and unmatched invoices. See the worked example in Algorithms.</p></details>
<details><summary>9. Why keep regex extraction when you have LayoutLMv3?</summary><p>The regexes are deterministic, fast and match the synthetic templates; the model is a ~1 GB download that may be absent. LayoutLMv3 acts as an independent second reading: disagreement is a strong signal to ask a human. Every model has a fallback so the pipeline never blocks on ML.</p></details>
<details><summary>10. How accurate is extraction?</summary><p>On the synthetic set: PDFs 100 % of fields; images 47 % without and 49 % with preprocessing (docs/results/extraction.md). Noisy images got slightly worse with preprocessing (44 % vs 47 %), so denoise is off. These are synthetic numbers, not a real-world benchmark.</p></details>
<details><summary>11. Explain the invoice three-way match.</summary><p>Each purchase request has a remaining balance and remaining line quantities. An invoice matches when every line maps to a PO line (text similarity ≥ 0.55) with enough quantity left, at a unit price no more than 1 % above the agreed price, and its total fits the remaining balance. One clean candidate → matched/partial; several → ambiguous; plausible but wrong → variance (never auto-accepted). Booking row-locks the requests so two invoices can't spend the same balance.</p></details>
<details><summary>12. What fraud controls exist?</summary><p>Bank details from documents or onboarding never go live directly — a second person must verify them via a known channel, and invoices for that vendor are on payment hold meanwhile; look-alike vendor names are flagged and held; duplicate invoices detected; sanctions screening is a hard override; GSTIN checksum and IFSC validation; uploads virus-scanned.</p></details>
<details><summary>13. How is vendor risk computed?</summary><p>Since 21 Oct, with a deterministic 100-point ruleset (<code>app/services/scorecard/</code>): collectors gather observations (local records, format checks, then external sources behind a circuit breaker), and a pure evaluator turns them into integer points per check — identity and compliance 39, operational performance 35, cyber 17, company standing 6, reputation 3. Low 0–24, Medium 25–49, High 50+. Hard overrides (sanctions match, cancelled GSTIN, invalid bank route) force High. If checks are missing the rating is <em>provisional</em> and it is not cleared; its band is computed from the checks that ran, re-weighted to 100 (a vendor with nothing checked is High until a check completes); information about the vendor that can't be verified (no GSTIN, registration, financials, bank, domain) counts in full, and no verified identity means High. Each score keeps its snapshot and SHA-256 so it replays exactly. Models (OCR, Legal-BERT, fuzzy matching) produce observations, never points. The earlier random forest (ROC-AUC 0.715) is archived in <code>ml/archive/</code>. Open issues, such as contract signing not yet using the clearance gate's decisions, are in <code>docs/index.html#risk#merge-review</code>.</p></details>
<details><summary>14. Why IsolationForest for licence usage?</summary><p>There are no labels for “wasted licence” in real life, so an unsupervised outlier detector fits. It was trained on 360 simulated licences with known patterns, so it could be evaluated (test ROC-AUC 0.954). SHAP explains each score so the reclaim proposal shows its reasons.</p></details>
<details><summary>15. How do you stop the same document being processed twice?</summary><p>An atomic claim: <code>UPDATE … SET status='processing' WHERE id=:id AND status='pending'</code>. Only the worker that changes the row proceeds; a redelivered event finds it already claimed.</p></details>
<details><summary>16. What happens if the worker crashes mid-document?</summary><p>The transaction rolls back; the row stays “processing”. The 60-second sweep returns rows stuck over 5 minutes to “pending” and re-publishes them with linear back-off; after 5 attempts the document is failed with a clear message.</p></details>
<details><summary>17. How are passwords and sessions protected?</summary><p>argon2id hashes, a 12–128 character policy, breached-password check by k-anonymity, lockout, enumeration-resistant responses. Access tokens live only in memory; refresh tokens in an httpOnly SameSite=Strict cookie with a CSRF header; token_version ends sessions after a password change.</p></details>
<details><summary>18. Why is the GET on an email-approval link not allowed to approve?</summary><p>Mail security scanners prefetch links. If GET changed state, a scanner could approve a purchase. GET only renders a confirmation page; POST performs the single-use decision.</p></details>
<details><summary>19. How do business rules change behaviour without redeploying?</summary><p>Rules live in auth-service's table; services read them via <code>get_rule</code> with a 5-minute cache and a code fallback; a change publishes <code>business_rule.updated</code>, which invalidates caches. Tests prove each enforced rule changes behaviour.</p></details>
<details><summary>20. How do you trace one request through all services?</summary><p>nginx assigns <code>X-Correlation-ID</code>; middleware stores it in a context variable; logs and events carry it; consumers restore it. Promtail ships JSON logs to Loki; Grafana's Logs dashboard filters by the id.</p></details>
<details><summary>21. What is the weakest part of the system today?</summary><p>Honest answers: image OCR accuracy (~49 % of fields on synthetic scans); the uncalibrated review threshold; synthetic-only evaluation data; a shared database; CI that doesn't run tests; reminder events with no consumer; and the per-level approval.decided issue that lets a contract be generated before final approval.</p></details>
<details><summary>22. Why does contract generation sometimes happen too early?</summary><p>The approval workflow publishes <code>approval.decided</code> after each level. contract-risk-agent generates on any “approved” decision without checking that it's the final level. The dev database shows 6 two-level requests with contracts generated before their final decision. The fix would check the request status (or decision_level vs the chain) before generating — as document-vendor-agent already does.</p></details>
<details><summary>23. How does the frontend deal with asynchronous backends?</summary><p>Actions that complete later (approvals via Temporal, document processing) are followed with <code>usePolling</code> until the settled state appears; skeletons only on first load so a reload after an action doesn't lose the confirmation.</p></details>
<details><summary>24. How is the system tested?</summary><p>Per-service pytest suites in their images, root tests for shared code and config (ACLs vs code, rules registry), Temporal's test environment for workflows, and end-to-end scripts through the gateway (invoice lifecycle 71/71, document pipeline 52/52, auth flows 42/42, Playwright UI checks). Fixes were verified by reverting them and watching the test fail.</p></details>
<details><summary>25. What would you change for production?</summary><p>Real secrets and TLS (gateway HTTPS, Kafka TLS), per-service databases or schemas, CI running tests, a managed Kafka/Temporal, consumers for reminder.due, the approval-level fix, calibrated review thresholds on real data, and the P0 key rotation.</p></details>
<details><summary>26. Follow-up: why HS256 rather than RS256 for JWTs?</summary><p>All verifiers are trusted internal services, so a shared secret is simpler. With RS256 only auth-service would hold the private key and services would verify with the public key — better if any verifier were less trusted. The secret is refused if left at its published default outside development.</p></details>
<details><summary>27. Follow-up: what if auth-service is down?</summary><p>No new logins or refreshes; existing access tokens keep working until expiry (verification is local). Business rules fall back to cached values, then to code defaults (15 s back-off). Rule-change events stop.</p></details>
<details><summary>28. Follow-up: why Kafka and not direct HTTP between agents?</summary><p>Producers don't need consumers to be up; multiple consumers react to the same fact (document.classified → approval, notification); load is buffered; partitions allow parallel workers. Synchronous HTTP is still used where an immediate answer is needed (ledger match, token minting, assistant tools).</p></details>
</div>

<h3 id="modify">How to safely modify this project</h3>
<ol>
<li><b>Find the owner.</b> Each service has an owner (Vaidehi, Niraj, Anjali, Anooj); don't build the email automation or chatbot (Anooj's).</li>
<li><b>Schema</b>: never edit shared/db/init.sql; add an idempotent migration in the owning service; check existing data before a constraint; ask before anything destructive.</li>
<li><b>Events</b>: new topic → kafka-topics.yaml + acls.conf + events.md (+ ACL test); publish via <code>staged(producer, session)</code> before commit; consume through <code>deliver()</code> and make the handler idempotent; update payload builders and schema tests.</li>
<li><b>Identity</b>: take user identity from the JWT, never a body field. Keep router-level auth.</li>
<li><b>Errors</b>: raise <code>HTTPException</code>; use <code>detail={"code","message"}</code> for specific codes; put details in log messages (extra fields are dropped).</li>
<li><b>Request status</b>: change it only through the model so shared/lifecycle.py validates it; add new statuses to both the transition table and the DB CHECK.</li>
<li><b>Temporal</b>: guard behaviour changes with <code>workflow.patched</code>; use <code>asyncio.sleep</code>, not <code>workflow.sleep</code>; signal/activity optional fields must be <code>Optional[...]</code>.</li>
<li><b>Business rules</b>: new rule → auth migration seed + <code>get_rule(key, fallback)</code> + a behaviour test + docs/business-rules.md (registry test enforces it).</li>
<li><b>Frontend</b>: one home page per item; reuse the agent's action component; skeleton only on first load; types in types/api.ts.</li>
<li><b>Verify</b>: run the service suite and root tests; rebuild the image, <code>docker compose up -d</code>, restart nginx; exercise the flow live; for a fix, revert it once and confirm the test fails.</li>
</ol>

<h3 id="glossary">Glossary</h3>
<dl class="gloss">
<dt>Agent</dt><dd>One of the platform's services; each owns a domain and reacts to events.</dd>
<dt>Envelope</dt><dd>(1) Kafka event wrapper; (2) the dict passed between document-pipeline stages.</dd>
<dt>Outbox / inbox / DLQ</dt><dd>Tables guaranteeing events are published with their change, processed once per consumer, and kept when they fail.</dd>
<dt>Spend tier</dt><dd>auto / manager / manager+finance — decides the approval chain from the amount.</dd>
<dt>Approval chain / level</dt><dd>Ordered approver roles (e.g. <code>dept_manager</code>, <code>finance_head</code>); a level is one step.</dd>
<dt>SoD</dt><dd>Separation of duties: maker ≠ checker, one person per level.</dd>
<dt>SLA</dt><dd>Time allowed for an approval level (48 h default) before escalation.</dd>
<dt>Reclaim / reinstate</dt><dd>Request to take back an unused licence seat (after a grace period) / to restore it.</dd>
<dt>Backorder</dt><dd>Part of a hardware request that can't be served from stock yet.</dd>
<dt>Three-way match</dt><dd>Invoice vs order vs what remains to invoice, at line level.</dd>
<dt>Payment hold</dt><dd>Invoice flag blocking payment while bank details are unverified or the vendor looks like an impostor.</dd>
<dt>Dual control</dt><dd>A bank-detail change needs a second, different person to verify it.</dd>
<dt>Look-alike vendor</dt><dd>New vendor name 70–87 % similar to an existing one.</dd>
<dt>Drop folder</dt><dd><code>./inbox</code>; files dropped there are processed unattended.</dd>
<dt>GSTIN / IFSC</dt><dd>Indian GST registration number (15 chars, checksum) / bank branch code.</dd>
<dt>Hard override</dt><dd>A check that forces risk band High regardless of the model.</dd>
<dt>PSI</dt><dd>Population Stability Index, a drift measure between score distributions.</dd>
<dt>CUAD</dt><dd>Contract Understanding Atticus Dataset; Legal-BERT was fine-tuned on it.</dd>
<dt>Showcase mode</dt><dd>Demo scenario endpoints, on in development only.</dd>
<dt>Live mode</dt><dd>Admin switch allowing quota-limited calls to paid/limited external APIs.</dd>
<dt>Correlation id</dt><dd>Id following one request through logs and events.</dd>
<dt>token_version (tv)</dt><dd>Counter copied into refresh tokens; bumping it ends sessions.</dd>
<dt>Model routing log</dt><dd>Record of which model (primary or fallback) handled each extraction/clause read and why.</dd>
<dt>FR-xx / BR-x / RS-xx</dt><dd>Task ids in docs/TODO.md (feedback requirements, basic requirements, research).</dd>
</dl>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));

  // ---- navigation toggle (collapsible on desktop, drawer on mobile)
  const toggle = $("#navToggle");
  const mobile = () => window.matchMedia("(max-width: 860px)").matches;
  toggle.addEventListener("click", () => {
    if (mobile()) document.body.classList.toggle("nav-open");
    else document.body.classList.toggle("nav-hidden");
    toggle.setAttribute("aria-expanded", String(mobile() ? document.body.classList.contains("nav-open") : !document.body.classList.contains("nav-hidden")));
  });
  $$("nav.side a").forEach(a => a.addEventListener("click", () => { if (mobile()) document.body.classList.remove("nav-open"); }));

  // ---- open the target's <details> ancestors and flash it
  function reveal(el) {
    if (!el) return;
    for (let p = el; p; p = p.parentElement) if (p.tagName === "DETAILS") p.open = true;
    if (el.tagName === "DETAILS") el.open = true;
    el.scrollIntoView({ block: "start" });
    if (el.tagName === "SECTION" || el.tagName === "H3") return;
    el.classList.add("flash-target");
    setTimeout(() => el.classList.remove("flash-target"), 1600);
  }
  function revealHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    if (id) reveal(document.getElementById(id));
  }
  window.addEventListener("hashchange", revealHash);
  if (location.hash) setTimeout(revealHash, 30);

  // ---- expand / collapse
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-expand],[data-collapse]");
    if (!b) return;
    const scope = b.dataset.expand || b.dataset.collapse;
    const root = scope === "all" ? document : document.getElementById(scope);
    $$("details", root).forEach(d => d.open = !!b.dataset.expand);
  });

  // ---- copy buttons
  $$("pre.code").forEach(pre => {
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "copy"; btn.textContent = "Copy";
    btn.addEventListener("click", async () => {
      const text = pre.querySelector("code").innerText;
      try { await navigator.clipboard.writeText(text); }
      catch { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
      btn.textContent = "Copied"; setTimeout(() => btn.textContent = "Copy", 1200);
    });
    pre.appendChild(btn);
  });

  // ---- light syntax highlighting (bash, python)
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const KW = { python: /\b(await|async|def|return|if|else|elif|for|in|not|and|or|import|from|as|with|try|except|raise|None|True|False|class)\b/,
               bash: /\b(cd|docker|compose|make|python|pip|npm|exec|run|up|down|restart|logs)\b/ };
  $$("pre.code[data-lang]").forEach(pre => {
    const lang = pre.dataset.lang; if (!KW[lang]) return;
    const code = pre.querySelector("code");
    const re = new RegExp(String.raw`(#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(\d+(?:\.\d+)?)\b|` + KW[lang].source, "g");
    const src = code.textContent; let out = "", last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      const cls = m[1] ? "tk-c" : m[2] ? "tk-s" : m[3] ? "tk-n" : "tk-k";
      out += `<span class="${cls}">${esc(m[0])}</span>`; last = re.lastIndex;
    }
    code.innerHTML = out + esc(src.slice(last));
  });

  // ---- current section in the sidebar
  const navLinks = $$("nav.side a"); const byId = new Map(navLinks.map(a => [a.getAttribute("href").slice(1), a]));
  const heads = $$("main section, main h3[id]");
  const obs = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) { navLinks.forEach(a => a.classList.remove("current")); const a = byId.get(en.target.id); if (a) a.classList.add("current"); } });
  }, { rootMargin: "-60px 0px -75% 0px" });
  heads.forEach(h => obs.observe(h));

  // ---- search
  const q = $("#q"), box = $("#results");
  const sectionTitle = el => { const s = el.closest("section"); return s ? s.querySelector("h2").textContent : ""; };
  function anchorFor(el) {
    const own = el.closest("[id]"); if (own && own.tagName !== "SECTION" && own.tagName !== "MAIN") return own;
    let p = el; while (p && p.tagName !== "SECTION") { let s = p.previousElementSibling;
      while (s) { if (s.matches && s.matches("h3[id]")) return s; const h = s.querySelector && s.querySelector("h3[id]"); if (h) return h; s = s.previousElementSibling; } p = p.parentElement; }
    return el.closest("section");
  }
  const index = $$("main .file, main p, main li, main tr, main dt, main dd, main summary, main h3, main pre").map(el => ({ el, text: el.textContent.replace(/\s+/g, " ").trim() }))
    .filter(x => x.text.length > 2);
  let active = -1, shown = [];
  function search(term) {
    term = term.trim(); box.innerHTML = ""; active = -1;
    if (term.length < 2) { box.style.display = "none"; return; }
    const words = term.toLowerCase().split(/\s+/);
    const hits = [];
    for (const x of index) { const t = x.text.toLowerCase(); if (words.every(w => t.includes(w))) { const score = (x.el.classList.contains("file") ? 3 : 0) + (x.el.tagName === "H3" || x.el.tagName === "SUMMARY" ? 2 : 0); hits.push({ ...x, score }); } }
    hits.sort((a, b) => b.score - a.score);
    const seen = new Set(); shown = [];
    for (const h of hits) { const a = anchorFor(h.el); const key = h.el; if (seen.has(key)) continue; seen.add(key); shown.push({ ...h, anchor: a }); if (shown.length >= 40) break; }
    if (!shown.length) { box.innerHTML = '<a><span class="snip">No matches</span></a>'; box.style.display = "block"; return; }
    const w0 = words[0];
    box.innerHTML = shown.map((h, i) => {
      const t = h.text; const at = Math.max(0, t.toLowerCase().indexOf(w0) - 50);
      let snip = (at ? "…" : "") + t.slice(at, at + 170) + (t.length > at + 170 ? "…" : "");
      snip = esc(snip); words.forEach(w => { if (w) snip = snip.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>"); });
      const where = sectionTitle(h.el) + (h.anchor && h.anchor.tagName === "H3" ? " › " + esc(h.anchor.textContent) : h.el.classList.contains("file") ? " › file" : "");
      return `<a href="#" data-i="${i}"><div class="where">${where}</div><div class="snip">${snip}</div></a>`;
    }).join("");
    box.style.display = "block";
  }
  function go(i) { const h = shown[i]; if (!h) return; box.style.display = "none"; reveal(h.el.closest(".file") || h.el); }
  q.addEventListener("input", () => search(q.value));
  q.addEventListener("keydown", e => {
    const items = $$("a[data-i]", box);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); active = Math.max(0, Math.min(items.length - 1, active + (e.key === "ArrowDown" ? 1 : -1))); items.forEach((a, i) => a.classList.toggle("active", i === active)); items[active] && items[active].scrollIntoView({ block: "nearest" }); }
    else if (e.key === "Enter") { e.preventDefault(); go(active >= 0 ? active : 0); }
    else if (e.key === "Escape") { box.style.display = "none"; q.blur(); }
  });
  box.addEventListener("click", e => { const a = e.target.closest("a[data-i]"); if (!a) return; e.preventDefault(); go(+a.dataset.i); });
  document.addEventListener("click", e => { if (!e.target.closest(".search")) box.style.display = "none"; });
  document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== q && !e.target.closest("input,textarea")) { e.preventDefault(); q.focus(); } });

  // ---- print: open everything first
  let wasOpen = [];
  window.addEventListener("beforeprint", () => { wasOpen = $$("details").map(d => d.open); $$("details").forEach(d => d.open = true); });
  window.addEventListener("afterprint", () => { $$("details").forEach((d, i) => d.open = wasOpen[i]); });
})();
</script>

<h1 id="deployment-backups-and-recovery">Deployment, backups and recovery</h1>
<p>The project runs as one Docker Compose stack on one machine. It has
<strong>not</strong> been deployed anywhere shared (a team decision). This page says
what a deployment needs, what was checked on Oct 19, 2026 and how to
back up and restore the data.</p>
<h2 id="1-what-was-checked-oct-19-2026">1. What was checked (Oct 19, 2026)</h2>
<div class="tblwrap"><table>
<thead>
<tr>
<th>Check</th>
<th>How</th>
<th>Result</th>
</tr>
</thead>
<tbody>
<tr>
<td>Services refuse published secrets in production</td>
<td>each service image started with <code>APP_ENV=production</code> and no secrets</td>
<td>all 6 refused (<code>InsecureConfigError</code> naming the secret)</td>
</tr>
<tr>
<td>Services start with real secrets</td>
<td>the same, with every secret below set to a new value</td>
<td>all 6 services and their workers start</td>
</tr>
<tr>
<td>Business rules reach every service with a real secret</td>
<td><code>RULES_ENGINE_INTERNAL_SECRET</code> was passed only to auth-service, so with a real value the others got 403 and silently used code defaults; now passed to every service and worker that reads rules (<code>tests/test_security_config.py</code>)</td>
<td>47 rules fetched by each</td>
</tr>
<tr>
<td>Temporal keeps working with a real <code>POSTGRES_PASSWORD</code></td>
<td>its password was hard-coded to <code>postgres</code>; now taken from <code>POSTGRES_PASSWORD</code></td>
<td>config resolves</td>
</tr>
<tr>
<td>Backup is complete</td>
<td><code>./scripts/backup.sh</code>, then the dump loaded into a throwaway <code>postgres:16</code> container and the MinIO copy unpacked into a scratch volume</td>
<td>0 errors; requests, documents, vendors, contracts, users and Temporal executions identical to the live stack; every MinIO object present</td>
</tr>
<tr>
<td>Role checks on the server</td>
<td>through the gateway: requester on an admin endpoint, no token on each list</td>
<td>403 / 401</td>
</tr>
<tr>
<td>Logout ends the session</td>
<td>refresh with a copy of the cookie taken before logout</td>
<td>401</td>
</tr>
<tr>
<td>Dependencies</td>
<td><code>npm audit</code>, <code>pip-audit</code> on every service image</td>
<td>see <a href="#5-known-dependency-advisories">§5</a></td>
</tr>
</tbody>
</table></div>
<p>Not checked: a run on a second machine or a cloud host, TLS, a real SMTP
server or real e-signature accounts.</p>
<h2 id="2-before-any-shared-deployment">2. Before any shared deployment</h2>
<ol>
<li><strong>Rotate the GSTINCheck API key.</strong> The old key is in git history
   (commits <code>747ea13</code>, <code>0413162</code>) and the repository is public. Only its
   owner can revoke it at gstincheck.co.in. Put the new key in <code>.env</code> only.</li>
<li><strong>Set <code>APP_ENV=production</code></strong> in <code>.env</code>. This turns off demo accounts,
   showcase endpoints, simulated signing and <code>EMAIL_MODE=dev</code>, and makes
   the services refuse the published defaults.</li>
<li><strong>Set a new value for every secret</strong> (<code>openssl rand -hex 32</code> for each):</li>
</ol>
<div class="tblwrap"><table>
<thead>
<tr>
<th>Variable</th>
<th>Used by</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>JWT_SECRET</code></td>
<td>every service (signs and checks logins)</td>
</tr>
<tr>
<td><code>POSTGRES_PASSWORD</code></td>
<td>Postgres, every service, Temporal</td>
</tr>
<tr>
<td><code>MINIO_ROOT_PASSWORD</code></td>
<td>MinIO, document-vendor-agent</td>
</tr>
<tr>
<td><code>ESIGN_WEBHOOK_SECRET</code></td>
<td>contract-risk-agent</td>
</tr>
<tr>
<td><code>RULES_ENGINE_INTERNAL_SECRET</code></td>
<td>auth-service and the services reading rules</td>
</tr>
<tr>
<td><code>INTERNAL_SERVICE_TOKEN</code></td>
<td>notification-agent → approval-inventory-agent</td>
</tr>
<tr>
<td><code>KAFKA_ADMIN_PASSWORD</code>, <code>KAFKA_PASSWORD_*</code></td>
<td>Redpanda and each service's Kafka login</td>
</tr>
<tr>
<td><code>EMAIL_INTAKE_PASSWORD</code></td>
<td>the intake mailbox, if email intake is on</td>
</tr>
</tbody>
</table></div>
<p>Changing <code>POSTGRES_PASSWORD</code> or the Kafka passwords on an existing
   stack needs fresh volumes, because both are set when a volume is
   first created. Back up first (§4).
4. <strong>Email</strong>: <code>EMAIL_MODE=smtp</code> and the <code>SMTP_*</code> settings. <code>PUBLIC_BASE_URL</code>
   must be the HTTPS address people use, because emailed links carry
   one-time tokens.
5. <strong>HTTPS</strong>: put a TLS-terminating proxy (Caddy, or nginx with
   Let's Encrypt) in front of port 8080 and leave <code>AUTH_COOKIE_SECURE</code>
   unset (it is on outside development). Only the gateway listens on all
   interfaces; Temporal, Kafka, MinIO, MLflow, Grafana and the services
   are bound to <code>127.0.0.1</code> (tested by <code>tests/test_security_config.py</code>).
6. <strong>Frontend</strong>: build with <code>VITE_SHOW_DEMO_ACCOUNTS=false</code>
   (<code>cd frontend &amp;&amp; VITE_SHOW_DEMO_ACCOUNTS=false npm run build</code>).
7. <strong>Grafana</strong>: add <code>GF_SECURITY_ADMIN_PASSWORD</code> to the <code>grafana</code>
   service's environment if anyone other than the operator can reach it
   (it is bound to <code>127.0.0.1:3000</code> and starts with admin/admin).
8. <strong>Start</strong>: <code>./run.sh</code>, then check <code>docker compose ps</code> (all healthy) and
   sign in as the first admin. Create accounts through sign-up and give
   roles on the Users page.
9. <strong>GST</strong>: set <code>EINVOICE_PUBLIC_KEY</code> (the Invoice Registration Portal's
   published public key, PEM) so e-invoice QRs are verified; the demo key in
   <code>shared/einvoice/</code> is refused in production. Set our GSTIN (rule
   <code>gst.buyer_gstin</code>) and have a chartered accountant confirm the GST rates,
   TDS sections and MSME rules (GST and TDS page, Business Rules › Tax).
10. <strong>Backups</strong>: schedule <code>./scripts/backup.sh</code> (for example nightly with
   cron) and copy <code>.run/backups/</code> to another machine.</p>
<h2 id="3-what-holds-the-data">3. What holds the data</h2>
<div class="tblwrap"><table>
<thead>
<tr>
<th>Volume</th>
<th>Contents</th>
<th>Backed up?</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>pgdata</code></td>
<td>every table, accounts, business rules, audit log, Temporal's workflow state</td>
<td>yes, <code>pg_dumpall</code></td>
</tr>
<tr>
<td><code>miniodata</code></td>
<td>uploaded documents and generated contract PDFs</td>
<td>yes, a tar of the volume</td>
</tr>
<tr>
<td><code>redpanda-data</code></td>
<td>Kafka topics</td>
<td>no: each event is already applied to Postgres; unsent events wait in the outbox table</td>
</tr>
<tr>
<td>(no volume) Redis</td>
<td>cache, idempotency keys, rate-limit counters</td>
<td>no: rebuilt on use</td>
</tr>
<tr>
<td><code>hf-cache</code>, <code>docling-models</code>, <code>paddleocr-models</code>, <code>clamav-data</code></td>
<td>models and virus signatures</td>
<td>no: <code>./scripts/download-models.sh</code> and ClamAV's updater fetch them again</td>
</tr>
<tr>
<td><code>grafana-data</code>, <code>loki-data</code></td>
<td>dashboards (provisioned from <code>infra/</code>) and logs</td>
<td>no</td>
</tr>
</tbody>
</table></div>
<h2 id="4-backup-and-restore">4. Backup and restore</h2>
<pre><code class="language-bash">./scripts/backup.sh               # → .run/backups/postgres-&lt;stamp&gt;.sql.gz + miniodata-&lt;stamp&gt;.tgz
./scripts/restore.sh              # list the backups
./scripts/restore.sh &lt;stamp&gt;      # replace all data with that backup
</code></pre>
<ul>
<li><code>backup.sh</code> runs against the live stack without stopping anything, and
  fails if the dump is incomplete. A backup is about 2 MB of SQL plus the
  size of the documents.</li>
<li><code>restore.sh</code> first backs up the current data as <code>&lt;now&gt;-before-restore</code>,
  so a restore can be undone with another restore. It then stops the
  stack, empties the Postgres, MinIO and Kafka volumes, loads the backup
  and starts everything with <code>./run.sh --no-build</code>.</li>
<li><code>./scripts/reset-demo.sh</code> uses <code>backup.sh</code> before it clears the demo
  data, and prints the <code>restore.sh</code> command that undoes it.</li>
</ul>
<p>To move the platform to another machine: run <code>backup.sh</code>, copy the two
files into <code>.run/backups/</code> on the new machine, run <code>./install.sh</code> there,
then <code>./scripts/restore.sh &lt;stamp&gt;</code>.</p>
