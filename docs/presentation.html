<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentation · Procurement Platform</title>
<meta name="description" content="Project documents of the IT Procurement Intelligence Platform: Presentation">
<style>
:root { --bg:#f4f6f9; --panel:#fff; --side:#fbfcfe; --ink:#172033; --muted:#5d6879; --line:#e1e6ee; --hover:#eef2f8;
  --blue:#2563c9; --orange:#d9730d; --green:#1d8a4a; --purple:#7a3fa3; --pink:#d1336b; --teal:#0f7f86; --grey:#4b5563; }
:root[data-theme="dark"] { --bg:#0e1218; --panel:#161c24; --side:#121820; --ink:#e6ebf1; --muted:#9aa5b4; --line:#252e3a; --hover:#1c2430;
  --blue:#7aa7f2; --orange:#f2a250; --green:#4cc27f; --purple:#b98ae0; --pink:#f07aa0; --teal:#52c3c9; --grey:#a3adba; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0e1218; --panel:#161c24; --side:#121820; --ink:#e6ebf1; --muted:#9aa5b4; --line:#252e3a; --hover:#1c2430;
  --blue:#7aa7f2; --orange:#f2a250; --green:#4cc27f; --purple:#b98ae0; --pink:#f07aa0; --teal:#52c3c9; --grey:#a3adba; } }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
body { display:flex; }
svg.i { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.side { width:232px; flex:none; display:flex; flex-direction:column; gap:16px; padding:16px 12px; background:var(--side); border-right:1px solid var(--line); transition:width .15s; }
.brand { display:flex; align-items:center; gap:10px; padding:2px 4px; font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; }
.mark { width:34px; height:34px; border-radius:10px; flex:none; display:grid; place-items:center; color:#fff;
  background:linear-gradient(135deg, var(--blue), var(--purple)); }
.mode { display:grid; grid-template-columns:1fr 1fr; gap:2px; background:var(--hover); border-radius:10px; padding:3px; }
.mode a { display:flex; align-items:center; justify-content:center; gap:6px; padding:6px 4px; border-radius:8px; color:var(--muted);
  text-decoration:none; font-weight:600; font-size:13px; }
.mode a[aria-current="true"] { background:var(--panel); color:var(--ink); box-shadow:0 1px 2px rgb(0 0 0 / .1); }
.mode svg.i { width:16px; height:16px; }
nav { display:flex; flex-direction:column; gap:2px; overflow-y:auto; }
nav a { --c:var(--blue); display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:10px; color:var(--ink);
  text-decoration:none; font-weight:500; white-space:nowrap; }
nav a .ic { width:30px; height:30px; flex:none; border-radius:8px; display:grid; place-items:center; color:var(--c);
  background:color-mix(in srgb, var(--c) 14%, transparent); }
nav a:hover { background:var(--hover); }
nav a[aria-current="page"] { background:color-mix(in srgb, var(--c) 11%, var(--panel)); font-weight:650; }
nav a[aria-current="page"] .ic { background:var(--c); color:var(--panel); }
.foot { margin-top:auto; display:flex; gap:6px; }
.btn { display:grid; place-items:center; width:36px; height:36px; border:1px solid var(--line); background:var(--panel); color:var(--muted);
  border-radius:9px; cursor:pointer; }
.btn:hover { color:var(--ink); }
body.slim .side { width:68px; }
body.slim .lbl, body.slim .mode .lbl { display:none; }
body.slim .mode { grid-template-columns:1fr; }
body.slim .foot { flex-direction:column; }
main { flex:1; position:relative; min-width:0; }
main iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
main iframe[hidden] { display:none; }
@media (max-width:760px) {
  body { flex-direction:column; }
  .side, body.slim .side { width:auto; flex-direction:row; align-items:center; gap:8px; padding:8px 12px; border-right:0; border-bottom:1px solid var(--line); overflow-x:auto; }
  .lbl, .brand .lbl { display:none; }
  .mode { grid-template-columns:1fr 1fr; flex:none; }
  nav { flex-direction:row; overflow:visible; }
  nav a { padding:4px; }
  .foot { margin:0 0 0 auto; flex-direction:row; }
  #slim { display:none; }
}
</style></head>
<body>
<aside class="side">
  <div class="brand"><span class="mark"><svg class="i"><use href="#i-box"/></svg></span><span class="lbl">Procurement Platform</span></div>
  <div class="mode" role="group" aria-label="Dashboard"><a href="index.html" data-dash="team" aria-current="false" title="Team workspace"><svg class="i"><use href="#i-users"/></svg><span class="lbl">Team</span></a><a href="presentation.html" data-dash="present" aria-current="true" title="Presentation"><svg class="i"><use href="#i-screen"/></svg><span class="lbl">Present</span></a></div>
  <nav aria-label="Pages"><a href="#status" data-id="status" title="What is built, agent by agent" style="--c:var(--blue)"><span class="ic"><svg class="i"><use href="#i-flow"/></svg></span><span class="lbl">Project status</span></a><a href="#risk" data-id="risk" title="Scorecard, clearance, red team, evaluation" style="--c:var(--pink)"><span class="ic"><svg class="i"><use href="#i-shield"/></svg></span><span class="lbl">Vendor risk</span></a><a href="#slides" data-id="slides" title="The final-review deck; press F to present" style="--c:var(--purple)"><span class="ic"><svg class="i"><use href="#i-screen"/></svg></span><span class="lbl">Slides</span></a></nav>
  <div class="foot">
    <button class="btn" type="button" id="theme" aria-label="Switch light or dark theme" title="Light or dark"><svg class="i"><use href="#i-moon"/></svg></button>
    <button class="btn" type="button" id="slim" aria-label="Collapse the sidebar" title="Collapse the sidebar"><svg class="i"><use href="#i-side"/></svg></button>
  </div>
</aside>
<main id="main"></main>

 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol><symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol><symbol id="i-side" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol></defs></svg>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Procurement Platform Flow</title>
<style>
  :root {
    --bg: #f4f6f9; --panel: #ffffff; --ink: #172033; --muted: #5d6879; --line: #d6dce5; --arrow: #8e99a8;
    --src: #1f5fbf; --stream: #7a3fa3; --proc: #2563c9; --gate: #1d8a4a; --agent: #d9730d; --notify: #d1336b; --shared: #4b5563;
    --ok: #1d8a4a; --part: #b7791f; --plan: #8b95a3; --extra: #a16207;
    --tint: 8%;
  }
  :root[data-theme="dark"] {
    --bg: #0e1218; --panel: #161c24; --ink: #e6ebf1; --muted: #9aa5b4; --line: #2a333f; --arrow: #5d6876;
    --src: #6aa1f5; --stream: #b98ae0; --proc: #7aa7f2; --gate: #4cc27f; --agent: #f2a250; --notify: #f07aa0; --shared: #a3adba;
    --ok: #4cc27f; --part: #e3b04f; --plan: #7d8796; --extra: #f5c542;
    --tint: 14%;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1218; --panel: #161c24; --ink: #e6ebf1; --muted: #9aa5b4; --line: #2a333f; --arrow: #5d6876;
      --src: #6aa1f5; --stream: #b98ae0; --proc: #7aa7f2; --gate: #4cc27f; --agent: #f2a250; --notify: #f07aa0; --shared: #a3adba;
      --ok: #4cc27f; --part: #e3b04f; --plan: #7d8796; --extra: #f5c542;
      --tint: 14%;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .page { max-width: 1200px; margin: 0 auto; padding: 22px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
  h1 { margin: 0; font-size: 21px; letter-spacing: .01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12.5px; color: var(--muted); margin: 12px 0 20px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .theme { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .theme button { border: 0; background: none; color: var(--muted); padding: 5px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .theme button[aria-pressed="true"] { background: var(--line); color: var(--ink); }

  svg.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .st { width: 14px; height: 14px; flex: none; }
  .st.ok { color: var(--ok); } .st.part { color: var(--part); } .st.plan { color: var(--plan); }

  .sec { --c: var(--src); border: 1.5px solid var(--c); border-radius: 12px;
         background: color-mix(in srgb, var(--c) var(--tint), var(--panel)); padding: 10px 12px 12px; }
  .sec > h2 { margin: 0 0 8px; font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--c);
              display: flex; align-items: center; gap: 7px; }
  .sec.src { --c: var(--src); } .sec.stream { --c: var(--stream); } .sec.proc { --c: var(--proc); }
  .sec.gate { --c: var(--gate); } .sec.agent { --c: var(--agent); } .sec.notify { --c: var(--notify); } .sec.shared { --c: var(--shared); }

  .grid { display: grid; gap: 8px; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 8px 9px;
          display: flex; flex-direction: column; gap: 4px; }
  .item .hd { display: flex; align-items: center; gap: 7px; font-weight: 650; font-size: 13px; }
  .item .hd svg.i { color: var(--c); }
  .item .hd .st { margin-left: auto; }
  .item ul { margin: 0; padding: 0; list-style: none; font-size: 12px; color: var(--muted); display: grid; gap: 2px; }
  .item li { display: flex; align-items: flex-start; gap: 5px; }
  .item li .st { width: 12px; height: 12px; margin-top: 2px; }
  .bar { margin-top: 8px; border: 1px dashed var(--c); border-radius: 8px; padding: 5px 9px; font-size: 12px;
         color: var(--ink); display: flex; align-items: center; gap: 7px; justify-content: center; background: var(--panel); }
  .bar svg.i { color: var(--c); width: 16px; height: 16px; }

  .down { display: flex; flex-direction: column; align-items: center; margin: 2px 0; }
  .down i { width: 2px; height: 14px; background: var(--arrow); }
  .down b { width: 0; height: 0; border: 6px solid transparent; border-top-color: var(--arrow); border-bottom: 0; }
  .down .tag { font: 600 11px ui-monospace, Menlo, monospace; color: var(--stream); border: 1px solid var(--line);
               background: var(--panel); border-radius: 999px; padding: 2px 10px; margin: 3px 0; }
  .row2 { display: grid; gap: 12px; grid-template-columns: 1fr 260px; align-items: stretch; }
  .decide { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin: 4px 0; }
  .diamond { width: 104px; height: 104px; display: grid; place-items: center; justify-self: center; }
  .diamond div { width: 74px; height: 74px; transform: rotate(45deg); border: 2px solid var(--proc);
                 background: var(--panel); display: grid; place-items: center; border-radius: 6px; }
  .diamond span { transform: rotate(-45deg); font-size: 11.5px; font-weight: 700; text-align: center; line-height: 1.2; }
  .h { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); --c: var(--proc); }
  .h::before { content: ""; height: 2px; width: 28px; background: var(--arrow); }
  .h .item { flex: 1; }
  .life { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; }
  .life .step { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line);
                border-radius: 999px; padding: 4px 11px; font-size: 12.5px; font-weight: 600; }
  .life .step svg.i { width: 16px; height: 16px; color: var(--agent); }
  .life .arr { color: var(--arrow); }
  /* Extended scope: built beyond the brief, shown inside the agent/step it belongs to */
  .item li.extra { background: color-mix(in srgb, var(--extra) var(--tint), transparent); border-left: 3px solid var(--extra);
                   border-radius: 4px; padding: 2px 5px; color: var(--ink); }
  .item li.extra .xs, .legend .xs { width: 12px; height: 12px; margin-top: 2px; flex: none; color: var(--extra); fill: currentColor; }
  .item.extra { border: 1.5px dashed var(--extra); }
  .item.extra .hd::after { content: "extra"; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
                           color: var(--extra); order: 1; }
  footer { color: var(--muted); font-size: 12px; margin-top: 18px; }

  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .row2 { grid-template-columns: 1fr; }
    .decide { grid-template-columns: 1fr; } .decide > :first-child { display: none; }
    .h::before { display: none; }
  }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }

  /* ── tabs ───────────────────────────────────────────────────────────── */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 14px 0 0; flex-wrap: wrap; }
  .tabs a { padding: 8px 14px; border-radius: 8px 8px 0 0; color: var(--muted); text-decoration: none; font-weight: 600;
            font-size: 13.5px; border: 1px solid transparent; border-bottom: 0; display: inline-flex; gap: 7px; align-items: center; }
  .tabs a svg.i { width: 16px; height: 16px; }
  .tabs a[aria-selected="true"] { color: var(--ink); background: var(--panel); border-color: var(--line); margin-bottom: -1px; }
  [hidden] { display: none !important; }

  /* ── research tab ───────────────────────────────────────────────────── */
  .rs { --c: var(--proc); }
  .rs a { color: var(--src); }
  .rs h2.t { margin: 26px 0 10px; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--c);
             display: flex; align-items: center; gap: 8px; }
  .rs h2.t svg.i { width: 18px; height: 18px; }
  .rs p { margin: 6px 0; }
  .rs .lead { font-size: 15px; line-height: 1.5; max-width: 900px; }
  .rs .muted { color: var(--muted); font-size: 12.5px; }
  .cards { display: grid; gap: 10px; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
  .card h3 { margin: 0 0 6px; font-size: 13.5px; display: flex; align-items: center; gap: 7px; }
  .card h3 svg.i { color: var(--c); width: 18px; height: 18px; }
  .card ul { margin: 4px 0 0; padding-left: 18px; font-size: 13px; }
  .card li { margin: 2px 0; }
  .card.hl { border: 1.5px solid var(--gate); background: color-mix(in srgb, var(--gate) var(--tint), var(--panel)); }
  .card.warn { border: 1.5px solid var(--part); background: color-mix(in srgb, var(--part) var(--tint), var(--panel)); }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line);
          color: var(--muted); background: var(--panel); white-space: nowrap; }
  .pill.g { color: var(--ok); border-color: var(--ok); } .pill.a { color: var(--part); border-color: var(--part); }
  .pill.n { color: var(--plan); border-color: var(--plan); }
  .tbl { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
         overflow: hidden; font-size: 12.5px; }
  .tblwrap { overflow-x: auto; border-radius: 10px; }
  .tbl th, .tbl td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tbl th { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: color-mix(in srgb, var(--line) 35%, var(--panel)); }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl td.c { text-align: center; }
  .tbl tr.me td { background: color-mix(in srgb, var(--gate) var(--tint), var(--panel)); font-weight: 600; }
  .y { color: var(--ok); font-weight: 700; } .x { color: #c2412d; font-weight: 700; } .q { color: var(--plan); font-weight: 700; } .h2 { color: var(--part); font-weight: 700; }
  .pipe { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
  .pipe .box { flex: 1 1 150px; background: var(--panel); border: 1.5px solid var(--c); border-radius: 9px; padding: 8px 10px; font-size: 12.5px; }
  .pipe .box b { display: block; font-size: 13px; margin-bottom: 2px; }
  .pipe .box.e { --c: var(--agent); } .pipe .box.g { --c: var(--gate); } .pipe .box.r { --c: var(--notify); }
  .pipe .ar { align-self: center; color: var(--arrow); font-weight: 700; }
  .gap { border-left: 4px solid var(--c); }
  .gap dl { display: grid; grid-template-columns: 150px 1fr; gap: 4px 10px; margin: 6px 0 0; font-size: 12.5px; }
  .gap dt { color: var(--muted); font-weight: 600; } .gap dd { margin: 0; }
  ol.refs { font-size: 12.5px; padding-left: 22px; } ol.refs li { margin: 3px 0; }
  .claim { font-size: 15px; line-height: 1.5; border: 1.5px dashed var(--gate); border-radius: 10px; padding: 12px 14px; background: var(--panel); }
  @media (max-width: 900px) { .cards { grid-template-columns: 1fr; } .gap dl { grid-template-columns: 1fr; } }

  /* ── progress bar (deliverables only) ────────────────────────────────── */
  .progress { margin: 16px 0 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
  .progress .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .progress .top b { font-size: 22px; } .progress .top span { color: var(--muted); font-size: 12.5px; }
  .track { display: flex; height: 14px; border-radius: 999px; background: var(--line); overflow: hidden; margin: 8px 0 7px; }
  .track > div { height: 100%; transition: width .6s ease; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--muted); }
  .keys span { display: inline-flex; align-items: center; gap: 6px; } .keys i { width: 10px; height: 10px; border-radius: 3px; }
  .keys b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .progress details { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
  .progress details summary { cursor: pointer; }

const icon = (id) => `<svg class="i"><use href="#${id}"/></svg>`;

  return "part";

// card with sub-points: [icon, title, [[key, text, extra?], ...]] — extra = extended scope (highlighted)
const line = ([k, t, extra]) => extra
  ? `<li class="extra" title="Extended scope — beyond the brief"><svg class="xs"><use href="#star"/></svg>${mark(S[k])}<span>${t}</span></li>`
  : `<li>${mark(S[k])}<span>${t}</span></li>`;
const card = (ic, title, lines) => `<div class="item"><div class="hd">${icon(ic)}${title}${mark(combined(lines.map(([k]) => k)))}</div>
  <ul>${lines.map(line).join("")}</ul></div>`;
// single feature: [icon, title, key, note, extra?]
const tile = (ic, title, k, note, extra) => `<div class="item${extra ? " extra" : ""}"><div class="hd">${icon(ic)}${title}${mark(S[k])}</div>${note ? `<ul><li><span>${note}</span></li></ul>` : ""}</div>`;
const X = true;   // marks an extended-scope line
const down = (tag) => `<div class="down"><i></i>${tag ? `<span class="tag">${tag}</span><i></i>` : ""}<b></b></div>`;

    ${tile("mail", "Email", "email", "Attachments from a mailbox")}
  </div></section>
  ${down()}
  <div class="row2">
    <section class="sec gate"><h2>${icon("gateway")}API gateway · scan · store</h2><div class="grid" style="--n:3">
      ${tile("gateway", "Gateway", "gateway", "Routing, rate limits, size caps")}
      ${tile("shield", "Virus scan", "scan", "Every file, before storage")}
      ${tile("db", "File storage", "store", "Originals kept in MinIO")}

      ${card("stream", "Kafka", [["stream", "Documents, metadata and status events — saved with each change"], ["eventLog", "Event log & failed events: kept, searchable, nothing lost", X]])}

  </div>

  ${down()}

  </div>
  ${down("document.classified · vendor.matched")}
  <section class="sec agent"><h2>${icon("bolt")}Procurement agents</h2><div class="grid" style="--n:5">

    ${card("approve", "Approval", [["rules", "Rules by spend tier"], ["routing", "Routing & escalation"], ["reminders", "Reminders before the deadline"], ["sod", "Separation of duties: nobody approves their own request", X], ["emailApprove", "Approve from email: single-use signed links", X], ["budgets", "Budget check before approval: over budget adds a finance step", X], ["catalog", "IT catalog: agreed prices, optional pre-approval, seat add-ons", X], ["rfq", "RFQs: sealed quotes, weighted comparison, rounds, award", X], ["bulkApprove", "Bulk approval: tick eligible requests, one confirmation; capped by amount, count and batch total", X]])}
    ${card("boxes", "Inventory", [["reserve", "Availability & reservation"], ["backorder", "Backorders"], ["reorder", "Reorder suggestions"], ["licenceMl", "Licence usage ML: anomalies → reclaim requests", X], ["match3", "3-way invoice match: line level, partial invoices, payment hold", X], ["receipts", "Partial deliveries with asset tags; invoices checked against what arrived", X], ["tds", "TDS kept with each booked invoice (net payable); MSME 45-day deadlines", X]])}
    ${card("pen", "Contract", [["templates", "Templates & versions"], ["esign", "E-signature, sent automatically"], ["renewals", "Renewals from notice deadline"], ["clauseModel", "Legal-BERT clause extraction (CUAD), rules as fallback", X], ["obligations", "Obligations after signing: SLA credits, seat limits, reminders", X], ["mandates", "Signing mandate: finance can let small bulk-approved contracts sign themselves, for up to 90 days, revocable", X]])}

    ${tile("bolt", "Redis", "platform")}
    ${tile("folder", "MinIO", "platform")}
    ${tile("sliders", "Rule engine", "ruleEngine")}
    ${tile("list", "Audit log", "platform")}

// ok = 1, part = ½, plan = 0.
const DELIVERABLES = [

    ["Risk from delivery & compliance", "ok"], ["Notifications", "ok"], ["Business-rules engine", "ok"],
  ]},
  { group: "Mentor feedback", color: "var(--agent)", items: [
    ["FR-01 Auto-send after approval", "ok"], ["FR-02 Renewals from notice deadline", "ok"], ["FR-03 Reminders for pending actions", "ok"],
    ["FR-04 Risk analysis documented", "ok"], ["FR-05 Demo script", "ok"], ["FR-06 Persistent Kafka monitoring", "ok"],
    ["FR-07 Searchable logs", "ok"], ["FR-08 Model routing & fallback", "ok"], ["FR-09 Business rules validated", "ok"],
    ["FR-10 Notification coverage", "ok"], ["FR-11 Layout accuracy", "ok"], ["FR-12 Presentation", "ok"],
    ["FR-13 Clause model", "ok"], ["FR-14 Sanctions screening", "ok"], ["FR-29 Trained classifier", "ok"],
    ["FR-31 Notification retry + DLQ", "ok"], ["FR-32 Licence model tuned", "ok"],

    ["Control Panel sections", "ok"], ["Architecture & functional flow diagrams", "ok"],
    ["Presentation slides", "ok"], ["Standard documentation", "ok"], ["MkDocs site published", "ok"],
  ]},
];
const W = { ok: 1, part: 0.5, plan: 0 };
const sum = (items) => items.reduce((a, [, st]) => a + W[st], 0);
const total = DELIVERABLES.reduce((a, g) => a + g.items.length, 0);
const done = DELIVERABLES.reduce((a, g) => a + sum(g.items), 0);
const pct = Math.round((done / total) * 100);
const fmt = (n) => (Number.isInteger(n) ? n : n.toFixed(1));
document.getElementById("progress").innerHTML = `

<h2 id="how">How a vendor is rated</h2>
<p>A fixed <b>100-point ruleset</b>: every check gives integer points, the same inputs always give the same score, and every score can be replayed.</p>
<div class="bar" role="img" aria-label="100 points: identity 39, performance 35, cyber 17, company 6, reputation 3">
  <div style="flex:39;background:#2563c9"><b>39</b><span>Identity</span></div>
  <div style="flex:35;background:#d9730d"><b>35</b><span>Performance</span></div>
  <div style="flex:17;background:#7a3fa3"><b>17</b><span>Cyber</span></div>
  <div style="flex:6;background:#0f7f86"><b>6</b></div>
  <div style="flex:3;background:#d1336b"><b>3</b></div>
</div>
<div class="groups">
  <div style="--c:#2563c9"><b>Identity · 39</b>GST 20 · sanctions 10 · bank 5 · country 4</div>
  <div style="--c:#d9730d"><b>Performance · 35</b>on-time 15 · feedback 12 · incidents 8</div>
  <div style="--c:#7a3fa3"><b>Cyber · 17</b>TLS 6 · certification 4 · breaches 4 · DMARC 3</div>
  <div style="--c:#0f7f86"><b>Company · 6</b>financial rating 4 · age 2</div>
  <div style="--c:#d1336b"><b>Reputation · 3</b>adverse media 3</div>
</div>
<div class="scale"><span style="background:#1d8a4a">Low</span><span style="background:#b7791f">Medium</span><span style="background:#c2412d">High</span></div>
<div class="ticks"><span>0–24</span><span>25–49</span><span>50–100</span></div>
<p><b>Hard overrides</b> make a vendor High whatever the points:</p>
<div class="over">
  <div style="--c:var(--bad)"><code>R-SAN-01</code> sanctions match<br><span class="pill r">never by a decision</span></div>
  <div style="--c:var(--bad)"><code>R-JUR-01</code> prohibited country<br><span class="pill r">never by a decision</span></div>
  <div style="--c:var(--warn)"><code>R-GST-01/02/03</code> GSTIN cancelled, suspended, not found<br><span class="pill w">remediable</span> or accepted for ≤ 30 days</div>
</div>
<p>Missing data is never counted as safe: a vendor whose checks aren't done is <b>Unrated</b>, never Low.</p>

<h2 id="clearance">Clearance: may this vendor be used?</h2>
<p>One decision (<code>clearance.py</code>) for <code>/clearance</code> and for contract signing, checked in this order:</p>
<div class="steps5">
  <div><b>A score?</b>None: not cleared</div>
  <div><b>Sanctions / country</b>Never cleared; signing blocked</div>
  <div><b>The score</b>Other overrides, Unrated or High block (petty purchases ≤ ₹50,000 excepted)</div>
  <div><b>Human decision</b>Reject blocks; approvals count only while still Low/Medium</div>
  <div><b>Vendor status</b>Must be active</div>
</div>
<p>Signing asks for an acknowledgement exactly when clearance says <i>not cleared</i>.</p>

<p>Each profile is an attempt to get a risky vendor through, or a check that a safe one isn't blocked for the wrong reason. Expected outcomes were written from the ruleset before running; the profiles go through the real engine and clearance code (<code>ml/redteam_scorecard.py</code>, run by <code>tests/test_risk_redteam.py</code> on every test run and by demo scenario 6).</p>

<p class="muted">Each fix was reverted once to check its test fails.</p>

<h2 id="team-vendors">The team's test vendors (23 Oct 2026)</h2>
<p>Three vendor profiles from the team, added as the last three red-team rows above and onboarded in the running stack. The red-team rows use the tier and the checks as the profiles describe them; the live rows are what the stack did with the same vendors.</p>
<div class="tblwrap"><table><thead><tr><th>Vendor</th><th>Profile expects</th><th>Red team (engine + clearance)</th><th>Live stack</th></tr></thead><tbody>
<tr><td><b>Caspian Petrochem Trading LLC</b><br><span class="muted">IR, tier High, Bank Melli (MELIIRTHXXX)</span></td><td>Sanctions 10 + jurisdiction 4 = 14 pts, points band Low, final High, not cleared; Phases 1 and 2 skipped, no HTTP calls</td><td><span class="pill g">as expected</span> 14 pts · Low → High · R-SAN-01 + R-JUR-01 · blocked; collector test: Phases 1 and 2 not run, no HTTP client opened</td><td><span class="pill w">High, blocked</span> 4 pts · R-JUR-01 only: the name isn't on the sanctions list, and the bank isn't screened (onboarding has no SWIFT field). Phases 1 and 2 ran</td></tr>
<tr><td><b>SSPL Solutions Private Limited</b><br><span class="muted">IN, tier Critical, GSTIN 26ABLCS7218R1ZG</span></td><td>10 pts, points band Low, final High, sanctions override, not cleared</td><td><span class="pill g">as expected</span> 10 pts · Low → High · R-SAN-01 · blocked</td><td><span class="pill g">as expected</span> the real sanctions list matches the name: 10 pts · R-SAN-01 · High · not cleared. Phases 1 and 2 still ran</td></tr>
<tr><td><b>3Five8 Technologies (ADDA, adda.io)</b><br><span class="muted">IN, tier Critical, historical breach reported</span></td><td>No breach points until the record and the entity match are verified; GST, bank, sanctions pending</td><td><span class="pill g">as expected</span> 0 pts · Unrated · provisional · blocked; breach not scored</td><td><span class="pill g">blocked</span> 0 pts · Unrated · provisional · not cleared</td></tr>
</tbody></table></div>
<p><b>Found and fixed:</b> the breach check never looked anything up. It recorded “0 breaches, HTTP 200 from Have I Been Pwned” for every vendor, so ADDA would have shown “no breach listed”. It now records <i>not checked</i> (<code>collect_breach</code>; test <code>test_unchecked_breach_history_is_not_reported_as_clean</code>, which fails on the old code).</p>
<p><b>Found on 23 Oct, fixed on 24 Oct</b> (Niraj, commit <code>abb334c</code>; tests in <code>tests/test_live_hotfixes.py</code>; the red team still passes 25/25 and the contract-risk suite 345 tests on 25 Oct):</p>
<ul>
<li><b>Fast-fail for onboarded vendors.</b> New vendors now start as <i>onboarding</i>, and a database trigger refuses to make a vendor active until it has a cleared rating, so the sanctions and jurisdiction short-circuit applies to them.</li>
<li><b>External checks crashing.</b> The missing <code>is_live_verification_enabled</code> is now in <code>shared/live_mode/checker.py</code>, and each Phase 2 check gets its own database session.</li>
<li><b>Website and e-mail checks.</b> They now open a real TLS connection and look up SPF/DMARC records. Simulated pass values are only used for demo domains (<code>.test</code>, <code>.example</code>, …), and with live checks switched off they record <i>not checked</i>.</li>
<li><b>Tier.</b> A vendor's inherent tier (low, moderate, high, critical) can be set at onboarding and is used when it is stricter than the spend tier.</li>
<li><b>Bank sanctions.</b> SWIFT/BIC and bank name can be recorded; the BIC is screened against the sanctions list and prohibited countries.</li>
</ul>
<p class="muted">Not re-checked live yet: the three vendors were onboarded before these fixes. Onboard them again on reset data to see the live column match the red-team column.</p>

<h2 id="evaluation">Evaluation on synthetic incident data</h2>
<p>The 400 test vendors the retired model was evaluated on, scored by the ruleset (<code>ml/evaluate_scorecard.py</code>). Their six features become scorecard checks; identity checks are clear (the data has none).</p>
<div class="tblwrap"><table><thead><tr><th>Model</th><th>ROC-AUC</th></tr></thead><tbody>
<tr><td><b>Deterministic ruleset (shipped)</b></td><td><b>0.738</b></td></tr>
<tr><td>Random Forest (retired)</td><td>0.715</td></tr>
<tr><td>Ceiling: the rule that made the labels</td><td>0.739</td></tr></tbody></table></div>
<div class="tblwrap"><table><thead><tr><th>Band</th><th>Vendors</th><th>Incidents</th><th>Incident rate</th></tr></thead><tbody><tr><td>Low</td><td>360</td><td>53</td><td>14.7%</td></tr><tr><td>Medium</td><td>40</td><td>19</td><td>47.5%</td></tr><tr><td>High</td><td>0</td><td>0</td><td>—</td></tr></tbody></table></div>
<p>The ruleset ranks vendors almost exactly as well as the labels allow, and Medium vendors had about three times the incident rate of Low ones. No test vendor reaches High on points alone: the dataset has no identity findings, so High comes from overrides. The labels are synthetic (a weighted rule plus noise); this measures agreement with that rule, not real-world prediction.</p>

<details class="more" id="merge-review"><summary>Merge review (21 Oct 2026)</summary>
<p>Merging Niraj's deterministic scorecard (<code>updated_risk</code>) needed fifteen fixes (F1–F15: duplicate migrations, a module/package clash, a migration that stopped the service, unseeded rules, silent alerts, 43 TypeScript errors, two endpoints that always failed, a broken e-mail template, a page that crashed the app). Eleven items were left for decision; their state now:</p>
<div class="tblwrap"><table><thead><tr><th>#</th><th>Item</th><th>Status</th></tr></thead><tbody>

<details class="more" id="retired"><summary>Retired ML model (for the record)</summary>
<p>The first risk model was a Random Forest on six features over 2,000 synthetic vendors: ROC-AUC 0.715 (ceiling 0.739), incident rate Low 6.5 % / Medium 20 % / High 40 %, 12/12 of its own red-team profiles. It was replaced because a procurement decision must be explained and replayed exactly, and a fixed ruleset does that; its code is kept in <code>services/contract-risk-agent/ml/archive/</code> and its numbers in <code>docs/results/risk-model.json</code>.</p>

</details>

<h2 id="limits">Limits</h2>
<ul>
<li>External sources (GST registry, TLS grading, DMARC, breach and media feeds) aren't connected in this stack. GST, breach and media are recorded as not checked, but website and e-mail still record fixed “good” results (see <a href="#team-vendors">the team's test vendors</a>).</li>
<li>The evaluation uses synthetic labels; there are no real incident outcomes yet.</li>
<li>The red team covers the rules as documented; it can't prove the collectors read real sources correctly.</li>
<li>Turning <code>approval.unrated_vendor_requires_finance</code> on routes most purchases to finance until vendors are fully assessed.</li></ul>

<div class="bar" id="bar">
  <div class="progress" id="progress"></div>
  <button type="button" id="prev" aria-label="Previous slide"><svg class="ic"><use href="#i-left"/></svg></button>
  <span class="count" id="count">1 / 1</span>

<div class="overview" id="overview" hidden>

<script>
(() => {
  const slides = [...document.querySelectorAll("#stage > .slide")];
  const stage = document.getElementById("stage"), viewport = document.getElementById("viewport");
  const notesPanel = document.getElementById("notesPanel"), overview = document.getElementById("overview");
  const $ = (id) => document.getElementById(id);
  let index = 0;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } },
  };

  slides.forEach((s, n) => {
    if (n === 0) return;
    const f = document.createElement("div");
    f.className = "foot";
    f.innerHTML = "<span>Agentic AI Procurement</span><span>" + (n + 1) + " / " + slides.length + "</span>";
    s.appendChild(f);
  });

  function fit() {
    const k = Math.min(viewport.clientWidth / 1920, viewport.clientHeight / 1080);
    stage.style.transform = "translate(-50%, -50%) scale(" + k + ")";
  }
  function go(n) {
    index = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((s, k) => { s.classList.toggle("on", k === index); s.setAttribute("aria-hidden", k === index ? "false" : "true"); });
    $("count").textContent = index + 1 + " / " + slides.length;
    $("now").textContent = slides[index].dataset.title;
    $("prev").disabled = index === 0;
    $("next").disabled = index === slides.length - 1;
    $("progress").style.width = ((index + 1) / slides.length) * 100 + "%";
    const note = slides[index].querySelector(".notes");
    notesPanel.innerHTML = "<b>Speaker notes · " + (index + 1) + "</b>";
    notesPanel.append(note ? note.textContent : "No notes for this slide.");
    store.set("deck-slide", index);
  }
  function toggleNotes(force) {
    const open = force !== undefined ? force : notesPanel.hidden;
    notesPanel.hidden = !open;
    $("notesBtn").setAttribute("aria-pressed", open ? "true" : "false");
    store.set("deck-notes", open ? "1" : "0");
    fit();
  }
  function toggleFull() {
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  }
  document.addEventListener("fullscreenchange", () => {
    const on = !!document.fullscreenElement;
    document.body.classList.toggle("fs", on);
    $("fsBtn").setAttribute("aria-pressed", on ? "true" : "false");
    fit();
  });
  let sleep;
  document.addEventListener("mousemove", () => {
    if (!document.body.classList.contains("fs")) return;
    document.body.classList.add("awake");
    clearTimeout(sleep);
    sleep = setTimeout(() => document.body.classList.remove("awake"), 2000);
  });

  function openGrid() {
    const grid = $("thumbs");
    if (!grid.childElementCount) {
      slides.forEach((s, n) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "thumb";
        const frame = document.createElement("div");
        frame.className = "frame";
        const inner = document.createElement("div");
        const copy = s.cloneNode(true);
        copy.removeAttribute("aria-hidden");
        copy.querySelectorAll("[id]").forEach((el) => el.removeAttribute("id"));
        copy.querySelectorAll("[tabindex]").forEach((el) => el.setAttribute("tabindex", "-1"));
        inner.appendChild(copy);
        frame.appendChild(inner);
        const label = document.createElement("span");
        label.innerHTML = "<b>" + (n + 1) + "</b>";
        label.append(s.dataset.title);
        b.append(frame, label);
        b.addEventListener("click", () => { go(n); closeGrid(); });
        grid.appendChild(b);
      });
    }
    overview.hidden = false;
    $("gridBtn").setAttribute("aria-pressed", "true");
    const thumbs = [...grid.children];
    thumbs.forEach((t, n) => t.setAttribute("aria-current", n === index ? "true" : "false"));
    const w = thumbs[0].querySelector(".frame").clientWidth;
    thumbs.forEach((t) => { t.querySelector(".frame > div").style.transform = "scale(" + w / 1920 + ")"; });
    thumbs[index].focus();
  }
  function closeGrid() {
    overview.hidden = true;
    $("gridBtn").setAttribute("aria-pressed", "false");
  }

  // architecture slides: click a box to light what it connects to
  document.querySelectorAll("#stage svg.arch").forEach((svg) => {
    const cap = svg.closest(".slide").querySelector(".arch-cap > span");
    const hint = cap.innerHTML;
    let selected = "";
    function clear() {
      selected = "";
      svg.classList.remove("focus");
      svg.querySelectorAll(".on").forEach((el) => el.classList.remove("on"));
      cap.innerHTML = hint;
    }
    function pick(node) {
      const id = node.dataset.id;
      if (selected === id) return clear();
      selected = id;
      svg.classList.add("focus");
      svg.querySelectorAll("[data-links]").forEach((el) => {
        el.classList.toggle("on", el.dataset.id === id || el.dataset.links.split(" ").includes(id));
      });
      cap.innerHTML = "";
      const b = document.createElement("b");
      b.textContent = node.dataset.name + ": ";
      cap.append(b, node.dataset.info);
    }
    svg.addEventListener("click", (e) => { const node = e.target.closest(".node"); node ? pick(node) : clear(); });
    svg.addEventListener("keydown", (e) => {
      const node = e.target.closest(".node");
      if (node && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.stopPropagation(); pick(node); }
    });
  });

  $("prev").addEventListener("click", () => go(index - 1));
  $("next").addEventListener("click", () => go(index + 1));
  $("notesBtn").addEventListener("click", () => toggleNotes());
  $("fsBtn").addEventListener("click", toggleFull);
  $("gridBtn").addEventListener("click", () => (overview.hidden ? openGrid() : closeGrid()));
  $("closeGrid").addEventListener("click", closeGrid);
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (!overview.hidden) { if (e.key === "Escape" || e.key === "g" || e.key === "G") { e.preventDefault(); closeGrid(); } return; }
    const k = e.key;
    if (k === "ArrowRight" || k === "PageDown" || (k === " " && !e.target.closest(".node"))) { e.preventDefault(); go(index + 1); }
    else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); go(index - 1); }
    else if (k === "Home") go(0);
    else if (k === "End") go(slides.length - 1);
    else if (k === "f" || k === "F") toggleFull();
    else if (k === "n" || k === "N") toggleNotes();
    else if (k === "g" || k === "G") openGrid();
  });
  window.addEventListener("resize", fit);

  go(Number(store.get("deck-slide")) || 0);
  toggleNotes(store.get("deck-notes") === "1");
  fit();
})();
</script>

<script>
const DASH = "present";
const DASHES = {"team": {"file": "index.html", "title": "Team workspace", "home": "home"}, "present": {"file": "presentation.html", "title": "Presentation", "home": "status"}};
const ALL = [{"id": "home", "file": "index", "label": "Overview", "dash": "team"}, {"id": "showcase", "file": "showcase", "label": "Showcase", "dash": "team"}, {"id": "demo-script", "file": "demo-script", "label": "Demo script", "dash": "team"}, {"id": "research", "file": "research", "label": "Research", "dash": "team"}, {"id": "code", "file": "codebase-guide", "label": "Codebase guide", "dash": "team"}, {"id": "deploy", "file": "deployment", "label": "Deployment", "dash": "team"}, {"id": "market", "file": "competitive-analysis", "label": "Competitors", "dash": "team"}, {"id": "interview", "file": "interview-prep", "label": "Interview prep", "dash": "team"}, {"id": "status", "file": "project-flow", "label": "Project status", "dash": "present"}, {"id": "risk", "file": "risk-model", "label": "Vendor risk", "dash": "present"}, {"id": "slides", "file": "slides", "label": "Slides", "dash": "present"}];
const ALIASES = {"demo-5min": ["showcase", "five"], "status/research": ["research", ""]};
const PAGES = ALL.filter((p) => p.dash === DASH);
const BY_FILE = Object.fromEntries(ALL.map((p) => [p.file, p.id]));
const frames = {};
// Runs inside every page's frame: links to other pages switch tabs, and
// "#anchor" links stay in the frame (a srcdoc frame resolves "#x" against
// the dashboard's address, which would load the whole dashboard into it).
const LINKS = "<scr" + "ipt>(" + function () {
  document.addEventListener("click", function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest && e.target.closest("a[href]");
    if (!a) return;
    var href = a.getAttribute("href");
    if (href.charAt(0) === "#") {
      e.preventDefault();
      var id = href.slice(1);
      if (!id) return;
      if (location.hash.slice(1) !== id) { location.hash = id; return; }
      var el = document.getElementById(decodeURIComponent(id));
      if (el) el.scrollIntoView({ behavior: "smooth" });
      return;
    }
    var m = href.match(/^(?:\.\/)?([a-z0-9-]+)\.html(?:#(.*))?$/);
    if (m && parent.routeLink && parent.routeLink(m[1], m[2] || "")) { e.preventDefault(); return; }
    if (!/^(javascript:|mailto:)/.test(href) && !a.target) a.target = "_blank";
  });
  window.addEventListener("hashchange", function () { parent.pageHash(location.hash.slice(1)); });
} + ")();</scr" + "ipt>";

function savedTheme() { try { return localStorage.getItem("theme"); } catch (e) { return null; } }
function isDark() {
  const t = document.documentElement.getAttribute("data-theme");
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
}
function setTheme(t) {
  try { if (t) localStorage.setItem("theme", t); } catch (e) {}
  const theme = t || savedTheme();
  const apply = (doc) => { if (doc && doc.documentElement && theme) doc.documentElement.setAttribute("data-theme", theme); };
  apply(document);
  Object.values(frames).forEach((f) => apply(f.contentDocument));
  document.querySelector("#theme use").setAttribute("href", isDark() ? "#i-sun" : "#i-moon");
}

function resolve(id, sub) {
  const head = (sub || "").split("/")[0];
  if (ALIASES[id + "/" + head]) { const [i, s] = ALIASES[id + "/" + head]; return [i, s || sub.split("/").slice(1).join("/")]; }
  if (ALIASES[id]) { const [i, s] = ALIASES[id]; return [i, sub || s]; }
  return [id, sub || ""];
}
function go(id, sub) {
  [id, sub] = resolve(id, sub);
  const page = ALL.find((p) => p.id === id);
  if (!page) { openPage(DASHES[DASH].home, ""); return; }
  if (page.dash !== DASH) { location.href = DASHES[page.dash].file + "#" + id + (sub ? "/" + sub : ""); return; }
  openPage(id, sub);
}
function routeLink(stem, hash) {
  const dash = Object.keys(DASHES).find((k) => DASHES[k].file === stem + ".html");
  if (dash) {
    if (!hash) { go(DASHES[dash].home, ""); return true; }
    const [id, ...rest] = hash.split("/");
    go(id, rest.join("/"));
    return true;
  }
  if (BY_FILE[stem] || ALIASES[stem]) { go(BY_FILE[stem] || stem, hash); return true; }
  return false;
}

let current = null;
function openPage(id, sub, fromHash) {
  if (!PAGES.some((p) => p.id === id)) id = DASHES[DASH].home;
  const page = PAGES.find((p) => p.id === id);
  if (!frames[id]) {
    const f = document.createElement("iframe");
    f.title = page.label;
    f.allowFullscreen = true;  // the Slides tab presents full screen
    f.srcdoc = "<!doctype html>" + document.getElementById("page-" + id).innerHTML + LINKS;
    f.addEventListener("load", () => { setTheme(); if (f.dataset.sub) jump(f, f.dataset.sub); });
    document.getElementById("main").appendChild(f);
    frames[id] = f;
  }
  Object.entries(frames).forEach(([k, f]) => { f.hidden = k !== id; });
  document.querySelectorAll("nav a").forEach((a) => a.setAttribute("aria-current", a.dataset.id === id ? "page" : "false"));
  const f = frames[id];
  if (sub) { f.dataset.sub = sub; if (f.contentDocument && f.contentDocument.readyState === "complete") jump(f, sub); }
  current = id;
  document.title = page.label + " · " + DASHES[DASH].title;
  if (!fromHash) history.replaceState(null, "", "#" + id + (sub ? "/" + sub : ""));
}
function jump(f, sub) {
  delete f.dataset.sub;
  try { f.contentWindow.location.hash = sub; } catch (e) {}
  const el = f.contentDocument && f.contentDocument.getElementById(decodeURIComponent(sub));
  if (el) el.scrollIntoView();
}
function pageHash(sub) { history.replaceState(null, "", "#" + current + (sub ? "/" + sub : "")); }
function fromLocation() {
  const [id, ...rest] = location.hash.slice(1).split("/");
  const [rid, rsub] = resolve(id || DASHES[DASH].home, rest.join("/"));
  const page = ALL.find((p) => p.id === rid);
  if (page && page.dash !== DASH) { go(rid, rsub); return; }
  openPage(rid, rsub, rid === id && rsub === rest.join("/"));  // an old id: show the new one in the address bar
}

(function main() {
  // Opened inside another dashboard's frame (an old link): let that dashboard show the page instead.
  if (window.parent !== window) {
    try {
      if (window.parent.go) { const [id, ...rest] = location.hash.slice(1).split("/"); window.parent.go(id || DASHES[DASH].home, rest.join("/")); return; }
    } catch (e) {}
  }
  document.querySelectorAll("nav a").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); openPage(a.dataset.id, ""); }));
  document.querySelectorAll(".mode a").forEach((a) => a.addEventListener("click", (e) => {
    if (a.dataset.dash === DASH) { e.preventDefault(); openPage(DASHES[DASH].home, ""); }
  }));
  document.getElementById("theme").addEventListener("click", () => setTheme(isDark() ? "light" : "dark"));
  const slim = (on) => { document.body.classList.toggle("slim", on); try { localStorage.setItem("dash-slim", on ? "1" : ""); } catch (e) {} };
  document.getElementById("slim").addEventListener("click", () => slim(!document.body.classList.contains("slim")));
  try { if (localStorage.getItem("dash-slim")) document.body.classList.add("slim"); } catch (e) {}
  window.addEventListener("hashchange", fromLocation);
  setTheme();
  fromLocation();
})();
</script>
