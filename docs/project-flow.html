<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Procurement Flow Status</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #fff; --ink: #17202b; --muted: #5d6877; --line: #d9dee5;
    --ok: #1f8a4c; --ok-bg: #e7f5ec; --wip: #a86a00; --wip-bg: #fdf3e1; --stop: #c23934; --stop-bg: #fcebea;
    --todo: #6b7686; --todo-bg: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1318; --panel: #171c23; --ink: #e7ebf0; --muted: #9ba6b5; --line: #2b333e;
      --ok: #4cc27f; --ok-bg: #12291c; --wip: #e3a73c; --wip-bg: #2c2311; --stop: #f0706a; --stop-bg: #331817;
      --todo: #9ba6b5; --todo-bg: #1f252d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1318; --panel: #171c23; --ink: #e7ebf0; --muted: #9ba6b5; --line: #2b333e;
    --ok: #4cc27f; --ok-bg: #12291c; --wip: #e3a73c; --wip-bg: #2c2311; --stop: #f0706a; --stop-bg: #331817;
    --todo: #9ba6b5; --todo-bg: #1f252d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .page { max-width: 1180px; margin: 0 auto; padding: 22px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; justify-content: space-between; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); margin: 14px 0 22px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .ok { --c: var(--ok); --cb: var(--ok-bg); } .wip { --c: var(--wip); --cb: var(--wip-bg); }
  .stop { --c: var(--stop); --cb: var(--stop-bg); } .todo { --c: var(--todo); --cb: var(--todo-bg); }
  .dot { background: var(--c); }
  h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; }

  /* lifecycle: a row of stations joined by a track */
  .track { display: grid; grid-template-columns: repeat(auto-fit, minmax(98px, 1fr)); gap: 18px 10px; position: relative; }
  .station { position: relative; text-align: center; padding-top: 4px; }
  .station::before { content: ""; position: absolute; top: 30px; left: -50%; width: 100%; height: 3px; background: var(--line); z-index: 0; }
  .station:first-child::before { display: none; }
  .badge { position: relative; z-index: 1; width: 54px; height: 54px; margin: 0 auto; border-radius: 50%;
           display: grid; place-items: center; font-size: 24px; background: var(--cb); border: 3px solid var(--c); }
  .name { font-weight: 650; font-size: 13px; margin-top: 7px; }
  .note { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: 5px; }
  .chip { font: 600 10.5px ui-monospace, Menlo, monospace; border: 1.5px solid var(--c); color: var(--c);
          background: var(--cb); border-radius: 999px; padding: 0 6px; }

  /* side systems */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--c);
          border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; }
  .card .ic { font-size: 22px; line-height: 1; }
  .card .name { margin: 0; text-align: left; }
  .card .note, .card .chips { text-align: left; justify-content: flex-start; }

  /* roadmap */
  .phase { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .phase-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .phase-top b { font-size: 14px; } .phase-top .sub { flex: 1; }
  .bar { height: 8px; border-radius: 999px; background: var(--todo-bg); overflow: hidden; margin: 8px 0 10px; display: flex; }
  .bar i { display: block; height: 100%; }
  .items { display: flex; flex-wrap: wrap; gap: 6px; }
  .item { font-size: 12px; border: 1.5px solid var(--c); background: var(--cb); border-radius: 8px; padding: 3px 8px; }
  .item b { font-family: ui-monospace, Menlo, monospace; color: var(--c); margin-right: 4px; }
  .item.ok { text-decoration: none; }
  footer { color: var(--muted); font-size: 12px; margin-top: 22px; }
  @media (max-width: 640px) { .station::before { display: none; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <h1>IT Procurement Platform — flow &amp; status</h1>
      <div class="sub" id="updated"></div>
    </div>
    <div class="sub" id="totals"></div>
  </header>
  <div class="legend">
    <span><i class="dot ok"></i>Done</span>
    <span><i class="dot wip"></i>Works, roadmap item open</span>
    <span><i class="dot stop"></i>Needs a person</span>
    <span><i class="dot todo"></i>Not started</span>
  </div>

  <h2>One purchase, start to finish</h2>
  <div class="track" id="flow"></div>

  <h2>Around the flow</h2>
  <div class="cards" id="side"></div>

  <h2>Roadmap</h2>
  <div id="roadmap"></div>

  <footer>Statuses are updated at every roadmap phase from TODO.md (dated evidence per item).
    Hover a chip for its title.</footer>
</div>

<script>
// ── Update here at every phase ─────────────────────────────────────────
const UPDATED = "16 Oct 2026 · branch anjali";

// Roadmap items: status ok | wip | stop | todo  (TODO.md is the source)
const ITEMS = {
  "FR-01": ["ok", "Auto-send for signature"], "FR-02": ["ok", "Renewals from notice deadline"],
  "FR-03": ["ok", "Pending-action reminders"], "FR-04": ["wip", "Risk model evaluated"],
  "FR-05": ["todo", "Demo script"], "FR-06": ["ok", "Kafka log kept"], "FR-07": ["ok", "Searchable logs"],
  "FR-08": ["todo", "Fallback on demand"], "FR-09": ["todo", "Business rules tested"],
  "FR-10": ["todo", "Notification audit"], "FR-11": ["todo", "Extraction accuracy"],
  "FR-12": ["todo", "Results & deck"], "FR-13": ["todo", "Clause model"], "FR-14": ["todo", "Sanctions + IFSC"],
  "FR-29": ["todo", "Train classifier"], "FR-30": ["todo", "Risk signals from data"],
  "FR-31": ["todo", "Notification retry"], "FR-32": ["todo", "Licence model tuned"],
  "FR-33": ["stop", "Rotate keys, real secrets"],
  "FR-15": ["todo", "PySpark job"], "FR-16": ["todo", "Helm on kind"], "FR-17": ["todo", "Data pages"],
  "FR-18": ["todo", "Trace view"], "FR-19": ["todo", "Re-verify 26 Sep items"],
  "FR-20": ["todo", "Delivery tracking"], "FR-21": ["todo", "Vendor scorecard"], "FR-22": ["todo", "Weekly report"],
  "FR-23": ["todo", "SaaS overlap"], "FR-24": ["todo", "MCP server"],
  "FR-25": ["todo", "CI runs tests"], "FR-26": ["todo", "Fresh-clone rehearsal"],
  "FR-27": ["todo", "Security P1s"], "FR-28": ["todo", "Final docs"],
};
const PHASES = [
  ["R0", "by 24 Oct", "mentor feedback + every open box above",
   ["FR-01","FR-02","FR-03","FR-04","FR-05","FR-06","FR-07","FR-08","FR-09","FR-10","FR-11","FR-12","FR-13","FR-14","FR-29","FR-30","FR-31","FR-32","FR-33"]],
  ["R1", "by 31 Oct", "what the docs say we have", ["FR-15","FR-16","FR-17","FR-18","FR-19"]],
  ["R2", "if time", "features other tools have", ["FR-20","FR-21","FR-22","FR-23","FR-24"]],
  ["R3", "November", "testing, evidence, submission", ["FR-25","FR-26","FR-27","FR-28"]],
];
// The purchase flow. A stage is green when it works and has no open item.
const FLOW = [
  ["📄", "Upload / drop folder", "virus-scanned, stored", []],
  ["🔍", "Read the document", "OCR 0.50 → 0.93", ["FR-11", "FR-29"]],
  ["👀", "Review if unsure", "", ["FR-03"]],
  ["🏢", "Vendor check", "match · bank guard", []],
  ["📝", "Purchase request", "auto or from invoice", []],
  ["✅", "Approval", "by spend tier", ["FR-03"]],
  ["📃", "Contract", "PDF · notice reminders", ["FR-13"]],
  ["✍️", "E-signature", "built-in, auto-sent", []],
  ["📦", "Ordered → received", "", []],
  ["💰", "Invoice matched", "3-way, in INR", []],
];
const SIDE = [
  ["📊", "Vendor risk", "AUC 0.715 · red-team 12/12", ["FR-04", "FR-14", "FR-30"]],
  ["🖥️", "Control Panel", "Kafka log kept & searchable · failed events", ["FR-06"]],
  ["🔔", "Notifications", "email via shared mailer", ["FR-10", "FR-31"]],
  ["🔑", "Licence usage ML", "anomaly → reclaim", ["FR-32"]],
  ["💬", "Chatbot", "Anooj's area · fallback spec only", ["FR-08"]],
  ["🔐", "Credentials", "rotate GSTIN key, real secrets", ["FR-33"]],
];
// ───────────────────────────────────────────────────────────────────────

// Green when every item on it is done; red if one needs a person; else amber.
const status = (ids) => {
  const open = ids.filter((id) => ITEMS[id][0] !== "ok");
  return open.length === 0 ? "ok" : open.some((id) => ITEMS[id][0] === "stop") ? "stop" : "wip";
};
const chips = (ids) => ids.filter((id) => ITEMS[id][0] !== "ok")
  .map((id) => `<span class="chip ${ITEMS[id][0] === "stop" ? "stop" : "wip"}" title="${ITEMS[id][1]}">${id}</span>`).join("");

document.getElementById("updated").textContent = "Updated " + UPDATED;
document.getElementById("flow").innerHTML = FLOW.map(([ic, name, note, ids]) =>
  `<div class="station ${status(ids)}"><div class="badge">${ic}</div><div class="name">${name}</div>
   ${note ? `<div class="note">${note}</div>` : ""}<div class="chips">${chips(ids)}</div></div>`).join("");
document.getElementById("side").innerHTML = SIDE.map(([ic, name, note, ids]) =>
  `<div class="card ${status(ids)}"><div class="ic">${ic}</div><div><div class="name">${name}</div>
   <div class="note">${note}</div><div class="chips">${chips(ids)}</div></div></div>`).join("");
document.getElementById("roadmap").innerHTML = PHASES.map(([ph, when, what, ids]) => {
  const n = (s) => ids.filter((id) => ITEMS[id][0] === s).length;
  const seg = ["ok", "wip", "stop"].map((s) => `<i class="${s}" style="width:${100 * n(s) / ids.length}%;background:var(--c)"></i>`).join("");
  return `<div class="phase"><div class="phase-top"><b>${ph}</b><span class="sub">${what} · ${when}</span>
    <span class="sub">${n("ok")} / ${ids.length} done</span></div><div class="bar">${seg}</div>
    <div class="items">${ids.map((id) => `<span class="item ${ITEMS[id][0]}"><b>${id}</b>${ITEMS[id][1]}</span>`).join("")}</div></div>`;
}).join("");
const all = Object.values(ITEMS), done = all.filter(([s]) => s === "ok").length;
document.getElementById("totals").textContent = `${done} of ${all.length} roadmap items done`;
</script>
</body>
</html>
