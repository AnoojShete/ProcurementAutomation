events {}
http {
  include mime.types;
  default_type application/octet-stream;

  server {
    listen 80;

    # Static frontend (frontend/public, volume-mounted into this
    # container — see docker-compose.override.yml's `nginx` entry) served
    # from the same origin as /api/*, so no CORS setup is needed.
    root /usr/share/nginx/frontend;
    index index.html;
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Every location below strips the /api/<prefix>/ segment before
    # forwarding — proxy_pass with a trailing path replaces the matched
    # location prefix with that path, rather than passing the full
    # original /api/... URI straight through (which none of the backend
    # services' own routers are mounted at). Verified live: without the
    # trailing path on proxy_pass, every route 404'd through the gateway
    # despite working fine on the service's own port.

    location /api/documents/ {
      proxy_pass http://document-vendor-agent:8001/documents/;
    }
    location /api/requests/ {
      proxy_pass http://approval-inventory-agent:8002/requests/;
    }
    location /api/inventory/ {
      proxy_pass http://approval-inventory-agent:8002/inventory/;
    }
    location /api/inbox/ {
      proxy_pass http://approval-inventory-agent:8002/inbox/;
    }
    location /api/contracts/ {
      proxy_pass http://contract-risk-agent:8003/contracts/;
    }
    # document-vendor-agent and contract-risk-agent both own sub-paths
    # under /api/vendors/* (payment-detail verification vs risk scoring).
    # nginx checks regex (~) locations before the plain prefix location
    # below, so these two specific sub-paths route to document-vendor-agent
    # and everything else under /api/vendors/ falls through to
    # contract-risk-agent.
    location ~ ^/api/vendors/([^/]+)/(payment-changes|verify-payment-change) {
      proxy_pass http://document-vendor-agent:8001/vendors/$1/$2;
    }
    location /api/vendors/ {
      # Covers /risk, /risk/recompute, /log-outcome, /offboard, and
      # /risk-model/drift-check — all other vendor-scoped endpoints live
      # on contract-risk-agent.
      proxy_pass http://contract-risk-agent:8003/vendors/;
    }
    location /api/webhooks/ {
      # E-sign provider callback (POST /webhooks/esign) — not JWT-gated,
      # see contract-risk-agent/app/api/webhooks.py.
      proxy_pass http://contract-risk-agent:8003/webhooks/;
    }
    location /api/notifications/ {
      proxy_pass http://notification-agent:8004/notifications/;
    }
    location /api/auth/ {
      proxy_pass http://auth-service:8005/auth/;
    }
  }
}
