events {}
http {
  include mime.types;
  default_type application/octet-stream;

  # Server hardening (OWASP API4 / API8)
  server_tokens off;
  client_header_timeout 10s;
  client_body_timeout 10s;
  keepalive_timeout 30s;
  client_header_buffer_size 1k;
  large_client_header_buffers 4 16k;

  # Default maximum body size: 1 MB (API4)
  # Overridden to larger values only on specific document upload locations.
  client_max_body_size 1m;

  # Services see the gateway's address as the client; this passes on the real one
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Correlation-ID $request_id;

  # Rate limiting and connection limiting zones
  limit_conn_zone $binary_remote_addr zone=addr_conn:10m;
  limit_req_zone $binary_remote_addr zone=auth_login:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=auth_email:10m rate=6r/m;
  limit_req_status 429;

  server {
    listen 80;
    limit_conn addr_conn 30;

    # Security headers (OWASP API8)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob: data: http://localhost:3010; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Error handling in standardized JSON shape
    error_page 429 = @rate_limited;
    location @rate_limited {
      default_type application/json;
      return 429 '{"error":{"code":"rate_limited","message":"Too many requests from your network. Wait a minute and try again."}}';
    }
    error_page 413 = @too_large;
    location @too_large {
      default_type application/json;
      return 413 '{"error":{"code":"file_too_large","message":"File is too large — payload exceeds the allowed size limit."}}';
    }

    # Deny by default outside development: metrics, docs, openapi.json (API5, API9)
    location ~* ^/(metrics$|docs$|openapi\.json$) {
      default_type application/json;
      return 404 '{"error":{"code":"not_found","message":"Not found"}}';
    }

    # API Versioning: /api/v1/ compatibility rewrite
    location ~ ^/api/v1/(.*)$ {
      rewrite ^/api/v1/(.*)$ /api/$1 last;
    }

    root /usr/share/nginx/frontend;
    index index.html;
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Email-based approval confirmation page and decision flow
    location /email-action/ {
      access_log off;
      proxy_pass http://approval-inventory-agent:8002/email-action/;
    }

    # Multi-file upload: up to 20 files / 100 MB per request
    location = /api/documents/upload/batch {
      client_max_body_size 100m;
      proxy_pass http://document-vendor-agent:8001/documents/upload/batch;
    }
    # Direct single file upload with unbuffered streaming (Prompt 11 Section 4.5)
    location = /api/documents/upload {
      client_max_body_size 30m;
      proxy_request_buffering off;
      proxy_pass http://document-vendor-agent:8001/documents/upload;
    }
    location /api/documents/ {
      proxy_pass http://document-vendor-agent:8001/documents/;
    }
    location /api/requests/ {
      proxy_pass http://approval-inventory-agent:8002/requests/;
    }
    location /api/inventory/ {
      proxy_pass http://approval-inventory-agent:8002/inventory/;
    }
    location /api/licenses/ {
      proxy_pass http://approval-inventory-agent:8002/licenses/;
    }
    location /api/authority/ {
      proxy_pass http://approval-inventory-agent:8002/authority/;
    }
    location /api/invoices/ {
      proxy_pass http://approval-inventory-agent:8002/invoices/;
    }
    location /api/ops/ {
      proxy_pass http://approval-inventory-agent:8002/ops/;
    }
    location /api/orders/ {
      proxy_pass http://approval-inventory-agent:8002/orders/;
    }
    location /api/inbox/ {
      proxy_pass http://approval-inventory-agent:8002/inbox/;
    }
    location /api/budgets/ {
      proxy_pass http://approval-inventory-agent:8002/budgets/;
    }
    location /api/catalog/ {
      proxy_pass http://approval-inventory-agent:8002/catalog/;
    }
    location /api/rfqs/ {
      proxy_pass http://approval-inventory-agent:8002/rfqs/;
    }
    location /api/tds/ {
      proxy_pass http://approval-inventory-agent:8002/tds/;
    }
    # GSTR-2B files are JSON downloads from the GST portal (max 10 MB)
    location /api/gst/ {
      client_max_body_size 11m;
      proxy_pass http://document-vendor-agent:8001/gst/;
    }
    # Signing mandates
    location /api/mandates {
      proxy_pass http://contract-risk-agent:8003/mandates;
    }
    location /api/contracts/ {
      proxy_pass http://contract-risk-agent:8003/contracts/;
    }
    # Cross-vendor bank-detail verification queue
    location = /api/vendors/payment-changes/pending {
      proxy_pass http://document-vendor-agent:8001/vendors/payment-changes/pending;
    }
    # Vendor onboarding and profile checks
    location ~ ^/api/vendors/(onboard|onboard/validate)$ {
      proxy_pass http://document-vendor-agent:8001/vendors/$1;
    }
    location ~ ^/api/vendors/([^/]+)/(payment-changes|verify-payment-change|confirm-no-gstin|spend-summary|details) {
      proxy_pass http://document-vendor-agent:8001/vendors/$1/$2;
    }
    location /api/vendors/ {
      proxy_pass http://contract-risk-agent:8003/vendors/;
    }
    location /api/webhooks/ {
      proxy_pass http://contract-risk-agent:8003/webhooks/;
    }
    location /api/notifications/ {
      proxy_pass http://notification-agent:8004/notifications/;
    }
    location = /api/notifications/unsubscribe {
      proxy_pass http://notification-agent:8004/notifications/unsubscribe;
    }
    location = /api/notifications/placeholders {
      proxy_pass http://notification-agent:8004/notifications/placeholders;
    }
    location /api/SmtpSettings/ {
      proxy_pass http://notification-agent:8004/smtp/;
    }
    location /api/smtp/ {
      proxy_pass http://notification-agent:8004/smtp/;
    }
    location ~ ^/api/auth/(login|register|verify-email|reset-password|change-password|verify-password|step-up)$ {
      limit_req zone=auth_login burst=20 nodelay;
      proxy_pass http://auth-service:8005/auth/$1;
    }
    location ~ ^/api/auth/(forgot-password|resend-verification)$ {
      limit_req zone=auth_email burst=5 nodelay;
      proxy_pass http://auth-service:8005/auth/$1;
    }
    location = /api/chat/stream {
      proxy_read_timeout 300s;
      proxy_connect_timeout 300s;
      proxy_send_timeout 300s;
      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Connection '';
      proxy_http_version 1.1;
      chunked_transfer_encoding on;
      proxy_pass http://chatbot-agent:8006/chat/stream;
    }
    location /api/chat/ {
      proxy_read_timeout 300s;
      proxy_connect_timeout 300s;
      proxy_send_timeout 300s;
      proxy_pass http://chatbot-agent:8006/chat/;
    }
    location /api/auth/ {
      proxy_pass http://auth-service:8005/auth/;
    }
    location /api/admin/business-rules {
      proxy_pass http://auth-service:8005/admin/business-rules;
    }
    location /api/admin/security/ {
      proxy_pass http://auth-service:8005/admin/security/;
    }
    location /api/admin/privacy/ {
      proxy_pass http://notification-agent:8004/admin/privacy/;
    }
    location /api/admin/risk-rulesets {
      proxy_pass http://contract-risk-agent:8003/admin/risk-rulesets;
    }
    location /api/admin/breach-catalogue {
      proxy_pass http://contract-risk-agent:8003/admin/breach-catalogue;
    }
    location /api/admin/ {
      proxy_pass http://document-vendor-agent:8001/admin/;
    }
    # Any /api/ path no service owns: a JSON 404 in the API's error shape.
    location /api/ {
      default_type application/json;
      return 404 '{"error":{"code":"not_found","message":"No API endpoint at this path."}}';
    }
  }
}
