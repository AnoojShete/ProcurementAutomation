events {}
http {
  server {
    listen 80;

    location /api/documents/ {
      proxy_pass http://document-vendor-agent:8001;
    }
    location /api/requests/ {
      proxy_pass http://approval-inventory-agent:8002;
    }
    location /api/inventory/ {
      proxy_pass http://approval-inventory-agent:8002;
    }
    location /api/inbox/ {
      proxy_pass http://approval-inventory-agent:8002;
    }
    location /api/contracts/ {
      proxy_pass http://contract-risk-agent:8003;
    }
    location ~ ^/api/vendors/.*/risk {
      proxy_pass http://contract-risk-agent:8003;
    }
    location /api/notifications/ {
      proxy_pass http://notification-agent:8004;
    }
  }
}
