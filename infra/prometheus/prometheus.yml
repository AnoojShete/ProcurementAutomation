global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'document-vendor-agent'
    metrics_path: /metrics
    static_configs:
      - targets: ['document-vendor-agent:8001']

  - job_name: 'approval-inventory-agent'
    metrics_path: /metrics
    static_configs:
      - targets: ['approval-inventory-agent:8002']

  - job_name: 'contract-risk-agent'
    metrics_path: /metrics
    static_configs:
      - targets: ['contract-risk-agent:8003']

  - job_name: 'notification-agent'
    metrics_path: /metrics
    static_configs:
      - targets: ['notification-agent:8004']

  - job_name: 'auth-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['auth-service:8005']

  # The two jobs below scrape WORKER containers, not the API containers
  # above. Custom business metrics (app/metrics.py in each service) are
  # updated wherever the relevant code actually executes — for
  # document-vendor-agent that's exclusively its worker (the extraction
  # pipeline), and for approval-inventory-agent's escalation counter
  # that's the Temporal activity running in its worker — neither of which
  # runs a FastAPI/Instrumentator app, so each exposes a minimal
  # metrics-only server via prometheus_client.start_http_server(9100)
  # instead (see each service's app/worker.py).
  - job_name: 'document-vendor-agent-worker'
    metrics_path: /metrics
    static_configs:
      - targets: ['document-vendor-agent-worker:9100']

  - job_name: 'approval-inventory-agent-worker'
    metrics_path: /metrics
    static_configs:
      - targets: ['approval-inventory-agent-worker:9100']
