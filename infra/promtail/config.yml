# Ships every container's log lines to Loki (FR-07). Containers are found
# through the Docker socket (read-only); JSON lines from the services are
# parsed so Grafana can filter on correlation_id, service and level.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      # Not the log stack itself: Loki logs every query (with the searched
      # correlation id in it), which would match its own searches.
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        regex: "loki|promtail|grafana"
        action: drop
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project
      - target_label: job
        replacement: docker
    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level:
