# Kafka permissions: who may publish (write) and subscribe to (read) what.
# Applied to Redpanda by bootstrap.sh; anything not listed here is denied.
# Mirrors the "Published by / Consumed by" table in shared/schemas/events.md
# (tests/test_kafka_acls.py checks this file against the code).
#
# user                        permission  resource  name

# --- document-vendor-agent (API + worker) ---
document-vendor-agent         write       topic     document.ingested
document-vendor-agent         write       topic     document.classified
document-vendor-agent         write       topic     vendor.matched
document-vendor-agent         write       topic     vendor.payment_details_flagged
document-vendor-agent         write       topic     invoice.matched
document-vendor-agent         read        topic     document.ingested
document-vendor-agent         read        topic     business_rule.updated
document-vendor-agent         alter       topic     document.ingested
document-vendor-agent         read        group     document-vendor-agent

# --- approval-inventory-agent (API + Temporal worker) ---
approval-inventory-agent      write       topic     approval.requested
approval-inventory-agent      write       topic     approval.decided
approval-inventory-agent      write       topic     license.usage.updated
approval-inventory-agent      write       topic     notification.send
approval-inventory-agent      write       topic     order.summary.generated
approval-inventory-agent      read        topic     document.classified
approval-inventory-agent      read        topic     contract.signed
approval-inventory-agent      read        topic     invoice.matched
approval-inventory-agent      read        topic     business_rule.updated
approval-inventory-agent      read        group     approval-inventory-agent

# --- contract-risk-agent (API + Temporal worker) ---
contract-risk-agent           write       topic     contract.generated
contract-risk-agent           write       topic     contract.signed
contract-risk-agent           write       topic     contract.renewal.due
contract-risk-agent           write       topic     risk.score.updated
contract-risk-agent           write       topic     vendor.offboarded
contract-risk-agent           write       topic     notification.send
contract-risk-agent           read        topic     vendor.matched
contract-risk-agent           read        topic     approval.decided
contract-risk-agent           read        topic     business_rule.updated
contract-risk-agent           read        group     contract-risk-agent

# --- notification-agent (only listens) ---
notification-agent            read        topic     document.classified
notification-agent            read        topic     vendor.payment_details_flagged
notification-agent            read        topic     license.usage.updated
notification-agent            read        topic     approval.requested
notification-agent            read        topic     approval.decided
notification-agent            read        topic     contract.generated
notification-agent            read        topic     contract.signed
notification-agent            read        topic     contract.renewal.due
notification-agent            read        topic     risk.score.updated
notification-agent            read        topic     vendor.offboarded
notification-agent            read        topic     notification.send
notification-agent            read        group     notification-agent

# --- auth-service (business rules) ---
auth-service                  write       topic     business_rule.updated

# --- kafka-exporter (metrics: looks, never reads messages) ---
kafka-exporter                describe    topic     *
kafka-exporter                describe    group     *
kafka-exporter                describe    cluster   kafka-cluster
