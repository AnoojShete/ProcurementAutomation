# Static config for the Notification Agent. Env-derived settings (DB URL,
# Kafka bootstrap, SMTP host) live in app/config.py's Settings instead.

# Fallback recipient used when an event's payload has no directly-addressable
# human contact and the DB lookup (see app/services/directory.py) can't
# resolve one either (e.g. document.classified, vendor.offboarded,
# risk.score.updated, license.usage.updated all lack a `recipient` field
# per shared/schemas/events.md — only notification.send carries one).
default_recipient: "procurement-ops@example.com"

# How often the digest queue is flushed into one batched email per
# recipient. A real deployment would run this ~daily; shortened here so a
# demo/grader can see a flush happen without waiting a full day.
digest_flush_interval_seconds: 300

# risk.score.updated is only "urgent" at this band; everything else digests.
urgent_risk_bands: ["High"]

# contract.renewal.due only escalates to urgent at these alert levels
# (days-remaining milestones); the rest (e.g. 60/30) are digested.
urgent_renewal_alert_levels: ["15"]

# Shared mailboxes each role reads in the app (bell + Notifications page),
# on top of mail addressed to the person's own email. These are the
# placeholder addresses events are sent to when no person is known.
role_mailboxes:
  approver: ["dept_manager@users.procurement.local", "finance_head@users.procurement.local"]
  finance: ["finance_head@users.procurement.local", "procurement-ops@example.com", "procurement-risk-team@company.com"]
  admin: ["procurement-ops@example.com", "procurement-risk-team@company.com",
          "dept_manager@users.procurement.local", "finance_head@users.procurement.local"]
